  // Purement informatif : signale quand une limite (score ou temps) réglée par l'organisateur
  // est atteinte, sans rien forcer — c'est à l'organisateur de décider d'arrêter la partie.
  function updateLimitsBanner(){
    var el = document.getElementById("limits-banner");
    if(!el || !state.event) return;
    var msgs = [];
    var cfg = state.event;
    var score = state.cachedScore || {};
    if(cfg.scoreLimit){
      var leader = Object.keys(score).filter(function(t){ return t !== "Staff"; })
        .find(function(t){ return (score[t]||0) >= cfg.scoreLimit; });
      if(leader) msgs.push("🏆 " + escapeHtml(leader) + " a atteint la limite de score (" + cfg.scoreLimit + " pts).");
    }
    if(cfg.timeLimitMinutes && cfg.createdAt){
      var elapsedMin = (Date.now() - cfg.createdAt) / 60000;
      if(elapsedMin >= cfg.timeLimitMinutes) msgs.push("⏱️ Temps écoulé (" + cfg.timeLimitMinutes + " min).");
    }
    el.innerHTML = msgs.length ? ('<div class="warzone-alert active">' + msgs.map(function(m){ return '<div class="wz-name" style="font-size:11px;">'+m+'</div>'; }).join("") + '</div>') : "";
  }

  async function refreshZones(){
    if(!state.event) return;
    state.networkOk = true;
    var zones = await loadZones(state.event.code);
    if(!state.networkOk){
      var cached = loadOfflineCache(state.event.code);
      if(cached && cached.zones) zones = cached.zones;
    } else {
      var existing = loadOfflineCache(state.event.code) || {};
      saveOfflineCache(state.event.code, Object.assign({}, existing, { zones: zones, ts: Date.now() }));
      // Seuls les joueurs qui se trouvent EUX-MÊMES dans une zone drapeau calculent et
      // écrivent la progression — ça évite que tout le monde réécrive les zones à chaque
      // cycle, alors que seule une poignée de joueurs est concernée à un instant donné.
      if(state.lastCoords){
        var amInFlag = zones.some(function(z){ return z.kind === "drapeau" && pointInPolygon(state.lastCoords.lat, state.lastCoords.lng, z.points); });
        if(amInFlag){
          var tick = tickFlagCaptures(zones, state.cachedAllPlayers || {}, state.event);
          if(tick.dirty) await saveZones(state.event.code, zones);
          var teamsWithDelta = Object.keys(tick.scoreDelta);
          if(teamsWithDelta.length){
            var score = await loadScore(state.event.code);
            teamsWithDelta.forEach(function(team){ score[team] = (score[team]||0) + tick.scoreDelta[team]; });
            await saveScore(state.event.code, score);
            state.cachedScore = score;
          }
          tick.captureEvents.forEach(function(ev){
            appendEventLog(state.event.code, { ts: Date.now(), type: "flag_capture", name: ev.flagName, team: ev.team });
          });
        }
      }
      // Scénario personnalisé : auto-complète les objectifs liés à un drapeau déjà capturé,
      // et déclenche le gaz de fin si tous les objectifs viennent d'être atteints.
      var scResult = tickScenario(zones);
      if(scResult){
        await saveEventConfig(state.event);
        if(scResult.newGasZone){
          zones.push(scResult.newGasZone);
          await saveZones(state.event.code, zones);
        }
        scResult.completedTitles.forEach(function(title){
          appendEventLog(state.event.code, { ts: Date.now(), type: "objective_complete", name: title, team: null });
        });
        if(scResult.gasTriggered){
          appendEventLog(state.event.code, { ts: Date.now(), type: "gas_triggered", name: "Scénario", team: null });
        }
      }
    }
    state.cachedZones = zones;
    updateZonePolygons(zones);
    updateWarzoneBanner(zones);
    updateGasBanner(zones);
    updateFlagCaptureBanner(zones);
    updateScenarioBanner();
    if(state.networkOk){ state.cachedScore = await loadScore(state.event.code); }
    updateScoreboard();
  }

  // ---------- Repli hors-ligne : dernière image connue (joueurs, zones, visibilité) ----------
  function offlineCacheKey(code){ return "badRecon_offline_" + code; }
  function loadOfflineCache(code){
    try{
      var raw = localStorage.getItem(offlineCacheKey(code));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveOfflineCache(code, data){
    try{ localStorage.setItem(offlineCacheKey(code), JSON.stringify(data)); }catch(e){}
  }
  function setOfflineIndicator(isOffline, lastTs){
    var el = document.getElementById("offline-indicator");
    if(!el) return;
    if(!isOffline){ el.textContent = ""; el.style.display = "none"; return; }
    el.style.display = "block";
    var when = "";
    if(lastTs){
      var d = new Date(lastTs);
      when = " — dernières données à " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    }
    el.textContent = "📡 Hors ligne" + when + " — reconnexion en cours…";
  }

  // ---------- Rendu des pings temporaires sur la carte ----------
  async function refreshPings(){
    if(!state.event || !state.map) return;
    if(state.fogUntil && state.fogUntil > Date.now()){ renderPingMarkers([]); return; }
    var pings = await loadPings(state.event.code);
    var now = Date.now();
    pings = pings.filter(function(p){ return (now - p.ts) < PING_DURATION_MS; });
    state.cachedPings = pings;
    renderPingMarkers(pings);
  }
  function renderPingMarkers(pings){
    if(!state.map) return;
    if(!state.pingMarkers) state.pingMarkers = {};
    var seen = {};
    pings.forEach(function(p){
      seen[p.id] = true;
      if(state.pingMarkers[p.id]) return; // déjà affiché
      var icon = L.divIcon({ html:'<div class="ping-marker">'+p.emoji+'</div>', className:'', iconSize:[26,26], iconAnchor:[13,13] });
      var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(state.map);
      marker.on('click', function(){
        var secsLeft = Math.max(0, Math.round((PING_DURATION_MS - (Date.now()-p.ts))/1000));
        marker.bindPopup(escapeHtml(p.label) + ' — ' + escapeHtml(p.playerName) + '<br/><span style="font-size:11px;">disparaît dans ' + secsLeft + 's</span>').openPopup();
      });
      state.pingMarkers[p.id] = marker;
    });
    // retire les marqueurs des pings expirés / disparus
    Object.keys(state.pingMarkers).forEach(function(id){
      if(!seen[id]){ state.map.removeLayer(state.pingMarkers[id]); delete state.pingMarkers[id]; }
    });
  }

  function updateWarzoneBanner(zones){
    var el = document.getElementById("warzone-banner");
    if(!el) return;
    var warzones = (zones||[]).filter(function(z){ return z.kind === "guerre" && isValidZone(z); });
    if(!warzones.length){ el.innerHTML = ""; return; }
    el.innerHTML = warzones.map(function(z){
      var wz = warzoneStyle(z);
      return '<div class="warzone-alert '+(wz.active?'active':'pending')+'">' +
        '<div class="wz-name">'+(wz.active?'☢️ ':'⚠ ')+escapeHtml(z.name)+'</div>' +
        '<div class="wz-time">'+wz.label+'</div>' +
      '</div>';
    }).join("");
    updateZoneDangerNote(zones);
  }

  function updateGasBanner(zones){
    var el = document.getElementById("gas-banner");
    if(!el) return;
    var gasZones = (zones||[]).filter(function(z){ return z.kind === "gaz" && isValidZone(z); });
    if(!gasZones.length){ el.innerHTML = ""; return; }
    el.innerHTML = gasZones.map(function(z){
      var gs = gasCurrentState(z);
      var timeTxt = gs.nextGrowMs !== null
        ? ('Prochaine expansion dans ' + Math.floor(gs.nextGrowMs/60000) + ':' + ("0"+Math.floor((gs.nextGrowMs%60000)/1000)).slice(-2))
        : (z.frozenRadius !== null && z.frozenRadius !== undefined ? 'Figé par l\u2019organisateur' : 'Rayon maximum atteint');
      return '<div class="warzone-alert active">' +
        '<div class="wz-name">☣️ '+escapeHtml(z.name)+' — danger '+Math.round(gs.radius)+' m</div>' +
        '<div class="wz-time">'+timeTxt+'</div>' +
      '</div>';
    }).join("");
  }

  // Repère (algorithme du lancer de rayon) si un point est à l'intérieur d'un polygone.
  function pointInPolygon(lat, lng, points){
    var inside = false;
    for(var i=0, j=points.length-1; i<points.length; j=i++){
      var yi = points[i][0], xi = points[i][1];
      var yj = points[j][0], xj = points[j][1];
      var intersect = ((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
      if(intersect) inside = !inside;
    }
    return inside;
  }

  // Distance (mètres) et direction cardinale entre deux points GPS — utilisé pour le petit
  // repère "120 m, Nord-Est" affiché au tap sur un coéquipier ou un point.
  function distanceMeters(lat1, lng1, lat2, lng2){
    var R = 6371000;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  // Approxime un cercle géographique par un polygone à N côtés — largement suffisant à
  // l'échelle d'un terrain d'airsoft (la courbure terrestre est négligeable ici).
  function circlePolygonPoints(centerLat, centerLng, radiusMeters, sides){
    sides = sides || 28;
    var R = 6371000;
    var points = [];
    for(var i=0; i<sides; i++){
      var angle = (i / sides) * 2 * Math.PI;
      var dx = radiusMeters * Math.cos(angle);
      var dy = radiusMeters * Math.sin(angle);
      var dLat = (dy / R) * (180/Math.PI);
      var dLng = (dx / (R * Math.cos(centerLat * Math.PI/180))) * (180/Math.PI);
      points.push([centerLat + dLat, centerLng + dLng]);
    }
    return points;
  }
  function bearingCardinal(lat1, lng1, lat2, lng2){
    var toRad = function(d){ return d * Math.PI / 180; };
    var y = Math.sin(toRad(lng2-lng1)) * Math.cos(toRad(lat2));
    var x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
    var deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    var dirs = ["Nord","Nord-Est","Est","Sud-Est","Sud","Sud-Ouest","Ouest","Nord-Ouest"];
    return dirs[Math.round(deg / 45) % 8];
  }
  function distanceLabel(lat, lng){
    if(!state.lastCoords) return null;
    var d = distanceMeters(state.lastCoords.lat, state.lastCoords.lng, lat, lng);
    var dir = bearingCardinal(state.lastCoords.lat, state.lastCoords.lng, lat, lng);
    var distTxt = d < 1000 ? (Math.round(d)+" m") : ((d/1000).toFixed(1)+" km");
    return distTxt + ", " + dir;
  }

  // Purement informatif — jamais une règle stricte (élimination automatique, etc.) : le
  // GPS d'un téléphone est précis à quelques mètres près, pas assez pour trancher seul.
  // Ça sert juste à fluidifier le jeu, pas à remplacer l'observation sur le terrain.
  function updateZoneDangerNote(zones){
    var el = document.getElementById("zone-danger-note");
    if(!el) return;
    if(!state.lastCoords){ el.textContent = ""; return; }
    var inside = null;
    (zones||[]).forEach(function(z){
      if(z.kind === "guerre" && isValidZone(z)){
        var wz = warzoneStyle(z);
        if(wz.active && pointInPolygon(state.lastCoords.lat, state.lastCoords.lng, z.points)) inside = z.name;
      }
    });
    var inGas = null;
    (zones||[]).forEach(function(z){
      if(z.kind === "gaz" && isValidZone(z)){
        var gs = gasCurrentState(z);
        var d = distanceMeters(state.lastCoords.lat, state.lastCoords.lng, z.center.lat, z.center.lng);
        if(d <= gs.radius) inGas = z.name;
      }
    });
    if(inside){ el.textContent = "⚠ Tu sembles être dans « "+inside+" » (zone interdite) — le GPS peut être imprécis de quelques mètres, vérifie visuellement."; }
    else if(inGas){ el.textContent = "☣️ Tu sembles être dans le gaz de « "+inGas+" » — le GPS peut être imprécis de quelques mètres, vérifie visuellement."; }
    else{ el.textContent = ""; }
  }

  function isValidZone(z){
    if(!z || !z.id) return false;
    if(z.kind === "point") return Array.isArray(z.latlng) && z.latlng.length === 2;
    if(z.kind === "mur" || z.kind === "demimur") return Array.isArray(z.points) && z.points.length >= 2;
    if(z.kind === "gaz") return !!(z.center && typeof z.center.lat === "number" && typeof z.center.lng === "number");
    return Array.isArray(z.points) && z.points.length >= 3;
  }

  function updateZonePolygons(zones){
    if(!state.map) return;
    var seen = {};
    orderedZones(zones).forEach(function(z){
      if(!isValidZone(z)) return;
      seen[z.id] = true;
      try{
        if(state.zonesLayers[z.id]){
          if(z.kind === "building" || !z.kind){
            var info = zoneStatusInfo(z.status);
            state.zonesLayers[z.id].setStyle({ color: info.color, fillColor: info.color });
          } else if(z.kind === "guerre"){
            var wz = warzoneStyle(z);
            var layer = state.zonesLayers[z.id];
            layer.setStyle({ color: wz.color, fillColor: wz.color, fillOpacity: wz.fillOpacity, dashArray: wz.dashArray });
            if(layer._path) layer._path.classList.toggle('zone-objectif', !!wz.active);
            layer.setTooltipContent(escapeHtml(z.name) + ' · ' + wz.label);
          } else if(z.kind === "drapeau"){
            var flagLayer = state.zonesLayers[z.id];
            var ownerColor2 = z.captureOwner ? teamColor(state.event || {}, z.captureOwner) : '#8f8b7a';
            flagLayer.setStyle({ color: ownerColor2, fillColor: ownerColor2, fillOpacity: z.captureOwner ? 0.3 : 0.12 });
            var flagLabel2 = z.captureOwner ? (escapeHtml(z.name) + ' · tenue par ' + escapeHtml(z.captureOwner)) :
              (z.captureTarget ? (escapeHtml(z.name) + ' · capture par ' + escapeHtml(z.captureTarget) + ' (' + Math.round(z.captureProgress||0) + '%)') : (escapeHtml(z.name) + ' · neutre'));
            flagLayer.setTooltipContent(flagLabel2);
          } else if(z.kind === "gaz"){
            var gasLayer = state.zonesLayers[z.id];
            var gs3 = gasCurrentState(z);
            gasLayer.setLatLngs(circlePolygonPoints(z.center.lat, z.center.lng, gs3.radius, 40));
            gasLayer.setTooltipContent(escapeHtml(z.name) + ' · gaz ' + Math.round(gs3.radius) + ' m');
          }
          return;
        }
        state.zonesLayers[z.id] = addZoneLayer(state.map, z);
      }catch(e){ /* une zone corrompue ne doit pas empêcher l'affichage des autres */ }
    });
    Object.keys(state.zonesLayers).forEach(function(id){
      if(!seen[id]){ state.map.removeLayer(state.zonesLayers[id]); delete state.zonesLayers[id]; }
    });
  }

  function updateMarkers(players){
    if(!state.map) return;
    var seen = {};
    var now = Date.now();
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      // Accumule la trajectoire (position + heure) pour ce joueur, qu'elle soit affichée
      // ou non pour l'instant — plafonné à 5 minutes pour ne jamais grossir indéfiniment.
      // Purement local : rien n'est envoyé sur Firebase pour ça.
      if(!state.trails[pid]) state.trails[pid] = [];
      var trail = state.trails[pid];
      var lastPt = trail[trail.length-1];
      if(!lastPt || lastPt.lat !== p.lat || lastPt.lng !== p.lng){ trail.push({ lat: p.lat, lng: p.lng, ts: now }); }
      while(trail.length && (now - trail[0].ts) > 300000){ trail.shift(); }

      var isMe = pid === state.playerId;
      seen[pid] = true;
      var color = teamColor(state.event, p.team) || "#9b9b9b";
      var initials = (p.name||"?").trim().slice(0,2).toUpperCase();
      var badgeGlyph = initials, badgeSize = "11px";
      if(typeof p.livesRemaining === "number" && p.livesRemaining <= 0){ badgeGlyph = "☠️"; badgeSize = "13px"; color = "#4a4a4a"; }
      else if(p.infected){ badgeGlyph = "🧟"; badgeSize = "13px"; color = "#3e6b2f"; }
      else if(p.isAdmin){ badgeGlyph = "👑"; badgeSize = "13px"; }
      else if(p.role === "staff"){ badgeGlyph = "🛡"; badgeSize = "13px"; }
      var html = '<div class="marker-badge'+(isMe?' me':'')+(p.sos?' sos':'')+'" style="background:'+color+';font-size:'+badgeSize+';">'+escapeHtml(badgeGlyph)+'</div>';
      if(state.markers[pid]){
        state.markers[pid].setLatLng([p.lat, p.lng]);
        if(state.markers[pid]._lastName !== p.name){
          state.markers[pid].setTooltipContent('<span class="player-label-inner">'+escapeHtml(p.name||"?")+'</span>');
          state.markers[pid]._lastName = p.name;
        }
        if(state.markers[pid]._lastBadge !== badgeGlyph){
          state.markers[pid].setIcon(L.divIcon({ html: html, className: '', iconSize:[26,26], iconAnchor:[13,13] }));
          state.markers[pid]._lastBadge = badgeGlyph;
        }
      } else {
        var icon = L.divIcon({ html: html, className: '', iconSize:[26,26], iconAnchor:[13,13] });
        var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(state.map)
          .bindTooltip('<span class="player-label-inner">'+escapeHtml(p.name||"?")+'</span>', { permanent: true, direction: 'top', offset: [0,-15], className: 'player-label' });
        marker._lastName = p.name;
        marker._lastBadge = badgeGlyph;
        marker.on('click', function(){
          if(pid === state.playerId) return;
          var pos = marker.getLatLng();
          var label = distanceLabel(pos.lat, pos.lng);
          if(label) marker.bindPopup(label).openPopup();
        });
        state.markers[pid] = marker;
      }
    });
    Object.keys(state.markers).forEach(function(pid){
      if(!seen[pid]){ state.map.removeLayer(state.markers[pid]); delete state.markers[pid]; }
    });
    applyLabelZoomVisibility();
    updateMarkerClusters();
    renderTrails(players);
  }

  // ---------- Trajectoire récente (joueur / escouade / équipe) — purement locale ----------
  function renderTrails(players){
    if(!state.map) return;
    if(!state.trailLayers) state.trailLayers = {};
    Object.keys(state.trailLayers).forEach(function(pid){ state.map.removeLayer(state.trailLayers[pid]); });
    state.trailLayers = {};
    if(!state.trailDuration || !state.trailScope) return;

    var now = Date.now();
    var cutoff = now - state.trailDuration;
    var myTeam = state.player.team;
    var mySquad = state.player.squad;

    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      if(!p) return;
      var include = state.trailScope === "me" ? (pid === state.playerId) :
        state.trailScope === "team" ? (p.team === myTeam) :
        state.trailScope === "squad" ? (p.team === myTeam && (p.squad||"") === mySquad) : false;
      if(!include) return;
      var trail = (state.trails[pid]||[]).filter(function(pt){ return pt.ts >= cutoff; });
      if(trail.length < 2) return;
      var pts = trail.map(function(pt){ return [pt.lat, pt.lng]; });
      var col = teamColor(state.event || {}, p.team) || "#e7ddc9";
      state.trailLayers[pid] = L.polyline(pts, { color: col, weight:2.5, dashArray:'2,7', opacity:0.75 }).addTo(state.map);
    });
  }

  function renderTrailMenu(){
    var el = document.getElementById("trail-menu");
    if(!el) return;
    var durations = [ {label:"30s", ms:30000}, {label:"2 min", ms:120000}, {label:"5 min", ms:300000} ];
    el.innerHTML =
      '<p class="mono" style="font-size:10px;color:var(--ink-dim);text-transform:uppercase;margin-top:6px;">Durée</p>' +
      '<div class="row">' +
        durations.map(function(d){
          return '<button class="btn btn-sm '+(state.trailDuration===d.ms?'btn-primary':'btn-ghost')+' trail-dur" data-ms="'+d.ms+'">'+d.label+'</button>';
        }).join("") +
        '<button class="btn btn-sm '+(!state.trailDuration?'btn-primary':'btn-ghost')+' trail-dur" data-ms="0">Désactivée</button>' +
      '</div>' +
      '<p class="mono" style="font-size:10px;color:var(--ink-dim);text-transform:uppercase;margin-top:8px;">Portée</p>' +
      '<div class="row">' +
        '<button class="btn btn-sm '+(state.trailScope==="me"?'btn-primary':'btn-ghost')+' trail-scope" data-scope="me">Moi</button>' +
        (state.player.squad ? ('<button class="btn btn-sm '+(state.trailScope==="squad"?'btn-primary':'btn-ghost')+' trail-scope" data-scope="squad">Mon escouade</button>') : '') +
        '<button class="btn btn-sm '+(state.trailScope==="team"?'btn-primary':'btn-ghost')+' trail-scope" data-scope="team">Mon équipe</button>' +
      '</div>';
    Array.prototype.forEach.call(el.querySelectorAll(".trail-dur"), function(btn){
      btn.onclick = function(){
        state.trailDuration = parseInt(btn.dataset.ms, 10) || 0;
        if(state.trailDuration && !state.trailScope) state.trailScope = "me";
        if(!state.trailDuration) state.trailScope = null;
        var mainBtn = document.getElementById("btn-trail-menu");
        if(mainBtn) mainBtn.className = "btn btn-sm " + (state.trailDuration ? "btn-primary" : "btn-ghost");
        renderTrails(state.cachedAllPlayers || {});
        renderTrailMenu();
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll(".trail-scope"), function(btn){
      btn.onclick = function(){
        state.trailScope = btn.dataset.scope;
        renderTrails(state.cachedAllPlayers || {});
        renderTrailMenu();
      };
    });
  }

  // ---------- Regroupement des marqueurs trop proches à l'écran (badge avec compteur) ----------
  function updateMarkerClusters(){
    if(!state.map) return;
    var THRESHOLD_PX = 24;
    var ids = Object.keys(state.markers);
    var points = ids.map(function(pid){
      var m = state.markers[pid];
      return { pid: pid, marker: m, pt: state.map.latLngToContainerPoint(m.getLatLng()) };
    });
    var assigned = {};
    var groups = [];
    points.forEach(function(a){
      if(assigned[a.pid]) return;
      var group = [a];
      assigned[a.pid] = true;
      points.forEach(function(b){
        if(assigned[b.pid]) return;
        var dx = a.pt.x - b.pt.x, dy = a.pt.y - b.pt.y;
        if(Math.sqrt(dx*dx + dy*dy) < THRESHOLD_PX){ group.push(b); assigned[b.pid] = true; }
      });
      groups.push(group);
    });

    if(state.clusterMarkers){
      state.clusterMarkers.forEach(function(cm){ state.map.removeLayer(cm); });
    }
    state.clusterMarkers = [];

    groups.forEach(function(group){
      if(group.length === 1){
        if(!state.map.hasLayer(group[0].marker)) group[0].marker.addTo(state.map);
        return;
      }
      group.forEach(function(g){ if(state.map.hasLayer(g.marker)) state.map.removeLayer(g.marker); });
      var latlngs = group.map(function(g){ return g.marker.getLatLng(); });
      var centerLat = latlngs.reduce(function(s,l){ return s+l.lat; }, 0) / latlngs.length;
      var centerLng = latlngs.reduce(function(s,l){ return s+l.lng; }, 0) / latlngs.length;
      var icon = L.divIcon({ html:'<div class="cluster-badge">'+group.length+'</div>', className:'', iconSize:[28,28], iconAnchor:[14,14] });
      var badge = L.marker([centerLat, centerLng], { icon: icon }).addTo(state.map);
      badge.on('click', function(){
        var names = group.map(function(g){ return escapeHtml(g.marker._lastName || "?"); }).join('<br/>');
        badge.bindPopup('<strong>'+group.length+' joueurs ici :</strong><br/>'+names).openPopup();
      });
      state.clusterMarkers.push(badge);
    });
  }

  function applyLabelZoomVisibility(){
    if(!state.map) return;
    var container = state.map.getContainer();
    if(state.map.getZoom() >= 17){ container.classList.remove('labels-hidden'); }
    else{ container.classList.add('labels-hidden'); }
  }

  // Repère si un joueur se trouve actuellement dans une zone drapeau, et dans quel état
  // (en train de la capturer, ou la tenant déjà) — pour l'afficher dans la liste des joueurs.
  function playerActivityLabel(p){
    if(!state.cachedZones || typeof p.lat !== "number") return "";
    var z = state.cachedZones.find(function(zz){
      return zz.kind === "drapeau" && isValidZone(zz) && pointInPolygon(p.lat, p.lng, zz.points);
    });
    if(!z) return "";
    if(z.captureOwner === p.team) return "🚩 tient " + escapeHtml(z.name);
    if(z.captureTarget === p.team) return "🚩 capture " + escapeHtml(z.name);
    return "🚩 sur " + escapeHtml(z.name);
  }

  function updateRoster(players){
    var me = state.lastCoords;
    var search = (state.rosterSearch||"").trim().toLowerCase();
    var rows = Object.keys(players).map(function(pid){
      var p = players[pid];
      var stale = (Date.now() - (p.ts||0)) > 30000;
      var color = teamColor(state.event, p.team) || "#9b9b9b";
      var dist = (pid === state.playerId) ? null : haversine(me, { lat: p.lat, lng: p.lng });
      return { pid: pid, p: p, stale: stale, color: color, dist: dist };
    }).filter(function(r){
      return !search || (r.p.name||"").toLowerCase().indexOf(search) !== -1;
    }).sort(function(a,b){
      if(!!b.p.sos - !!a.p.sos !== 0) return !!b.p.sos - !!a.p.sos;
      if(a.pid === state.playerId) return -1;
      if(b.pid === state.playerId) return 1;
      return (a.dist||0) - (b.dist||0);
    });

    document.getElementById("roster").innerHTML = rows.map(function(r){
      var activity = playerActivityLabel(r.p);
      return '<div class="roster-row'+(r.stale?' stale':'')+'" data-pid="'+r.pid+'">' +
        '<span class="dot" style="background:'+r.color+'"></span>' +
        '<span class="name">'+escapeHtml(r.p.name||"?")+(r.pid===state.playerId?'<span class="you">TOI</span>':'')+(r.p.role==="staff"?'<span class="you" style="color:var(--amber);">STAFF</span>':'')+(r.p.sos?'<span class="you" style="color:var(--danger);">🆘 AIDE</span>':'')+(activity?'<span class="mono" style="font-size:10px;color:var(--ink-dim);display:block;">'+activity+'</span>':'')+'</span>' +
        '<span class="dist">'+(r.pid===state.playerId ? "" : fmtDist(r.dist))+'</span>' +
      '</div>';
    }).join("") || '<p>'+(search ? "Aucun joueur ne correspond." : "Aucun coéquipier détecté pour l\u2019instant.")+'</p>';

    Array.prototype.forEach.call(document.querySelectorAll("#roster .roster-row"), function(row){
      row.style.cursor = "pointer";
      row.onclick = function(){
        var p = players[row.dataset.pid];
        if(p && state.map && typeof p.lat === "number") state.map.setView([p.lat, p.lng], Math.max(state.map.getZoom(), 18));
      };
    });
  }

  function teardownMap(){
    if(state.watchId !== null && navigator.geolocation){ navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
    if(state.writeTimer){ clearInterval(state.writeTimer); state.writeTimer = null; }
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    stopWarzoneTicker();
    state.compassAngle = 0;
    state.mapFullscreen = false;
    if(state.map){ state.map.remove(); state.map = null; }
    state.markers = {};
    state.zonesLayers = {};
    state.pingMarkers = {};
    state.clusterMarkers = [];
    state.fogUntil = null;
    state.radarBonusUntil = null;
    state.trails = {};
    state.trailLayers = {};
    state.trailDuration = 0;
    state.trailScope = null;
    state.pingPlacingKind = null;
  }

  // Quand l'appli est vraiment fermée (onglet fermé, appli quittée) : on arrête le GPS et les
  // envois de position pour ne pas gaspiller batterie/données. On NE supprime PAS le joueur de
  // la partie pour les autres — sinon une pause déjeuner d'1h ferait à nouveau disparaître tout
  // le monde de la carte, ce qu'on a justement corrigé.
  window.addEventListener("pagehide", function(){
    if(state.watchId !== null && navigator.geolocation){ navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
    if(state.writeTimer){ clearInterval(state.writeTimer); state.writeTimer = null; }
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    stopWarzoneTicker();
    stopEditorGeoWatch();
  });

  // Passer portrait/paysage (ou juste le clavier qui s'ouvre/ferme) change la taille réelle
  // de l'écran — sans ça, Leaflet garde en mémoire l'ancienne taille et affiche une zone
  // noire/vide là où le nouvel espace n'est pas couvert, surtout visible en plein écran.
  var _resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function(){
      if(state.map) state.map.invalidateSize();
      if(state.editorMap) state.editorMap.invalidateSize();
    }, 150);
  });
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){
      if(state.map) state.map.invalidateSize();
      if(state.editorMap) state.editorMap.invalidateSize();
    }, 300);
  });

  // Ouverture via un lien de partage (🔗) : "?map=<id>" — direction directe vers la bibliothèque.
  try{
    var sharedMapId = new URLSearchParams(location.search).get("map");
    if(sharedMapId){ state.screen = "library"; state.pendingLibraryHighlight = sharedMapId; }
  }catch(e){}

  render();
})();
</script>
</body>
</html>
