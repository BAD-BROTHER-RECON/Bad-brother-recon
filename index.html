  function finishDrawing(){
    var isWallKind = state.drawKind === "mur" || state.drawKind === "demimur";
    var minPts = isWallKind ? 2 : 3;
    if(state.drawPoints.length < minPts) return;
    var isTerrain = state.drawKind === "terrain";
    var isWarzone = state.drawKind === "guerre";
    var isFlag = state.drawKind === "drapeau";
    var el = document.getElementById("editor-toolbar");
    var nameLabel = isWarzone ? "de la Warzone" : (isFlag ? "du drapeau" : (isWallKind ? (state.drawKind==="demimur"?"du demi-mur":"du mur") : "du bâtiment"));
    var namePlaceholder = isWarzone ? "Ex. Secteur Nord" : (isFlag ? "Ex. Point Alpha" : (isWallKind ? "Ex. Mur Est" : "Ex. Hangar Nord"));
    el.innerHTML =
      (isTerrain ? '' : '<div class="field" style="margin-top:0;"><label>Nom '+nameLabel+' (optionnel)</label><input type="text" id="zone-name" placeholder="'+namePlaceholder+'" /></div>') +
      (isWarzone ? '<div class="field"><label>Devient interdite dans (minutes)</label><input type="number" id="zone-minutes" value="5" min="1" style="text-align:left;" /></div>' : '') +
      '<div class="row" style="margin-top:8px;">' +
        '<button class="btn btn-sm btn-primary" id="btn-confirm-zone">'+(isTerrain ? 'Valider la limite' : 'Ajouter')+'</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-cancel-draw2">Annuler</button>' +
      '</div>';
    var nameInput = document.getElementById("zone-name");
    if(nameInput) nameInput.focus();
    document.getElementById("btn-cancel-draw2").onclick = function(){
      state.drawing = false; state.drawPoints = []; state.drawKind = null;
      updateDrawPreview();
      drawToolbar();
    };
    document.getElementById("btn-confirm-zone").onclick = async function(){
      if(isTerrain){
        state.editorZones = state.editorZones.filter(function(z){ return z.kind !== "terrain"; });
        state.editorZones.unshift({ id: genId("t"), kind: "terrain", name: "Limite du terrain", points: state.drawPoints.slice() });
      } else if(isWarzone){
        var name2 = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Warzone";
        var minutesInput = document.getElementById("zone-minutes");
        var minutes = Math.max(1, parseInt(minutesInput && minutesInput.value, 10) || 5);
        state.editorZones.push({ id: genId("w"), kind: "guerre", name: name2, points: state.drawPoints.slice(), deactivateAt: Date.now() + minutes*60000 });
      } else if(isFlag){
        var name4 = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Drapeau";
        state.editorZones.push({
          id: genId("f"), kind: "drapeau", name: name4, points: state.drawPoints.slice(),
          captureOwner: null, captureTarget: null, captureProgress: 0, captureLastTick: null
        });
      } else if(isWallKind){
        var name3 = nameInput && nameInput.value.trim() ? nameInput.value.trim() : (state.drawKind==="demimur" ? "Demi-mur" : "Mur");
        state.editorZones.push({ id: genId("w"), kind: state.drawKind, name: name3, points: state.drawPoints.slice() });
      } else {
        var name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Bâtiment";
        state.editorZones.push({ id: genId("z"), kind: "building", name: name, points: state.drawPoints.slice(), status: "intact" });
      }
      state.drawing = false; state.drawPoints = []; state.drawKind = null;
      updateDrawPreview();
      drawExistingZones();
      drawToolbar();
      drawZoneList();
      await persistEditorZones();
    };
  }

  function openPointForm(latlng, existing){
    state.placingPoint = false;
    var el = document.getElementById("editor-toolbar");
    var chosenIcon = existing ? existing.icon : "drapeau";
    var chosenColor = (existing && existing.color) ? existing.color : FLAG_COLORS[0];

    function paint(){
      el.innerHTML =
        '<div class="field" style="margin-top:0;"><label>Type de point</label>' +
          '<div class="row">' +
            POINT_ICONS.map(function(ic){
              return '<button class="btn btn-sm '+(ic.key===chosenIcon?'btn-primary':'btn-ghost')+'" data-icon="'+ic.key+'">'+ic.emoji+' '+ic.label+'</button>';
            }).join("") +
          '</div>' +
        '</div>' +
        (pointIconInfo(chosenIcon).colorable ?
          '<div class="field"><label>Couleur</label><div class="teams" id="flag-colors">' +
            FLAG_COLORS.map(function(c){ return '<button class="team-chip'+(c===chosenColor?' selected':'')+'" data-color="'+c+'" style="color:'+c+'"><span class="dot" style="background:'+c+'"></span></button>'; }).join("") +
          '</div></div>' : '') +
        '<div class="field"><label>Nom (optionnel)</label><input type="text" id="point-name" placeholder="Ex. Objectif Nord" value="'+escapeHtml(existing?existing.name:"")+'" /></div>' +
        '<div class="row" style="margin-top:8px;">' +
          '<button class="btn btn-sm btn-primary" id="btn-confirm-point">'+(existing?'Enregistrer':'Ajouter')+'</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-cancel-point2">Annuler</button>' +
        '</div>';

      Array.prototype.forEach.call(el.querySelectorAll("[data-icon]"), function(b){
        b.onclick = function(){ chosenIcon = b.dataset.icon; paint(); };
      });
      var colorWrap = document.getElementById("flag-colors");
      if(colorWrap){
        Array.prototype.forEach.call(colorWrap.querySelectorAll("[data-color]"), function(b){
          b.onclick = function(){ chosenColor = b.dataset.color; paint(); };
        });
      }
      document.getElementById("btn-cancel-point2").onclick = function(){ drawToolbar(); };
      document.getElementById("btn-confirm-point").onclick = async function(){
        var name = document.getElementById("point-name").value.trim() || (pointIconInfo(chosenIcon).label);
        var colorable = pointIconInfo(chosenIcon).colorable;
        if(existing){
          existing.name = name;
          existing.icon = chosenIcon;
          existing.color = colorable ? chosenColor : null;
        } else {
          var pt = { id: genId("pt"), kind: "point", name: name, latlng: latlng, icon: chosenIcon, color: colorable ? chosenColor : null };
          state.editorZones.push(pt);
        }
        drawExistingZones();
        drawZoneList();
        drawToolbar();
        await persistEditorZones();
      };
    }
    paint();
  }

  function renderZoneRow(z){
    if(z.kind === "point"){
      var ic = POINT_ICONS.find(function(i){ return i.key === z.icon; }) || POINT_ICONS[0];
      return '<div class="zone-row">' +
        '<span style="font-size:15px;">'+ic.emoji+'</span>' +
        '<span class="name">'+escapeHtml(z.name)+'</span>' +
        '<button class="btn btn-sm btn-ghost point-edit" data-id="'+z.id+'" style="padding:6px 10px;">Modifier</button>' +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    if(z.kind === "terrain"){
      return '<div class="zone-row">' +
        '<span class="dot" style="background:#c9a227"></span>' +
        '<span class="name">'+escapeHtml(z.name || "Limite du terrain")+'</span>' +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    if(z.kind === "guerre"){
      var wz = warzoneStyle(z);
      return '<div class="zone-row">' +
        '<span class="dot" style="background:'+wz.color+'"></span>' +
        '<span class="name">'+escapeHtml(z.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+wz.label+'</span></span>' +
        (wz.active ? '' : '<button class="btn btn-sm btn-ghost warzone-now" data-id="'+z.id+'" style="padding:6px 10px;">Fermer maintenant</button>') +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    if(z.kind === "gaz"){
      var gs2 = gasCurrentState(z);
      var statusTxt2 = z.frozenRadius !== null && z.frozenRadius !== undefined
        ? ('figé à '+Math.round(gs2.radius)+' m')
        : (gs2.nextGrowMs !== null ? ('danger '+Math.round(gs2.radius)+' m · prochaine expansion dans '+Math.ceil(gs2.nextGrowMs/60000)+' min') : ('rayon maximum atteint ('+Math.round(gs2.radius)+' m)'));
      return '<div class="zone-row">' +
        '<span style="font-size:14px;">☣️</span>' +
        '<span class="name">'+escapeHtml(z.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+statusTxt2+'</span></span>' +
        (z.frozenRadius === null || z.frozenRadius === undefined ? '<button class="btn btn-sm btn-ghost gas-freeze" data-id="'+z.id+'" style="padding:6px 10px;">Figer maintenant</button>' : '') +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    if(z.kind === "mur" || z.kind === "demimur"){
      return '<div class="zone-row">' +
        '<span style="font-size:14px;">'+(z.kind==="demimur"?"⬜":"🧱")+'</span>' +
        '<span class="name">'+escapeHtml(z.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+(z.kind==="demimur"?"Demi-mur":"Mur")+'</span></span>' +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    if(z.kind === "drapeau"){
      var teamsForOverride = (state.editorMode === "live" && state.event) ? (state.event.teams||[]).filter(function(t){ return t.name !== "Staff"; }) : [];
      var statusTxt = z.captureOwner ? ('tenue par '+z.captureOwner) : (z.captureTarget ? ('capture '+z.captureTarget+' '+Math.round(z.captureProgress||0)+'%') : 'neutre');
      return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;">' +
        '<span style="font-size:14px;">🚩</span>' +
        '<span class="name">'+escapeHtml(z.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+escapeHtml(statusTxt)+'</span></span>' +
        teamsForOverride.map(function(t){
          return '<button class="btn btn-sm btn-ghost flag-assign" data-id="'+z.id+'" data-team="'+escapeHtml(t.name)+'" style="padding:6px 8px;font-size:11px;">'+escapeHtml(t.name)+'</button>';
        }).join("") +
        ((z.captureOwner || z.captureTarget) ? '<button class="btn btn-sm btn-ghost flag-reset" data-id="'+z.id+'" style="padding:6px 8px;">Neutraliser</button>' : "") +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }
    var info = zoneStatusInfo(z.status);
    return '<div class="zone-row">' +
      '<span class="dot" style="background:'+info.color+'"></span>' +
      '<span class="name">'+escapeHtml(z.name)+'</span>' +
      '<select class="zone-status" data-id="'+z.id+'">' +
        ZONE_STATUSES.map(function(s){ return '<option value="'+s.key+'"'+(s.key===z.status?' selected':'')+'>'+s.label+'</option>'; }).join("") +
      '</select>' +
      '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
    '</div>';
  }

  var ZONE_GROUP_DEFS = [
    { key:"terrain", label:"Limite du terrain", icon:"🗺️", match:function(z){ return z.kind === "terrain"; } },
    { key:"guerre", label:"Warzone", icon:"☢️", match:function(z){ return z.kind === "guerre"; } },
    { key:"gaz", label:"Gaz", icon:"☣️", match:function(z){ return z.kind === "gaz"; } },
    { key:"drapeau", label:"Drapeaux", icon:"🚩", match:function(z){ return z.kind === "drapeau"; } },
    { key:"building", label:"Bâtiments", icon:"🏠", match:function(z){ return z.kind === "building" || !z.kind; } },
    { key:"mur", label:"Murs", icon:"🧱", match:function(z){ return z.kind === "mur" || z.kind === "demimur"; } },
    { key:"point", label:"Points", icon:"📍", match:function(z){ return z.kind === "point"; } }
  ];

  function drawZoneList(){
    var wrap = document.getElementById("zone-list");
    if(!wrap) return;
    if(!state.editorZones.length){
      wrap.innerHTML = '<p>Rien de défini pour l\u2019instant : limite du terrain, bâtiments ou points.</p>';
      return;
    }
    if(!state.zoneListCollapsed) state.zoneListCollapsed = {};
    var ordered = orderedZones(state.editorZones);

    wrap.innerHTML = ZONE_GROUP_DEFS.map(function(gd){
      var items = ordered.filter(gd.match);
      if(!items.length) return "";
      // Repliée par défaut dès qu'il y a plus d'un élément, pour garder la liste courte ;
      // un seul élément (souvent le cas pour la limite du terrain) reste visible directement.
      var collapsed = state.zoneListCollapsed[gd.key] !== undefined ? state.zoneListCollapsed[gd.key] : (items.length > 1);
      return '<div class="zone-group">' +
        '<button class="zone-group-header" data-group="'+gd.key+'">'+gd.icon+' '+gd.label+' ('+items.length+') <span>'+(collapsed?'▸':'▾')+'</span></button>' +
        (collapsed ? '' : items.map(renderZoneRow).join("")) +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(wrap.querySelectorAll(".zone-group-header"), function(btn){
      btn.onclick = function(){
        var k = btn.dataset.group;
        var wasCollapsed = state.zoneListCollapsed[k] !== undefined ? state.zoneListCollapsed[k] : true;
        state.zoneListCollapsed[k] = !wasCollapsed;
        drawZoneList();
      };
    });

    Array.prototype.forEach.call(wrap.querySelectorAll(".point-edit"), function(btn){
      btn.onclick = function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z) openPointForm(z.latlng, z);
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".zone-status"), function(sel){
      sel.onchange = async function(){
        var z = state.editorZones.find(function(z){ return z.id === sel.dataset.id; });
        if(z){ z.status = sel.value; drawExistingZones(); drawZoneList(); await persistEditorZones(); }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".warzone-now"), function(btn){
      btn.onclick = async function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z){ z.deactivateAt = Date.now(); drawExistingZones(); drawZoneList(); await persistEditorZones(); }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".gas-freeze"), function(btn){
      btn.onclick = async function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z){ z.frozenRadius = gasCurrentState(z).radius; drawExistingZones(); drawZoneList(); await persistEditorZones(); }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".flag-assign"), function(btn){
      btn.onclick = async function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z){
          z.captureOwner = btn.dataset.team; z.captureTarget = null; z.captureProgress = 0; z.captureLastTick = Date.now();
          drawExistingZones(); drawZoneList(); await persistEditorZones();
        }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".flag-reset"), function(btn){
      btn.onclick = async function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z){
          z.captureOwner = null; z.captureTarget = null; z.captureProgress = 0; z.captureLastTick = Date.now();
          drawExistingZones(); drawZoneList(); await persistEditorZones();
        }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".zone-del"), function(btn){
      btn.onclick = async function(){
        state.editorZones = state.editorZones.filter(function(z){ return z.id !== btn.dataset.id; });
        if(state.editingZoneId === btn.dataset.id) state.editingZoneId = null;
        drawExistingZones(); drawZoneList();
        await persistEditorZones();
      };
    });

  function openMapPicker(){
    var el = document.getElementById("editor-banner");
    el.innerHTML = '<div class="banner info">Chargement des cartes…</div>';
    loadMapsIndex().then(function(list){
      if(!list.length){
        el.innerHTML = '<div class="banner">Aucune carte enregistrée pour l\u2019instant.</div>';
        return;
      }
      el.innerHTML = '<div class="panel" style="margin-top:10px;">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Cartes enregistrées</label>' +
        '<div class="zone-list">' +
        list.map(function(m){
          return '<div class="zone-row" data-mapid="'+m.id+'">' +
            '<span class="name" style="cursor:pointer;">'+escapeHtml(m.name)+'</span>' +
            '<span class="dist">'+m.zoneCount+' élém.</span>' +
            '<button class="remove-chip map-del" data-mapid="'+m.id+'" data-name="'+escapeHtml(m.name)+'">✕</button>' +
          '</div>';
        }).join("") +
        '</div></div>';
      Array.prototype.forEach.call(el.querySelectorAll(".zone-row[data-mapid]"), function(row){
        row.onclick = async function(){
          var tpl = await loadMapTemplate(row.dataset.mapid);
          if(!tpl){ el.innerHTML = '<div class="banner warn">Impossible de charger cette carte.</div>'; return; }
          state.editorZones = tpl.zones.map(function(z){
            if(z.kind === "point"){ return { id: genId("pt"), kind:"point", name:z.name, latlng:z.latlng, icon:z.icon, color:z.color }; }
            if(z.kind === "drapeau"){ return { id: genId("f"), kind:"drapeau", name:z.name, points:z.points, captureOwner:null, captureTarget:null, captureProgress:0, captureLastTick:null }; }
            return { id: genId("z"), kind: z.kind || "building", name: z.name, points: z.points, status: "intact" };
          });
          drawExistingZones(); drawZoneList();
          el.innerHTML = '<div class="banner info">Carte « '+escapeHtml(tpl.name)+' » chargée.</div>';
          await persistEditorZones();
        };
      });
      Array.prototype.forEach.call(el.querySelectorAll(".map-del"), function(btn){
        btn.onclick = async function(e){
          e.stopPropagation();
          if(!confirm("Supprimer la carte « "+btn.dataset.name+" » ? Cette action est irréversible.")) return;
          await deleteMapTemplate(btn.dataset.mapid);
          openMapPicker();
        };
      });
    });
  }

  function saveCurrentAsTemplate(){
    var el = document.getElementById("editor-banner");
    if(!state.editorZones.length){
      el.innerHTML = '<div class="banner warn">Ajoute au moins un élément avant d\u2019enregistrer.</div>';
      return;
    }
    el.innerHTML =
      '<div class="panel" style="margin-top:10px;"><div class="field" style="margin-top:0;"><label>Nom de la carte</label>' +
      '<input type="text" id="map-name" placeholder="Ex. Terrain de la Ferme" /></div>' +
      '<div class="row" style="margin-top:8px;"><button class="btn btn-sm btn-primary" id="btn-confirm-save-map">Enregistrer</button></div></div>';
    var input = document.getElementById("map-name");
    input.focus();
    document.getElementById("btn-confirm-save-map").onclick = async function(){
      var name = input.value.trim();
      if(!name) return;
      var tpl = { id: genId("map"), name: name, center: state.editorCenter || null, zones: state.editorZones.filter(function(z){ return z.kind !== "guerre" && z.kind !== "gaz"; }).map(function(z){
        if(z.kind === "point"){ return { kind:"point", name:z.name, latlng:z.latlng, icon:z.icon, color:z.color }; }
        return { kind: z.kind || "building", name: z.name, points: z.points };
      }) };
      var ok = await saveMapTemplate(tpl);
      el.innerHTML = ok
        ? '<div class="banner info">Carte « '+escapeHtml(name)+' » enregistrée — réutilisable pour tes prochains événements.</div>'
        : '<div class="banner warn">Échec de l\u2019enregistrement. Réessaie.</div>';
    };
  }

  function teardownEditorMap(){
    state.drawing = false; state.drawPoints = []; state.drawLayer = null; state.drawKind = null; state.placingPoint = false;
    state.editingZoneId = null;
    stopEditorGeoWatch();
    if(state.editorMap){ state.editorMap.remove(); state.editorMap = null; }
    state.editorLayers = {};
    state.segmentLabelLayers = [];
    if(state.refImageOverlayEl && state.refImageOverlayEl.parentNode){ state.refImageOverlayEl.parentNode.removeChild(state.refImageOverlayEl); }
    state.refImageOverlayEl = null;
    state.refImageDataUrl = null;
    state.refImageBounds = null;
    state.refImageHandles = [];
    state.refImageRotation = 0;
    state.flagCreationMode = null;
    state.warzoneCreationMode = null;
    state.drawPointsRedo = [];
    state.zoneListCollapsed = {};
  }

      var n = await mergeDuplicatePlayers(cfg.code);
      document.getElementById("roles-banner").innerHTML =
        '<div class="banner info">'+(n ? (n+" doublon(s) supprimé(s).") : "Aucun doublon trouvé.")+'</div>';
      loadRolesData();
    };
    document.getElementById("btn-access-code-save").onclick = async function(){
      var val = document.getElementById("access-code-input").value.trim();
      if(!val) return;

      document.getElementById("access-code-banner").innerHTML = ok
        ? '<div class="banner info">Code enregistré.</div>'
        : '<div class="banner warn">Échec de l\u2019enregistrement.</div>';

    };
    var removeBtn = document.getElementById("btn-access-code-remove");
    if(removeBtn) removeBtn.onclick = async function(){
      if(!confirm("Retirer le verrou d\u2019accès organisateur ? Ces écrans redeviendront ouverts sans code.")) return;
      state.event.accessCode = null;
      var ok = await saveEventConfig(state.event);

    loadRolesData();

    async function loadRolesData(){
      var teamsEl = document.getElementById("teams-visibility");
      var staffEl = document.getElementById("staff-list");
      var transferEl = document.getElementById("admin-transfer");
      var zombieEl = document.getElementById("zombie-list");
      var fogEl = document.getElementById("fog-list");
      var fogTeamEl = document.getElementById("fog-team-list");
      var fogSquadEl = document.getElementById("fog-squad-list");
      var bonusEl = document.getElementById("bonus-list");
      var bonusTeamEl = document.getElementById("bonus-team-list");
      var bonusSquadEl = document.getElementById("bonus-squad-list");
      teamsEl.innerHTML = '<p class="mono" style="font-size:11px;color:var(--ink-dim);">Chargement…</p>';
      staffEl.innerHTML = "";
      transferEl.innerHTML = "";
      zombieEl.innerHTML = "";
      fogEl.innerHTML = "";
      fogTeamEl.innerHTML = "";
      fogSquadEl.innerHTML = "";
      bonusEl.innerHTML = "";
      bonusTeamEl.innerHTML = "";
      bonusSquadEl.innerHTML = "";

      var players = await loadPlayers(cfg.code);
      var vis = await loadVisibility(cfg.code);

      teamsEl.innerHTML = cfg.teams.filter(function(t){ return t.name !== "Staff"; }).map(function(t){
        var on = vis.revealedTeams.indexOf(t.name) !== -1;
        return '<div class="test-toggle"><span style="color:'+t.color+'">● '+escapeHtml(t.name)+'</span>' +
          '<input type="checkbox" class="team-vis-toggle" data-team="'+escapeHtml(t.name)+'" '+(on?'checked':'')+' /></div>';
      }).join("");
      Array.prototype.forEach.call(teamsEl.querySelectorAll(".team-vis-toggle"), function(cb){
        cb.onchange = async function(){
          var team = cb.dataset.team;
          var idx = vis.revealedTeams.indexOf(team);
          if(cb.checked && idx === -1) vis.revealedTeams.push(team);
          if(!cb.checked && idx !== -1) vis.revealedTeams.splice(idx, 1);
          await saveVisibility(cfg.code, vis);
        };
      });

      var pids = Object.keys(players);
      if(!pids.length){
        staffEl.innerHTML = '<p>Aucun joueur n\u2019a encore rejoint.</p>';
        transferEl.innerHTML = '<p>Aucun joueur n\u2019a encore rejoint.</p>';
        return;
      }
      staffEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        var isStaff = p.role === "staff";
        return '<div class="test-toggle"><span>'+escapeHtml(p.name||"?")+
          '<span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<span class="row" style="gap:8px;">' +
            '<input type="checkbox" class="staff-toggle" data-pid="'+pid+'" '+(isStaff?'checked':'')+' />' +
            '<button class="remove-chip player-del" data-pid="'+pid+'" data-name="'+escapeHtml(p.name||"?")+'">✕</button>' +
          '</span></div>';
      }).join("");
      Array.prototype.forEach.call(staffEl.querySelectorAll(".staff-toggle"), function(cb){
        cb.onchange = async function(){
          await setPlayerRole(cfg.code, cb.dataset.pid, cb.checked ? "staff" : "");
        };
      });
      Array.prototype.forEach.call(staffEl.querySelectorAll(".player-del"), function(btn){
        btn.onclick = async function(){
          if(!confirm("Retirer "+btn.dataset.name+" de la partie ? (Si son téléphone est encore actif, il peut réapparaître.)")) return;
          await deletePlayer(cfg.code, btn.dataset.pid);
          loadRolesData();
        };
      });

      var staffPids = pids.filter(function(pid){ return players[pid].role === "staff" && pid !== state.playerId; });
      if(!staffPids.length){
        transferEl.innerHTML = '<p>Désigne d\u2019abord un membre du staff ci-dessus pour pouvoir lui transférer l\u2019administration.</p>';
      } else {
        transferEl.innerHTML = staffPids.map(function(pid){
          return '<div class="zone-row"><span class="name">'+escapeHtml(players[pid].name||"?")+'</span>' +
            '<button class="btn btn-sm btn-ghost transfer-admin" data-pid="'+pid+'">Nommer admin</button></div>';
        }).join("");
        Array.prototype.forEach.call(transferEl.querySelectorAll(".transfer-admin"), function(btn){
          btn.onclick = async function(){
            if(!confirm("Transférer l\u2019administration à "+(players[btn.dataset.pid].name||"ce joueur")+" ? Tu deviendras staff à la place.")) return;
            vis.adminId = btn.dataset.pid;
            await saveVisibility(cfg.code, vis);
            await setPlayerRole(cfg.code, state.playerId, "staff");
            state.isOrganizer = false;
            state.screen = "map";
            render();
          };
        });
      }

      zombieEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        return '<div class="test-toggle"><span>'+escapeHtml(p.name||"?")+
          '<span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<input type="checkbox" class="zombie-toggle" data-pid="'+pid+'" '+(p.infected?'checked':'')+' /></div>';
      }).join("");
      Array.prototype.forEach.call(zombieEl.querySelectorAll(".zombie-toggle"), function(cb){
        cb.onchange = async function(){
          await setPlayerInfected(cfg.code, cb.dataset.pid, cb.checked);
        };
      });

      // Applique (ou lève) le brouillard sur un lot de joueurs d'un coup (équipe/escouade).
      async function applyFogToPids(matchingPids, minutes){
        var until = Date.now() + minutes*60000;
        for(var i=0; i<matchingPids.length; i++){
          await upsertPlayer(cfg.code, matchingPids[i], { fogUntil: until });
        }
        loadRolesData();
      }

      var teamsForFog = cfg.teams.filter(function(t){ return t.name !== "Staff"; });
      fogTeamEl.innerHTML = teamsForFog.length ? teamsForFog.map(function(t){
        var count = pids.filter(function(pid){ return players[pid].team === t.name; }).length;
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name" style="color:'+t.color+'">● '+escapeHtml(t.name)+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+count+' joueur(s)</span></span>' +
          '<input type="number" class="fog-team-minutes" data-team="'+escapeHtml(t.name)+'" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost fog-team-apply" data-team="'+escapeHtml(t.name)+'">Appliquer</button></div>';
      }).join("") : '<p>Aucune équipe pour l\u2019instant.</p>';
      Array.prototype.forEach.call(fogTeamEl.querySelectorAll(".fog-team-apply"), function(btn){
        btn.onclick = function(){
          var team = btn.dataset.team;
          var input = btn.closest(".zone-row").querySelector(".fog-team-minutes");
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          var matching = pids.filter(function(pid){ return players[pid].team === team; });
          if(!matching.length) return;
          if(!confirm("Appliquer le brouillard à toute l\u2019équipe "+team+" ("+matching.length+" joueur(s)) ?")) return;
          applyFogToPids(matching, minutes);
        };
      });

      var squadGroups = {};
      pids.forEach(function(pid){
        var p = players[pid];
        var sq = (p.squad||"").trim();
        if(!sq) return;
        var key = (p.team||"") + " \u2014 " + sq;
        if(!squadGroups[key]) squadGroups[key] = [];
        squadGroups[key].push(pid);
      });
      var squadKeys = Object.keys(squadGroups);
      fogSquadEl.innerHTML = squadKeys.length ? squadKeys.map(function(key){
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name">'+escapeHtml(key)+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+squadGroups[key].length+' joueur(s)</span></span>' +
          '<input type="number" class="fog-squad-minutes" data-key="'+escapeHtml(key)+'" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost fog-squad-apply" data-key="'+escapeHtml(key)+'">Appliquer</button></div>';
      }).join("") : '<p>Aucune escouade renseignée pour l\u2019instant (les joueurs la choisissent eux-mêmes en rejoignant).</p>';
      Array.prototype.forEach.call(fogSquadEl.querySelectorAll(".fog-squad-apply"), function(btn){
        btn.onclick = function(){
          var key = btn.dataset.key;
          var input = btn.closest(".zone-row").querySelector(".fog-squad-minutes");
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          var matching = squadGroups[key] || [];
          if(!matching.length) return;
          if(!confirm("Appliquer le brouillard à l\u2019escouade \u00ab "+key+" \u00bb ("+matching.length+" joueur(s)) ?")) return;
          applyFogToPids(matching, minutes);
        };
      });

      fogEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        var active = p.fogUntil && p.fogUntil > Date.now();
        if(active){
          var remaining = Math.max(1, Math.ceil((p.fogUntil - Date.now())/60000));
          return '<div class="zone-row"><span class="name">'+escapeHtml(p.name||"?")+
            ' <span class="mono" style="font-size:10px;color:var(--amber);">· 🌫 encore ~'+remaining+' min</span></span>' +
            '<button class="btn btn-sm btn-ghost fog-lift" data-pid="'+pid+'">Lever</button></div>';
        }
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name">'+escapeHtml(p.name||"?")+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<input type="number" class="fog-minutes" data-pid="'+pid+'" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost fog-apply" data-pid="'+pid+'">Appliquer</button></div>';
      }).join("");
      Array.prototype.forEach.call(fogEl.querySelectorAll(".fog-apply"), function(btn){
        btn.onclick = async function(){
          var pid = btn.dataset.pid;
          var input = fogEl.querySelector('.fog-minutes[data-pid="'+pid+'"]');
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          await upsertPlayer(cfg.code, pid, { fogUntil: Date.now() + minutes*60000 });
          loadRolesData();
        };
      });
      Array.prototype.forEach.call(fogEl.querySelectorAll(".fog-lift"), function(btn){
        btn.onclick = async function(){
          await upsertPlayer(cfg.code, btn.dataset.pid, { fogUntil: null });
          loadRolesData();
        };
      });

      // ---- 📡 Bonus radar (même mécanique que le brouillard, en positif) ----
      async function applyBonusToPids(matchingPids, minutes){
        var until = Date.now() + minutes*60000;
        for(var i=0; i<matchingPids.length; i++){
          await upsertPlayer(cfg.code, matchingPids[i], { radarBonusUntil: until });
        }
        loadRolesData();
      }

      bonusTeamEl.innerHTML = teamsForFog.length ? teamsForFog.map(function(t){
        var count = pids.filter(function(pid){ return players[pid].team === t.name; }).length;
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name" style="color:'+t.color+'">● '+escapeHtml(t.name)+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+count+' joueur(s)</span></span>' +
          '<input type="number" class="bonus-team-minutes" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost bonus-team-apply" data-team="'+escapeHtml(t.name)+'">Appliquer</button></div>';
      }).join("") : '<p>Aucune équipe pour l\u2019instant.</p>';
      Array.prototype.forEach.call(bonusTeamEl.querySelectorAll(".bonus-team-apply"), function(btn){
        btn.onclick = function(){
          var team = btn.dataset.team;
          var input = btn.closest(".zone-row").querySelector(".bonus-team-minutes");
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          var matching = pids.filter(function(pid){ return players[pid].team === team; });
          if(!matching.length) return;
          applyBonusToPids(matching, minutes);
        };
      });

      bonusSquadEl.innerHTML = squadKeys.length ? squadKeys.map(function(key){
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name">'+escapeHtml(key)+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+squadGroups[key].length+' joueur(s)</span></span>' +
          '<input type="number" class="bonus-squad-minutes" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost bonus-squad-apply" data-key="'+escapeHtml(key)+'">Appliquer</button></div>';
      }).join("") : '<p>Aucune escouade renseignée pour l\u2019instant.</p>';
      Array.prototype.forEach.call(bonusSquadEl.querySelectorAll(".bonus-squad-apply"), function(btn){
        btn.onclick = function(){
          var key = btn.dataset.key;
          var input = btn.closest(".zone-row").querySelector(".bonus-squad-minutes");
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          var matching = squadGroups[key] || [];
          if(!matching.length) return;
          applyBonusToPids(matching, minutes);
        };
      });

      bonusEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        var active = p.radarBonusUntil && p.radarBonusUntil > Date.now();
        if(active){
          var remaining = Math.max(1, Math.ceil((p.radarBonusUntil - Date.now())/60000));
          return '<div class="zone-row"><span class="name">'+escapeHtml(p.name||"?")+
            ' <span class="mono" style="font-size:10px;color:var(--amber);">· 📡 encore ~'+remaining+' min</span></span>' +
            '<button class="btn btn-sm btn-ghost bonus-lift" data-pid="'+pid+'">Retirer</button></div>';
        }
        return '<div class="zone-row" style="flex-wrap:wrap;gap:6px;"><span class="name">'+escapeHtml(p.name||"?")+
          ' <span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<input type="number" class="bonus-minutes" data-pid="'+pid+'" value="5" min="1" style="width:58px;text-align:center;" />' +
          '<button class="btn btn-sm btn-ghost bonus-apply" data-pid="'+pid+'">Appliquer</button></div>';
      }).join("");
      Array.prototype.forEach.call(bonusEl.querySelectorAll(".bonus-apply"), function(btn){
        btn.onclick = async function(){
          var pid = btn.dataset.pid;
          var input = bonusEl.querySelector('.bonus-minutes[data-pid="'+pid+'"]');
          var minutes = Math.max(1, parseInt(input && input.value, 10) || 5);
          await upsertPlayer(cfg.code, pid, { radarBonusUntil: Date.now() + minutes*60000 });
          loadRolesData();
        };
      });
      Array.prototype.forEach.call(bonusEl.querySelectorAll(".bonus-lift"), function(btn){
        btn.onclick = async function(){
          await upsertPlayer(cfg.code, btn.dataset.pid, { radarBonusUntil: null });
          loadRolesData();
        };
      });
    }
  }

  // ---------- Écran Bibliothèque de cartes ----------
  function renderLibrary(){
    app.innerHTML =
      '<div class="topbar"><button class="back">‹ Retour</button><div class="eyebrow">Bibliothèque de cartes</div></div>' +
      '<div class="field"><input type="text" id="lib-search" placeholder="Rechercher un terrain par nom…" /></div>' +
      '<div class="map-rotate-wrapper" style="height:38vh;"><div id="lib-map"></div></div>' +
      '<div id="lib-list" class="zone-list" style="margin-top:12px;"></div>' +
      '<div class="row" style="margin-top:14px;">' +
        '<button class="btn btn-sm btn-ghost" id="btn-share-map">Partager une de mes cartes</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-go-moderation">🛡 Modération</button>' +
      '</div>' +
      '<div id="lib-banner"></div>';

    var libMap = null, libMarkers = {}, allEntries = [];

    function teardownLibraryMap(){ if(libMap){ libMap.remove(); libMap = null; } }

    document.querySelector(".back").onclick = function(){ teardownLibraryMap(); state.screen="home"; render(); };
    document.getElementById("btn-go-moderation").onclick = function(){ teardownLibraryMap(); state.screen="moderation"; render(); };

    if(LIBS_OK.leaflet){
      libMap = L.map('lib-map', { zoomControl:true }).setView([46.6, 2.5], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(libMap);
      setTimeout(function(){ if(libMap) libMap.invalidateSize(); }, 100);
    }

    function highlightRow(id){
      var row = document.getElementById("lib-row-"+id);
      if(!row) return;
      row.scrollIntoView({ behavior:"smooth", block:"center" });
      row.style.transition = "background 0.3s";
      row.style.background = "rgba(201,162,39,0.25)";
      setTimeout(function(){ row.style.background = ""; }, 1200);
    }

    function renderPins(filtered){
      if(!libMap) return;
      Object.keys(libMarkers).forEach(function(id){ libMap.removeLayer(libMarkers[id]); });
      libMarkers = {};
      var withCenter = filtered.filter(function(e){ return e.center && typeof e.center.lat === "number"; });
      withCenter.forEach(function(entry){
        var icon = L.divIcon({ html:'<div style="font-size:22px;line-height:1;">🚩</div>', className:'', iconSize:[24,24], iconAnchor:[12,22] });
        var marker = L.marker([entry.center.lat, entry.center.lng], { icon: icon }).addTo(libMap).bindTooltip(escapeHtml(entry.name));
        marker.on("click", function(){ highlightRow(entry.id); });
        libMarkers[entry.id] = marker;
      });
      if(withCenter.length){
        var bounds = L.latLngBounds(withCenter.map(function(e){ return [e.center.lat, e.center.lng]; }));
        libMap.fitBounds(bounds, { padding:[30,30], maxZoom:14 });
      }
    }

    function renderList(filtered){
      var listEl = document.getElementById("lib-list");
      if(!filtered.length){
        listEl.innerHTML = '<p>Aucun terrain trouvé.</p>';
        return;
      }
      listEl.innerHTML = filtered.map(function(entry){
        var voted = hasVotedLocally(entry.id);
        return '<div class="zone-row" id="lib-row-'+entry.id+'" style="flex-wrap:wrap;gap:6px;">' +
          '<span class="name">'+escapeHtml(entry.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+(entry.zoneCount||0)+' élém. · ⭐ '+(entry.starCount||0)+'</span></span>' +
          '<button class="btn btn-sm btn-primary lib-use" data-id="'+entry.id+'">Utiliser</button>' +
          '<button class="btn btn-sm btn-ghost lib-vote" data-id="'+entry.id+'" '+(voted?'disabled':'')+'>'+(voted?'✓':'⭐')+'</button>' +
          '<button class="btn btn-sm btn-ghost lib-share" data-id="'+entry.id+'">🔗</button>' +
        '</div>';
      }).join("");

      Array.prototype.forEach.call(listEl.querySelectorAll(".lib-use"), function(btn){
        btn.onclick = async function(){
          var entry = await loadLibraryEntry(btn.dataset.id);
          if(!entry) return;
          state._draftName = entry.name;
          state._draftCenter = entry.center || null;
          state._draftZones = entry.zones.map(function(z){
            if(z.kind === "point") return { id: genId("pt"), kind:"point", name:z.name, latlng:z.latlng, icon:z.icon, color:z.color };
            if(z.kind === "terrain") return { id: genId("t"), kind:"terrain", name: z.name||"Limite du terrain", points: z.points };
            if(z.kind === "mur" || z.kind === "demimur") return { id: genId("w"), kind: z.kind, name: z.name, points: z.points };
            if(z.kind === "drapeau") return { id: genId("f"), kind:"drapeau", name: z.name, points: z.points, captureOwner:null, captureTarget:null, captureProgress:0, captureLastTick:null };
            return { id: genId("z"), kind:"building", name: z.name, points: z.points, status:"intact" };
          });
          teardownLibraryMap();
          state.screen = "create";
          render();
        };
      });
      Array.prototype.forEach.call(listEl.querySelectorAll(".lib-vote"), function(btn){
        btn.onclick = async function(){
          await voteLibraryEntry(btn.dataset.id);
          markVotedLocally(btn.dataset.id);
          loadAndRender();
        };
      });
      Array.prototype.forEach.call(listEl.querySelectorAll(".lib-share"), function(btn){
        btn.onclick = function(){
          var url = location.origin + location.pathname + "?map=" + btn.dataset.id;
          if(navigator.clipboard) navigator.clipboard.writeText(url);
          var old = btn.textContent;
          btn.textContent = "Copié ✓";
          setTimeout(function(){ btn.textContent = old; }, 1500);
        };
      });
    }

    function applyFilter(){
      var q = (document.getElementById("lib-search").value||"").trim().toLowerCase();
      var filtered = q ? allEntries.filter(function(e){ return e.name.toLowerCase().indexOf(q) !== -1; }) : allEntries;
      renderList(filtered);
      renderPins(filtered);
    }

    async function loadAndRender(){
      var idx = await loadLibraryIndex();
      allEntries = idx.filter(function(e){ return e.status === "approved"; });
      applyFilter();
      if(state.pendingLibraryHighlight){
        var target = state.pendingLibraryHighlight;
        state.pendingLibraryHighlight = null;
        setTimeout(function(){ highlightRow(target); }, 400);
      }
    }
    document.getElementById("lib-search").oninput = applyFilter;
    loadAndRender();

    document.getElementById("btn-share-map").onclick = async function(){
      var idx = await loadMapsIndex();
      var banner = document.getElementById("lib-banner");
      if(!idx.length){
        banner.innerHTML = '<div class="banner">Aucune carte enregistrée pour l\u2019instant — enregistre-en une depuis l\u2019éditeur de carte.</div>';
        return;
      }
      banner.innerHTML = '<div class="panel" style="margin-top:10px;"><label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Choisis une carte à proposer</label>' +
        '<div class="zone-list" style="margin-top:8px;">' +
        idx.map(function(m){ return '<div class="zone-row"><span class="name">'+escapeHtml(m.name)+'</span><button class="btn btn-sm btn-primary share-pick" data-id="'+m.id+'">Proposer</button></div>'; }).join("") +
        '</div></div>';
      Array.prototype.forEach.call(banner.querySelectorAll(".share-pick"), function(btn){
        btn.onclick = async function(){
          var tpl = await loadMapTemplate(btn.dataset.id);
          if(tpl && !tpl.center){
            banner.innerHTML = '<div class="banner warn">Cette carte a été enregistrée avant l\u2019ajout de la localisation — recharge-la dans l\u2019éditeur puis réenregistre-la pour pouvoir la partager.</div>';
            return;
          }
          var id = await shareToLibrary(btn.dataset.id, null);
          banner.innerHTML = id
            ? '<div class="banner info">Carte proposée — elle apparaîtra dans la bibliothèque une fois validée par un modérateur.</div>'
            : '<div class="banner warn">Échec de l\u2019envoi.</div>';
        };
      });
    };
  }

  // ---------- Messages vocaux (enregistrement local, pas de temps réel — voir explication ----------
  // à l'utilisateur : un vrai chat vocal en direct demanderait un serveur dédié, hors de
  // portée de cette architecture GitHub Pages + Firebase. Ceci enregistre un court message,
  // l'envoie comme une pièce jointe audio dans le chat existant.
  function pickAudioMimeType(){
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for(var i=0;i<candidates.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  async function startVoiceRecording(){
    if(!navigator.mediaDevices || !window.MediaRecorder){
      alert("Enregistrement audio non pris en charge par ce navigateur.");
      return;
    }
    try{
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.voiceStream = stream;
      var mimeType = pickAudioMimeType();
      var recorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      state.voiceChunks = [];
      recorder.ondataavailable = function(e){ if(e.data && e.data.size) state.voiceChunks.push(e.data); };
      recorder.onstop = function(){
        if(state.voiceStream){ state.voiceStream.getTracks().forEach(function(t){ t.stop(); }); state.voiceStream = null; }
        if(!state.voiceChunks.length) return; // annulé avant la moindre donnée : rien à faire
        var blob = new Blob(state.voiceChunks, { type: recorder.mimeType || "audio/webm" });
        var reader = new FileReader();
        reader.onload = function(ev){
          state.voicePreviewDataUrl = ev.target.result;
          renderChatComposeArea();
        };
        reader.readAsDataURL(blob);
      };
      state.voiceRecorder = recorder;
      state.voiceRecordStart = Date.now();
      recorder.start();
      renderChatComposeArea();
      state.voiceRecordTimer = setInterval(function(){
        var elapsed = (Date.now() - state.voiceRecordStart) / 1000;
        var timerEl = document.getElementById("voice-timer");
        if(timerEl){
          var s = Math.floor(elapsed);
          timerEl.textContent = "🔴 Enregistrement… 0:" + ("0"+s).slice(-2) + " / 0:" + ("0"+VOICE_MAX_SECONDS).slice(-2);
        }
        if(elapsed >= VOICE_MAX_SECONDS) stopVoiceRecording();
      }, 250);
    }catch(e){
      alert("Impossible d\u2019accéder au micro (autorisation refusée ?).");
    }
  }

  // ---------- Panneau de configuration du Scénario personnalisé (organisateur) ----------
  // ---------- Générateur automatique de scénario (basé sur des règles, pas une IA) ----------
  // Aucune clé API, aucun serveur externe : uniquement des règles simples appliquées à la
  // carte déjà chargée (bâtiments existants) et aux équipes de l'événement.
  function buildingCentroid(z){
    var sx = 0, sy = 0;
    z.points.forEach(function(p){ sx += p[0]; sy += p[1]; });
    return [sx / z.points.length, sy / z.points.length];
  }

  // Sélection gloutonne "point le plus éloigné" : choisit des bâtiments bien répartis sur
  // la carte plutôt que regroupés au même endroit.
  function pickSpreadBuildings(buildings, count){
    if(buildings.length <= count) return buildings.slice();
    var withCentroid = buildings.map(function(b){ return { z:b, c: buildingCentroid(b) }; });
    var chosen = [withCentroid[Math.floor(Math.random()*withCentroid.length)]];
    var remaining = withCentroid.filter(function(w){ return w !== chosen[0]; });
    while(chosen.length < count && remaining.length){
      var best = null, bestDist = -1;
      remaining.forEach(function(w){
        var minDist = Math.min.apply(null, chosen.map(function(c){ return distanceMeters(w.c[0], w.c[1], c.c[0], c.c[1]); }));
        if(minDist > bestDist){ bestDist = minDist; best = w; }
      });
      chosen.push(best);
      remaining = remaining.filter(function(w){ return w !== best; });
    }
    return chosen.map(function(w){ return w.z; });
  }

  function computeAutoScenarioPlan(zones, playerCount, durationMinutes){
    var buildings = zones.filter(function(z){ return (z.kind === "building" || !z.kind) && isValidZone(z); });
    var teams = (state.event.teams||[]).filter(function(t){ return t.name !== "Staff"; });
    if(!buildings.length) return { error: "Aucun bâtiment sur cette carte — ajoute-en depuis l\u2019éditeur avant de générer un scénario." };
    if(teams.length < 1) return { error: "Aucune équipe définie pour cet événement." };

    var flagCount = playerCount <= 12 ? 1 : (playerCount <= 24 ? 2 : 3);
    flagCount = Math.min(flagCount, buildings.length);
    var mode = playerCount <= 12 ? "symmetric" : (playerCount <= 24 ? "asymmetric" : "battle_royale");
    var chosen = pickSpreadBuildings(buildings, flagCount);

    // Estimation grossière : ~55% de la durée demandée en capture active, le reste pour les
    // déplacements et le regroupement. Basé sur une escouade moyenne répartie sur les
    // drapeaux — à ajuster ensuite via les réglages capture & score si besoin.
    var activeMinutes = Math.max(2, durationMinutes * 0.55);
    var avgPushSize = Math.max(1, Math.round(playerCount / (teams.length * flagCount)));
    var mult = 1 + 0.1 * Math.min(avgPushSize - 1, 10);
    var captureBaseMinutes = Math.max(2, Math.round(activeMinutes * mult));

    var attacker = teams[0];
    var objectives = chosen.map(function(b){
      return {
        title: "Capturer " + b.name,
        buildingRef: b,
        requiredTeam: mode === "asymmetric" ? attacker.name : null
      };
    });

    var triggerGas = null;
    if(mode === "battle_royale"){
      var remainingMinutes = Math.max(3, durationMinutes - activeMinutes);
      triggerGas = {
        initialRadius: 15, growAmount: 20, phaseMinutes: Math.max(1, Math.round(remainingMinutes / 4)), maxRadius: null
      };
    }

    return {
      mode: mode, flagCount: flagCount, objectives: objectives, captureBaseMinutes: captureBaseMinutes,
      timeLimitMinutes: durationMinutes, triggerGas: triggerGas, attacker: mode === "asymmetric" ? attacker.name : null,
      teamsCount: teams.length, avgPushSize: avgPushSize
    };
  }

  function describeAutoScenarioPlan(plan){
    var modeLabel = plan.mode === "symmetric" ? "Capture symétrique" : (plan.mode === "asymmetric" ? "Attaque / Défense" : "Battle Royale (gaz)");
    var lines = [];
    lines.push("<b>Mode : " + modeLabel + "</b>");
    plan.objectives.forEach(function(o){
      lines.push("🚩 " + escapeHtml(o.buildingRef.name) + (o.requiredTeam ? (" — à capturer par " + escapeHtml(o.requiredTeam)) : " — première équipe à s\u2019y établir"));
    });
    lines.push("Temps de capture de base estimé : ~" + plan.captureBaseMinutes + " min (pour une pouss\u00e9e moyenne de " + plan.avgPushSize + " joueur(s))");
    lines.push("Limite de temps de la partie : " + plan.timeLimitMinutes + " min");
    if(plan.triggerGas) lines.push("☣️ Un gaz se déclenchera automatiquement une fois les objectifs atteints, pour forcer la confrontation finale.");
    lines.push('<span style="color:var(--ink-dim);font-size:11px;">Estimation approximative — ajustable ensuite dans "Réglages capture &amp; score".</span>');
    return lines.map(function(l){ return '<p style="margin-top:4px;">'+l+'</p>'; }).join("");
  }

  async function applyAutoScenarioPlan(plan, zones){
    var code = state.event.code;
    var createdObjectives = [];
    for(var i=0; i<plan.objectives.length; i++){
      var o = plan.objectives[i];
      var flagZone = {
        id: genId("f"), kind: "drapeau", name: o.buildingRef.name, points: o.buildingRef.points,
        captureOwner: null, captureTarget: null, captureProgress: 0, captureLastTick: null
      };
      zones.push(flagZone);
      createdObjectives.push({
        id: genId("obj"), title: o.title, linkedFlagId: flagZone.id,
        requiredTeam: o.requiredTeam, completed: false, completedAt: null
      });
    }
    await saveZones(code, zones);

    if(!state.event.scenario) state.event.scenario = { objectives: [], triggerGas: null, triggered: false };
    state.event.scenario.objectives = state.event.scenario.objectives.concat(createdObjectives);
    if(plan.triggerGas) state.event.scenario.triggerGas = plan.triggerGas;
    state.event.captureBaseMinutes = plan.captureBaseMinutes;
    state.event.timeLimitMinutes = plan.timeLimitMinutes;
    await saveEventConfig(state.event);
  }

  // Vérifie les objectifs liés à un drapeau (auto-complétion) et déclenche le gaz de fin si
  // configuré, une fois que TOUS les objectifs sont atteints. Ne fait rien si le scénario est
  // vide ou déjà entièrement traité.
  function tickScenario(zones){
    if(!state.event || !state.event.scenario) return null;
    var scenario = state.event.scenario;
    if(!scenario.objectives || !scenario.objectives.length) return null;
    var changed = false;
    var completedTitles = [];
    scenario.objectives.forEach(function(o){
      if(o.completed || !o.linkedFlagId) return;
      var z = zones.find(function(zz){ return zz.id === o.linkedFlagId; });
      if(!z) return;
      var ownerOk = o.requiredTeam ? (z.captureOwner === o.requiredTeam) : !!z.captureOwner;
      if(ownerOk){ o.completed = true; o.completedAt = Date.now(); changed = true; completedTitles.push(o.title); }
    });
    var allDone = scenario.objectives.every(function(o){ return o.completed; });
    var newGasZone = null;
    var gasTriggered = false;
    if(allDone && scenario.triggerGas && !scenario.triggered){
      scenario.triggered = true;
      changed = true;
      gasTriggered = true;
      var g = scenario.triggerGas;
      newGasZone = {
        id: genId("gas"), kind: "gaz", name: "Gaz (scénario)", center: state.event.center,
        initialRadius: g.initialRadius, growAmount: g.growAmount, phaseMinutes: g.phaseMinutes,
        maxRadius: g.maxRadius || null, startAt: Date.now(), frozenRadius: null
      };
    }
    return changed ? { newGasZone: newGasZone, completedTitles: completedTitles, gasTriggered: gasTriggered } : null;
  }

  // ---------- Rafraîchissement adapté à la batterie ----------
  // Le GPS + les échanges réseau réguliers consomment de la batterie. On ralentit
  // automatiquement la fréquence quand la batterie baisse (si le navigateur expose
  // cette info — Android/Chrome seulement, iPhone n'a pas cette API), et le joueur
  // garde la main via le bouton "Économie de batterie" quel que soit l'appareil.
  function getPollInterval(){
    if(state.batterySaverMode) return 10000;
    var lvl = state.batteryLevel; // 0-1, ou null si inconnu
    if(lvl === null || lvl === undefined) return 4000; // valeur d'origine si l'info n'est pas dispo
    if(lvl > 0.5) return 3000;
    if(lvl > 0.25) return 6000;
    return 10000;
  }
  function updateRefreshRateNote(){
    var el = document.getElementById("refresh-rate-note");
    if(!el) return;
    var ms = getPollInterval();
    var secs = Math.round(ms/1000);
    var batteryTxt = (state.batteryLevel !== null && state.batteryLevel !== undefined)
      ? (" · batterie " + Math.round(state.batteryLevel*100) + "%") : "";
    el.textContent = "Rafraîchissement toutes les " + secs + "s" + batteryTxt;
  }
  function restartPolling(){
    if(state.writeTimer){ clearInterval(state.writeTimer); state.writeTimer = null; }
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    var interval = getPollInterval();
    state.writeTimer = setInterval(writePositionNow, interval);
    state.pollTimer = setInterval(function(){ refreshPlayers(); refreshZones(); refreshPings(); }, interval);
    updateRefreshRateNote();
  }
  function setupBatteryAwareness(){
    if(state.batteryWatched) { updateRefreshRateNote(); return; }
    state.batteryWatched = true;
    if(!navigator.getBattery){ updateRefreshRateNote(); return; }
    navigator.getBattery().then(function(battery){
      state.batteryLevel = battery.level;
      restartPolling();
      battery.addEventListener("levelchange", function(){
        state.batteryLevel = battery.level;
        restartPolling();
      });
    }).catch(function(){ updateRefreshRateNote(); });
  }

  // ---------- Rotation manuelle de la carte (cadran + geste à deux doigts, façon Google Maps) ----------
  // Le capteur boussole des téléphones s'est révélé trop peu fiable (saccades, valeurs
  // erratiques) — le joueur oriente lui-même la carte, ce qui est stable partout.
  function recenterOnMeIfPossible(){
    // Pour que la rotation pivote autour de "moi" (comme sur Google Maps) plutôt qu'autour
    // du centre initial du terrain, on recentre la carte sur la position actuelle du joueur
    // au moment où une rotation commence.
    if(state.map && state.lastCoords){
      state.map.panTo([state.lastCoords.lat, state.lastCoords.lng], { animate:false });
    }
  }

  function applyCompassRotation(){
    var mapEl = document.getElementById("map");
    if(mapEl) mapEl.style.transform = "translate(-50%,-50%) rotate(" + (-state.compassAngle) + "deg)";
    document.documentElement.style.setProperty("--compass-angle", state.compassAngle + "deg");

    // Déplacer la carte au doigt pendant qu'elle est tournée inverserait le sens du geste
    // (haut/bas, gauche/droite) — on désactive donc le glissement tant qu'elle n'est pas
    // orientée Nord en haut, pour éviter cette confusion. Le zoom (pincement) reste possible.
    var isNorth = (state.compassAngle < 2 || state.compassAngle > 358);
    if(state.map){
      if(isNorth) state.map.dragging.enable(); else state.map.dragging.disable();
    }
    var hint = document.getElementById("compass-drag-hint");
    if(hint) hint.textContent = isNorth ? "" : "Déplacement désactivé pendant la rotation — remets Nord en haut pour te déplacer.";
  }

  function setupCompassDial(){
    var dial = document.getElementById("compass-dial");
    if(!dial) return;
    var dragging = false;

    function angleFromPoint(clientX, clientY){
      var rect = dial.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      var dx = clientX - cx, dy = clientY - cy;
      var deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      return (deg + 360) % 360;
    }

    dial.addEventListener("pointerdown", function(e){
      dragging = true;
      try{ dial.setPointerCapture(e.pointerId); }catch(err){}
      recenterOnMeIfPossible();
      state.compassAngle = angleFromPoint(e.clientX, e.clientY);
      applyCompassRotation();
    });
    dial.addEventListener("pointermove", function(e){
      if(!dragging) return;
      state.compassAngle = angleFromPoint(e.clientX, e.clientY);
      applyCompassRotation();
    });
    dial.addEventListener("pointerup", function(){ dragging = false; });
    dial.addEventListener("pointercancel", function(){ dragging = false; });
  }

  // Geste à deux doigts directement sur la carte (comme Google Maps) : on se contente
  // d'observer les deux points de contact pour calculer l'angle, sans jamais bloquer les
  // événements — le pincement natif de Leaflet (zoom) continue donc de fonctionner en
  // même temps, exactement comme sur Google Maps.
  function setupMapRotateGesture(mapEl){
    var startAngle = null, startCompass = 0, recentered = false;
    function angleOf(t0, t1){
      return Math.atan2(t1.clientY - t0.clientY, t1.clientX - t0.clientX) * 180 / Math.PI;
    }
    mapEl.addEventListener("touchstart", function(e){
      if(e.touches.length === 2){
        startAngle = angleOf(e.touches[0], e.touches[1]);
        startCompass = state.compassAngle;
        recentered = false;
      } else {
        startAngle = null;
      }
    }, { passive:true });
    mapEl.addEventListener("touchmove", function(e){
      if(e.touches.length === 2 && startAngle !== null){
        var currentAngle = angleOf(e.touches[0], e.touches[1]);
        var delta = currentAngle - startAngle;
        // Ne recentre qu'à partir du moment où une vraie intention de rotation se confirme
        // (pas sur un simple pincement de zoom, où l'angle entre les doigts bouge à peine).
        if(!recentered && Math.abs(delta) > 3){
          recenterOnMeIfPossible();
          recentered = true;
        }
        state.compassAngle = ((startCompass + delta) % 360 + 360) % 360;
        applyCompassRotation();
      }
    }, { passive:true });
    mapEl.addEventListener("touchend", function(e){
      if(e.touches.length < 2) startAngle = null;
    }, { passive:true });
    mapEl.addEventListener("touchcancel", function(){ startAngle = null; }, { passive:true });
  }

  // Bascule proprement entre géolocalisation réelle et mode test : l'une des
  // deux tourne à la fois, jamais les deux en même temps (c'est ce qui causait
  // le faux message "position indisponible" même quand on cliquait sur la carte).
  function applyGeoMode(){
    if(state.watchId !== null && navigator.geolocation){
      navigator.geolocation.clearWatch(state.watchId);
      state.watchId = null;
    }
    var banner = document.getElementById("geo-banner");
    if(banner) banner.innerHTML = "";

    if(state.testMode){
      setStatus(!!state.lastCoords, state.lastCoords ? "Position définie (mode test)" : "Mode test — touche la carte pour définir ta position");
      return;
    }

    if(!navigator.geolocation){
      setStatus(false, "Géolocalisation non supportée");
      return;
    }
    setStatus(false, "Recherche de la position…");
    state.watchId = navigator.geolocation.watchPosition(function(pos){
      state.lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      setStatus(true, "Position active");
    }, function(err){
      setStatus(false, "Position indisponible");
      if(banner){
        banner.innerHTML = '<div class="banner warn">Géolocalisation refusée ou indisponible (' + escapeHtml(err.message) + ').</div>' +
          '<button class="btn btn-sm btn-ghost" id="btn-retry-geo" style="margin-top:8px;">Activer localisation &amp; caméra</button>';
        document.getElementById("btn-retry-geo").onclick = async function(){
          await requestAllPermissions("geo-banner");
          applyGeoMode();
        };
      }
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }

  function setStatus(ok, text){
    var dot = document.getElementById("status-dot"), t = document.getElementById("status-text");
    if(!dot) return;
    dot.className = "status-dot" + (ok ? "" : " off");
    t.textContent = text;
  }

  async function writePositionNow(){
    if(!state.lastCoords || !state.event) return;
    if(!state.player.name) return; // organisateur en mode "spectateur" sans équipe: on peut quand même afficher sa position s'il a un nom
    var payload = {
      name: state.player.name,
      team: state.player.team,
      squad: state.player.squad || "",
      sos: !!state.player.sos,
      staffHidden: !!state.player.staffHidden,
      lat: state.lastCoords.lat,
      lng: state.lastCoords.lng
    };
    // Rejoindre via l'équipe Staff accorde le rôle une seule fois, à la création du point —
    // ensuite l'organisateur garde la main entière via Rôles & visibilité (pas réimposé à chaque envoi).
    if(state.player._grantStaffOnJoin){
      payload.role = "staff";
      state.player._grantStaffOnJoin = false;
    }

    // ☠️ Match à mort : initialise les vies si le mode vient d'être activé, puis retire une
    // vie au moment précis où le joueur ENTRE dans une zone de spawn (pas à chaque cycle
    // passé dedans — seulement sur la transition dehors→dedans).
    if(state.event.deathmatchEnabled){
      if(typeof state.player.livesRemaining !== "number"){
        payload.livesRemaining = state.event.deathmatchLives || 3;
        state.player.livesRemaining = payload.livesRemaining;
      } else {
        var inSpawn = (state.cachedZones||[]).some(function(z){
          return (z.kind === "building" || !z.kind) && z.status === "spawn" && isValidZone(z) &&
            pointInPolygon(state.lastCoords.lat, state.lastCoords.lng, z.points);
        });
        if(inSpawn && !state.player._wasInSpawn && state.player.livesRemaining > 0){
          payload.livesRemaining = state.player.livesRemaining - 1;
          state.player.livesRemaining = payload.livesRemaining;
          if(payload.livesRemaining <= 0){
            appendEventLog(state.event.code, { ts: Date.now(), type: "deathmatch_out", name: state.player.name, team: state.player.team });
          }
        }
        state.player._wasInSpawn = inSpawn;
      }
    }

    await upsertPlayer(state.event.code, state.playerId, payload);
  }

  // ---------- Affichage Match à mort : vies individuelles + totaux par équipe ----------
  function updateLivesBoard(players){
    var el = document.getElementById("lives-board");

      totals[p.team] = (totals[p.team]||0) + p.livesRemaining;
    });
    var teams = Object.keys(totals);

    var myLine = mine !== null ? ('<span class="mono" style="font-size:11px;">❤️ Toi : <b>'+mine+'</b>'+(mine<=0?' — éliminé':'')+'</span>') : '';

      return '<span class="mono" style="font-size:11px;margin-left:8px;color:'+col+';">'+escapeHtml(t)+' <b>'+totals[t]+'</b></span>';
    }).join("");
    el.innerHTML = (myLine || teamLines) ? ('<div class="mini-banner"><span class="mono" style="font-size:10px;text-transform:uppercase;color:var(--ink-dim);">☠️ Vies</span> ' + myLine + teamLines + '</div>') : "";

  async function refreshPlayers(){
    if(!state.event) return;
    state.networkOk = true;
    var players = await loadPlayers(state.event.code);
    var vis = await loadVisibility(state.event.code);

    if(!state.networkOk){
      // Coupure réseau : on retombe sur la dernière image connue (localStorage) plutôt
      // que d'afficher une carte vidée, le temps que la connexion revienne.
      var cached = loadOfflineCache(state.event.code);
      if(cached){ players = cached.players || {}; vis = cached.vis || vis; }
      setOfflineIndicator(true, cached ? cached.ts : null);
    } else {
      setOfflineIndicator(false);
      saveOfflineCache(state.event.code, { players: players, vis: vis, ts: Date.now() });
    }

    if(vis.adminId && players[vis.adminId]) players[vis.adminId].isAdmin = true;
    state.cachedAllPlayers = players;

    // Statut admin/staff recalculé à chaque cycle (transfert possible en cours de partie)
    state.isOrganizer = (vis.adminId === state.playerId);
    var me = players[state.playerId];
    var myRole = me && me.role;
    var myTeam = me && me.team;
    var mySquad = me && me.squad;
    var mySos = me && me.sos;
    var amStaff = myRole === "staff";
    if(amStaff && me && typeof me.staffHidden === "boolean" && !document.getElementById("staff-actions").dataset.bound){
      state.player.staffHidden = me.staffHidden;
    }
    if(me && typeof me.livesRemaining === "number"){ state.player.livesRemaining = me.livesRemaining; }

    updateAdminUI();
    updateStaffUI(amStaff);

    var adminEntry = vis.adminId ? players[vis.adminId] : null;
    var adminGone = !state.isOrganizer && (!vis.adminId || !adminEntry || (Date.now() - (adminEntry.ts||0)) > 600000);
    updateClaimAdminUI(adminGone, vis);

    var amPrivileged = state.isOrganizer || amStaff;
    var teamRevealed = myTeam && vis.revealedTeams.indexOf(myTeam) !== -1;
    var myBonusUntil = me && me.radarBonusUntil;
    var myBonus = !!(myBonusUntil && myBonusUntil > Date.now());
    state.radarBonusUntil = myBonus ? myBonusUntil : null;
    var restricted = !amPrivileged && !teamRevealed && !myBonus;

    var visible = {};
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      if(pid === state.playerId){ visible[pid] = p; return; }
      if(amPrivileged){ visible[pid] = p; return; }
      if(p.role === "staff"){
        if(!p.staffHidden || mySos) visible[pid] = p;
        return;
      }
      if(restricted && p.team !== myTeam) return;
      visible[pid] = p;
    });

    if(state.squadOnly && mySquad){
      Object.keys(visible).forEach(function(pid){
        var p = visible[pid];
        if(pid !== state.playerId && p.role !== "staff" && p.team === myTeam && (p.squad||"") !== mySquad){
          delete visible[pid];
        }
      });
    }

    // 🌫 Brouillard : punition temporaire décidée par l'organisateur — coupe le radar
    // du joueur concerné (il ne voit plus que lui-même), sans toucher au reste (terrain,
    // zones). Prioritaire sur toutes les autres règles de visibilité.
    var myFogUntil = me && me.fogUntil;
    var fogged = !!(myFogUntil && myFogUntil > Date.now());
    state.fogUntil = fogged ? myFogUntil : null;
    if(fogged){
      visible = {};
      visible[state.playerId] = me;
    }
    updateFogBanner();
    updateRadarBonusBanner();

    var note = document.getElementById("vis-note");
    if(note) note.textContent = restricted ? "Vision limitée à ton équipe (sauf déblocage par le staff)." : "";

    updateMarkers(visible);
    updateRoster(visible);
    updateLivesBoard(players);
  }

  // ---------- Capture de drapeaux (façon "Domination" : occupation exclusive requise) ----------
  // Vitesse : +10% par joueur au-delà du premier, plafonné à +100% (10 joueurs) pour qu'une
  // grosse escouade ne rende jamais la capture instantanée. Avec 10 min de base (réglable par
  // l'organisateur), ça donne : 1 joueur = 10 min, 2 = ~9 min, 5 = ~7 min, 10+ = 5 min pile.
  var CAPTURE_SPEED_STEP = 0.1;
  var CAPTURE_SPEED_STEP_CAP = 10;

  // Ne fait rien tant que la zone n'a ni progression à figer ni horodatage à rafraîchir —
  // évite une écriture Firebase à chaque cycle pour des zones drapeau inactives. Accumule
  // aussi le score par équipe (occupation seule d'une zone, propriétaire ou en cours de
  // capture), selon le rythme choisi par l'organisateur.
  function tickFlagCaptures(zones, players, cfg){
    var now = Date.now();
    var dirty = false;
    var scoreDelta = {};
    var captureEvents = [];
    var baseSeconds = ((cfg && cfg.captureBaseMinutes) || 10) * 60;
    var scoreInterval = (cfg && cfg.scoreIntervalSeconds) || 30;
    var scorePerInterval = (cfg && typeof cfg.scorePointsPerInterval === "number") ? cfg.scorePointsPerInterval : 1;

    zones.forEach(function(z){
      if(z.kind !== "drapeau") return;
      var counts = {};
      Object.keys(players||{}).forEach(function(pid){
        var p = players[pid];
        if(!p || !p.team || p.team === "Staff" || p.role === "staff") return;
        if(typeof p.livesRemaining === "number" && p.livesRemaining <= 0) return; // éliminé (Match à mort) : ne compte plus
        if(typeof p.lat !== "number" || typeof p.lng !== "number") return;
        if(pointInPolygon(p.lat, p.lng, z.points)) counts[p.team] = (counts[p.team]||0) + 1;
      });
      var teamsPresent = Object.keys(counts);
      var last = z.captureLastTick || now;
      var elapsed = Math.min((now - last) / 1000, 30); // borné pour éviter un bond après une longue absence

      if(teamsPresent.length === 1){
        var team = teamsPresent[0];
        var count = counts[team];

        // Score : accumulé tant qu'une équipe occupe seule la zone (propriétaire ou en
        // cours de capture) — pas besoin d'attendre que la capture soit terminée.
        if(scorePerInterval > 0 && elapsed > 0){
          var pts = scorePerInterval * count * (elapsed / scoreInterval);
          scoreDelta[team] = (scoreDelta[team]||0) + pts;
        }

        if(team === z.captureOwner){
          if(z.captureLastTick !== now){ z.captureLastTick = now; dirty = true; }
          return;
        }
        if(z.captureTarget !== team){ z.captureTarget = team; z.captureProgress = 0; }
        var mult = 1 + CAPTURE_SPEED_STEP * Math.min(count - 1, CAPTURE_SPEED_STEP_CAP);
        var rate = (100 / baseSeconds) * mult;
        z.captureProgress = Math.min(100, (z.captureProgress||0) + rate * elapsed);
        z.captureLastTick = now;
        if(z.captureProgress >= 100){
          z.captureOwner = team;
          z.captureProgress = 0;
          z.captureTarget = null;
          captureEvents.push({ team: team, flagName: z.name });
        }
        dirty = true;
      } else {
        // Vide (personne) ou contesté (plusieurs équipes en même temps) : rien n'avance.
        // On remet juste l'horodatage à jour, pour ne pas créer un bond de progression
        // une fois la contestation terminée ou un joueur de retour.
        if(z.captureLastTick !== now){ z.captureLastTick = now; dirty = true; }
      }
    });
    return { dirty: dirty, scoreDelta: scoreDelta, captureEvents: captureEvents };
  }

  function updateFlagCaptureBanner(zones){

      var pct = Math.round(z.captureProgress||0);
      return '<div class="warzone-alert pending">' +
        '<div class="wz-name">🚩 '+escapeHtml(z.name)+'</div>' +
        '<div class="wz-time">Capture '+escapeHtml(z.captureTarget)+' — '+pct+'%</div>' +
        '<div class="flag-progress-track"><div class="flag-progress-fill" style="width:'+pct+'%;"></div></div>' +
      '</div>';
    }).join("");
  }

  function updateScoreboard(){
    var el = document.getElementById("scoreboard");
    if(!el) return;
    var score = state.cachedScore || {};
    var teams = Object.keys(score).filter(function(t){ return t !== "Staff"; });
    if(!teams.length){ el.innerHTML = ""; return; }
    teams.sort(function(a,b){ return (score[b]||0) - (score[a]||0); });
    el.innerHTML = '<div class="mini-banner"><span class="mono" style="font-size:10px;text-transform:uppercase;color:var(--ink-dim);">Score</span>' +
      teams.map(function(t){
        var col = teamColor(state.event || {}, t);
        return '<span class="mono" style="font-size:11px;margin-left:8px;color:'+col+';">'+escapeHtml(t)+' <b>'+Math.round(score[t]||0)+'</b></span>';
      }).join("") + '</div>';
    updateLimitsBanner();
