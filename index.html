<style>
  :root{
    --bg: #14170f;
    --panel: #1c2116;
    --panel-2: #232a1c;
    --line: #3a4430;
    --ink: #e8e6d9;
    --ink-dim: #8b9184;
    --amber: #c9a227;
    --amber-dim: #7a651c;
    --danger:#b3402f;
    --red:#e03c31;
    --green:#3ca55c;
    --blue:#3b82c4;
    --yellow:#d9a62e;
    --radius: 3px;
    --compass-angle: 0deg;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, rgba(140,150,110,0.06) 0, rgba(140,150,110,0.06) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(140,150,110,0.06) 0, rgba(140,150,110,0.06) 1px, transparent 1px, transparent 34px);
    color:var(--ink);
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--amber);
    text-transform:uppercase;
  }
  .eyebrow::before{ content:"// "; color:var(--amber-dim); }

  #app{ flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; padding:18px 16px 28px; }

  h1,h2,h3{ margin:0; font-weight:700; letter-spacing:.02em; }
  p{ margin:6px 0 0; color:var(--ink-dim); font-size:14px; line-height:1.5; }

  /* ---- Home / hero ---- */
  .hero{ position:relative; padding:38px 0 26px; text-align:center; overflow:hidden; }
  .reticle{
    position:absolute; top:50%; left:50%; width:230px; height:230px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(201,162,39,0.25); border-radius:50%;
    pointer-events:none;
  }
  .reticle::before,.reticle::after{
    content:""; position:absolute; background:rgba(201,162,39,0.25);
  }
  .reticle::before{ top:50%; left:-14px; right:-14px; height:1px; }
  .reticle::after{ left:50%; top:-14px; bottom:-14px; width:1px; }
  .sweep{
    position:absolute; top:50%; left:50%; width:230px; height:230px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: conic-gradient(from 0deg, rgba(201,162,39,0.35), transparent 28%);
    animation: spin 5s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .sweep{ animation:none; opacity:.4; } }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .hero-title{ position:relative; font-size:27px; letter-spacing:.05em; text-transform:uppercase; }
  .hero-sub{ position:relative; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; margin-top:6px; }
  .hero-patch{ position:relative; width:190px; height:auto; margin:0 auto 10px; display:block; filter:drop-shadow(0 0 14px rgba(201,162,39,0.25)); }
  .hero-credit{ position:relative; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--amber-dim); text-transform:uppercase; margin-top:10px; }

  .stack{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }

  /* ---- Buttons ---- */
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px 18px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-size:15px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--amber); border-color:var(--amber); color:#191a10; }
  .btn-primary:hover{ background:#dab233; }
  .btn-ghost{ background:transparent; }
  .btn-ghost:hover{ border-color:var(--ink-dim); }
  .btn-danger{ border-color:var(--danger); color:#f2a89a; background:transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-sm{ padding:10px 14px; font-size:12px; width:auto; }
  .link-btn{ background:none; border:none; color:var(--amber); text-decoration:underline; font-size:13px; padding:4px; }

  /* ---- Panels / forms ---- */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .field{ margin-top:14px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:6px; }
  input[type=text], input[type=number]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:16px; padding:12px; letter-spacing:.03em;
  }
  input[type=text]:focus, input[type=number]:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .code-input{ text-align:center; text-transform:uppercase; font-size:22px; letter-spacing:.3em; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .back{ background:none; border:none; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase; padding:6px 0; }
  .back:hover{ color:var(--ink); }

  /* ---- Teams ---- */
  .teams{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .team-chip{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:20px;
    border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.03em; text-transform:uppercase;
  }
  .team-chip.selected{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }
  .dot{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(0,0,0,.35); }
  .remove-chip{ background:none;border:none;color:var(--ink-dim); font-size:14px; line-height:1; padding:0 0 0 2px; }

  /* ---- QR / code reveal ---- */
  .code-reveal{ text-align:center; padding:22px 16px; }
  #qrcode{ display:inline-block; padding:12px; background:var(--ink); border-radius:var(--radius); margin:14px 0; }
  .big-code{ font-family:'JetBrains Mono',monospace; font-size:34px; letter-spacing:.35em; color:var(--amber); }

  /* ---- Map screen ---- */
  .map-rotate-wrapper{ width:100%; height:52vh; min-height:300px; overflow:hidden; position:relative; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); }
  #map{
    position:absolute; top:50%; left:50%;
    width:145%; height:145%;
    margin-left:-72.5%; margin-top:-72.5%;
    transition: transform 0.25s linear;
    transform-origin:50% 50%;
  }
  .status-bar{ display:flex; align-items:center; gap:8px; margin:10px 0; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); letter-spacing:.05em; text-transform:uppercase; }
  .compass-row{ display:flex; align-items:center; gap:14px; margin-top:12px; }
  .compass-dial{
    width:60px; height:60px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line);
    position:relative; flex:none; touch-action:none; cursor:grab;
  }
  .compass-dial-face{ position:absolute; inset:0; transform: rotate(var(--compass-angle)); }
  .compass-dial-n{ position:absolute; top:3px; left:50%; transform:translateX(-50%); color:var(--amber); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; }
  .compass-dial::after{ content:""; position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--ink-dim); }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; }
  .status-dot.off{ background:var(--danger); }
  .roster{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .roster-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .roster-row .name{ flex:1; font-size:14px; }
  .roster-row .name .you{ color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:10px; margin-left:6px; }
  .roster-row .dist{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  .roster-row.stale{ opacity:.4; }
  .leaflet-div-icon{ background:transparent; border:none; }
  .marker-badge{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 1px 4px rgba(0,0,0,.5);
    transform: rotate(var(--compass-angle)); transition: transform 0.25s linear;
  }
  .marker-badge.me{ box-shadow:0 0 0 4px rgba(201,162,39,0.35); }
  .marker-badge.sos{ animation: sospulse 1s ease-in-out infinite; }
  @keyframes sospulse{ 0%,100%{ box-shadow:0 0 0 4px rgba(179,64,47,0.55); } 50%{ box-shadow:0 0 0 9px rgba(179,64,47,0.12); } }
  .leaflet-tooltip.player-label{
    background: rgba(28,33,22,0.92); border:1px solid var(--line); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:10px; padding:1px 6px; border-radius:2px;
    box-shadow:none;
  }
  .leaflet-tooltip.player-label::before{ display:none; }
  .labels-hidden .player-label{ display:none; }
  .player-label-inner{ display:inline-block; transform: rotate(var(--compass-angle)); transition: transform 0.25s linear; }

  /* ---- Éditeur de bâtiments / zones ---- */
  #editor-map{ width:100%; height:42vh; min-height:260px; border-radius:var(--radius); border:1px solid var(--line); }
  .editor-toolbar{ margin-top:10px; }
  .zone-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .zone-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .zone-row .name{ flex:1; font-size:13px; }
  .zone-row .dist{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); }
  select.zone-status{
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:6px; text-transform:uppercase;
  }
  .zone-legend{ display:flex; flex-wrap:wrap; gap:10px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:8px; align-items:center; }
  .zone-legend .dot{ width:8px; height:8px; }
  .leaflet-interactive.zone-objectif{ animation: zonepulse 1.6s ease-in-out infinite; }
  @keyframes zonepulse{ 0%,100%{ fill-opacity:0.22; } 50%{ fill-opacity:0.55; } }

  .banner{ font-size:13px; padding:10px 12px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel-2); color:var(--ink-dim); margin-top:12px; }
  .banner.warn{ border-color:var(--danger); color:#f2a89a; }
  .banner.info{ border-color:var(--amber-dim); color:var(--amber); }

  .test-toggle{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  video#scan-video{ width:100%; border-radius:var(--radius); border:1px solid var(--line); background:#000; }
  canvas#scan-canvas{ display:none; }

  footer{ text-align:center; padding-top:20px; }
  footer p{ font-size:11px; letter-spacing:.05em; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>

<script>
(function(){
  "use strict";

  // ---------- Vérification du chargement des librairies externes ----------
  var LIBS_OK = { leaflet: typeof L !== "undefined", qrcode: typeof QRCode !== "undefined", jsqr: typeof jsQR !== "undefined" };

  // Identifiant de joueur stable : sans ça, fermer/rouvrir l'appli (ou juste recharger
  // la page) générait un nouvel identifiant à chaque fois, et rejoindre une partie déjà
  // en cours créait un second point au lieu de mettre à jour le sien. On le garde donc
  // en mémoire locale sur l'appareil (ça ne fonctionne que sur un vrai site comme celui-ci,
  // pas dans l'aperçu intégré à l'app Claude).
  function getOrCreatePlayerId(){
    try{
      var existing = localStorage.getItem("badRecon_playerId");
      if(existing) return existing;
      var fresh = "p-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("badRecon_playerId", fresh);
      return fresh;
    }catch(e){
      return "p-" + Math.random().toString(36).slice(2, 10);
    }
  }

  // ---------- Etat de l'application ----------
  var state = {
    screen: "home",
    playerId: getOrCreatePlayerId(),
    event: null,        // { code, name, teams:[{name,color}], center:{lat,lng}, zoom }
    joinCodeDraft: "",
    player: { name: "", team: null, squad: "" },
    testMode: false,
    squadOnly: false,
    compassAngle: 0,
    rosterSearch: "",
    isOrganizer: false,
    lastCoords: null,   // {lat,lng}
    map: null,
    markers: {},         // playerId -> L.marker
    zonesLayers: {},      // zoneId -> L.polygon (carte en direct)
    pollTimer: null,
    writeTimer: null,
    watchId: null,
    scanStream: null,
    scanRAF: null,
    lastEventErr: "",
    zonesSaveWarning: "",
    // Éditeur de bâtiments
    editorMode: null,     // 'draft' (avant création d'événement) | 'live' (pendant la partie)
    editorZones: [],
    editorCenter: null,
    editorMap: null,
    editorLayers: {},
    drawing: false,
    drawKind: null,       // 'terrain' | 'building'
    placingPoint: false,
    drawPoints: [],
    drawLayer: null,
    editorWatchId: null,
    editorMeMarker: null,
    _draftZones: []
  };

  var TEAM_COLORS = [
    { name: "Rouge",  color: "#e03c31" },
    { name: "Vert",   color: "#3ca55c" },
    { name: "Bleu",   color: "#3b82c4" },
    { name: "Jaune",  color: "#d9a62e" },
    { name: "Noir",   color: "#1c1c1c" },
    { name: "Blanc",  color: "#ece8da" },
    { name: "Violet", color: "#8e5fc9" },
    { name: "Rose",   color: "#e0609c" },
    { name: "Beige",  color: "#c9b896" },
    { name: "Brun",   color: "#6b4226" },
    { name: "Gris",   color: "#8a8d85" },
    { name: "Orange", color: "#d9702e" }
  ];

  var ZONE_STATUSES = [
    { key: "intact",   label: "Intact",   color: "#8b9184" },
    { key: "detruit",  label: "Détruit",  color: "#b3402f" },
    { key: "spawn",    label: "Spawn",    color: "#3ca55c" },
    { key: "objectif", label: "Objectif", color: "#c9a227" }
  ];
  function zoneStatusInfo(key){
    return ZONE_STATUSES.find(function(s){ return s.key === key; }) || ZONE_STATUSES[0];
  }
  function genId(prefix){ return prefix + "-" + Math.random().toString(36).slice(2, 9); }

  var POINT_ICONS = [
    { key: "drapeau", label: "Drapeau", emoji: "🚩", colorable: true, defaultColor: "#c9a227" },
    { key: "cadeau",  label: "Cadeau",  emoji: "🎁", colorable: true, defaultColor: "#8e5fc9" },
    { key: "cible",   label: "Cible prioritaire", emoji: "👑", colorable: true, defaultColor: "#d9a62e" },
    { key: "feu",     label: "Feu (détruit)", emoji: "🔥", colorable: false, defaultColor: "#b3402f" }
  ];
  var FLAG_COLORS = ["#e03c31", "#3ca55c", "#3b82c4", "#d9a62e", "#e8e6d9", "#2b2f22"];
  function pointIconInfo(key){
    return POINT_ICONS.find(function(i){ return i.key === key; }) || POINT_ICONS[0];
  }
  function pointDivIcon(pt){
    var info = pointIconInfo(pt.icon);
    var bg = info.colorable ? (pt.color || info.defaultColor) : info.defaultColor;
    return L.divIcon({
      html: '<div class="marker-badge" style="background:'+bg+';font-size:14px;">'+info.emoji+'</div>',
      className: "", iconSize:[26,26], iconAnchor:[13,13]
    });
  }

  var app = document.getElementById("app");

  // ---------- Backend de stockage partagé (Firebase Realtime Database, via REST) ----------
  // window.storage n'existe que dans l'environnement Claude — sur Netlify (ou tout autre
  // hébergement), il faut une vraie base. On utilise l'API REST de Firebase Realtime Database :
  // pas besoin de charger le SDK Firebase, un simple fetch() suffit.
  // ⚠️ À REMPLACER : colle ici l'URL de ta Realtime Database Firebase (voir instructions).
  var FIREBASE_DB_URL = "https://bad-recon-default-rtdb.europe-west1.firebasedatabase.app";

  function dbConfigured(){ return !!FIREBASE_DB_URL; }

  async function storageGet(key){
    if(!dbConfigured()) return null;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json");
      if(!res.ok) return null;
      var data = await res.json();
      return data; // déjà la chaîne JSON qu'on avait stockée (ou null si absente)
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ return false; }
  }
  async function storageDelete(key){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", { method: "DELETE" });
      return res.ok;
    }catch(e){ return false; }
  }

  function eventConfigKey(code){ return "event:" + code + ":config"; }
  function eventPlayersKey(code){ return "event:" + code + ":players"; }

  async function loadEventConfig(code){
    var raw = await storageGet(eventConfigKey(code));
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  async function saveEventConfig(cfg){
    return storageSet(eventConfigKey(cfg.code), JSON.stringify(cfg));
  }
  async function loadPlayers(code){
    var raw = await storageGet(eventPlayersKey(code));
    if(!raw) return {};
    try{ return JSON.parse(raw); }catch(e){ return {}; }
  }
  async function upsertPlayer(code, playerId, data){
    var players = await loadPlayers(code);
    players[playerId] = Object.assign({}, players[playerId] || {}, data, { ts: Date.now() });
    await storageSet(eventPlayersKey(code), JSON.stringify(players));
  }
  async function deletePlayer(code, playerId){
    var players = await loadPlayers(code);
    delete players[playerId];
    return storageSet(eventPlayersKey(code), JSON.stringify(players));
  }
  async function mergeDuplicatePlayers(code){
    var players = await loadPlayers(code);
    var byName = {};
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      var key = (p.name||"").trim().toLowerCase();
      if(!key) return;
      if(!byName[key]) byName[key] = [];
      byName[key].push({ pid: pid, ts: p.ts||0 });
    });
    var removed = 0;
    Object.keys(byName).forEach(function(key){
      var group = byName[key];
      if(group.length < 2) return;
      group.sort(function(a,b){ return b.ts - a.ts; });
      for(var i=1;i<group.length;i++){ delete players[group[i].pid]; removed++; }
    });
    if(removed) await storageSet(eventPlayersKey(code), JSON.stringify(players));
    return removed;
  }

  function eventZonesKey(code){ return "event:" + code + ":zones"; }
  async function loadZones(code){
    var raw = await storageGet(eventZonesKey(code));
    if(!raw) return [];
    try{ return JSON.parse(raw); }catch(e){ return []; }
  }
  async function saveZones(code, zones){
    return storageSet(eventZonesKey(code), JSON.stringify(zones));
  }

  function mapsIndexKey(){ return "maps:index"; }
  function mapKey(id){ return "map:" + id; }
  async function loadMapsIndex(){
    var raw = await storageGet(mapsIndexKey());
    if(!raw) return [];
    try{ return JSON.parse(raw); }catch(e){ return []; }
  }
  async function loadMapTemplate(id){
    var raw = await storageGet(mapKey(id));
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  async function saveMapTemplate(tpl){
    var ok = await storageSet(mapKey(tpl.id), JSON.stringify(tpl));
    if(!ok) return false;
    var idx = await loadMapsIndex();
    var i = idx.findIndex(function(m){ return m.id === tpl.id; });
    var entry = { id: tpl.id, name: tpl.name, zoneCount: tpl.zones.length, updatedAt: Date.now() };
    if(i >= 0) idx[i] = entry; else idx.push(entry);
    return storageSet(mapsIndexKey(), JSON.stringify(idx));
  }
  async function deleteMapTemplate(id){
    await storageDelete(mapKey(id));
    var idx = await loadMapsIndex();
    var filtered = idx.filter(function(m){ return m.id !== id; });
    return storageSet(mapsIndexKey(), JSON.stringify(filtered));
  }

  // ---------- Rôles & visibilité ----------
  function eventVisibilityKey(code){ return "event:" + code + ":visibility"; }
  async function loadVisibility(code){
    var raw = await storageGet(eventVisibilityKey(code));
    if(!raw) return { revealedTeams: [] };
    try{
      var v = JSON.parse(raw);
      return (v && Array.isArray(v.revealedTeams)) ? v : { revealedTeams: [] };
    }catch(e){ return { revealedTeams: [] }; }
  }
  async function saveVisibility(code, vis){
    return storageSet(eventVisibilityKey(code), JSON.stringify(vis));
  }
  async function setPlayerRole(code, playerId, role){
    var players = await loadPlayers(code);
    if(!players[playerId]) return false;
    players[playerId].role = role;
    return storageSet(eventPlayersKey(code), JSON.stringify(players));
  }
  async function setPlayerInfected(code, playerId, infected){
    var players = await loadPlayers(code);
    if(!players[playerId]) return false;
    players[playerId].infected = infected;
    return storageSet(eventPlayersKey(code), JSON.stringify(players));
  }

  // ---------- Utilitaires ----------
  function genCode(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans 0/O/1/I pour éviter les confusions
    var out = "";
    for(var i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function haversine(a,b){
    if(!a||!b) return null;
    var R=6371000, toRad=Math.PI/180;
    var dLat=(b.lat-a.lat)*toRad, dLng=(b.lng-a.lng)*toRad;
    var la1=a.lat*toRad, la2=b.lat*toRad;
    var h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
    return Math.round(2*R*Math.asin(Math.sqrt(h)));
  }
  function fmtDist(m){
    if(m===null || m===undefined) return "—";
    return m < 1000 ? (m + " m") : ((m/1000).toFixed(1) + " km");
  }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- Rendu ----------
  function render(){
    stopMapIfNeeded();
    if(state.screen === "home") return renderHome();
    if(state.screen === "create") return renderCreate();
    if(state.screen === "join") return renderJoin();
    if(state.screen === "team") return renderTeamPick();
    if(state.screen === "map") return renderMap();
    if(state.screen === "editor") return renderMapEditor();
    if(state.screen === "roles") return renderRoles();
  }

  function stopMapIfNeeded(){
    if(state.screen !== "map" && state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  function renderHome(){
    app.innerHTML =

  // Demande position + caméra en un seul geste (un seul bouton, un seul aller-retour
  // avec le système). Si un accès a déjà été refusé une fois, le navigateur ne
  // réaffichera pas la popup — il faut alors l'autoriser à la main dans ses réglages
  // (on l'explique clairement dans le message d'erreur ci-dessous).
  async function requestAllPermissions(elId){
    var el = document.getElementById(elId);
    if(el) el.innerHTML = '<div class="banner info">Demande des autorisations…</div>';
    var results = { geo: false, cam: false };

    try{
      await new Promise(function(resolve, reject){
        if(!navigator.geolocation){ reject(new Error("non supportée")); return; }
        navigator.geolocation.getCurrentPosition(function(pos){
          state.lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          resolve();
        }, reject, { enableHighAccuracy:true, timeout:10000 });
      });
      results.geo = true;
    }catch(e){ results.geo = false; }

    try{
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      stream.getTracks().forEach(function(t){ t.stop(); });
      results.cam = true;
    }catch(e){ results.cam = false; }

    if(el){
      var needsHelp = !results.geo || !results.cam;
      el.innerHTML =
        '<div class="banner '+(needsHelp?'warn':'info')+'">' +
          '<div>'+(results.geo?'✅':'❌')+' Position '+(results.geo?'autorisée':'refusée ou indisponible')+'</div>' +
          '<div style="margin-top:4px;">'+(results.cam?'✅':'❌')+' Caméra '+(results.cam?'autorisée':'refusée ou indisponible')+'</div>' +
          (needsHelp ? '<p style="margin-top:8px;">Si un accès reste refusé, l\u2019appli ne peut pas le redemander toute seule : touche l\u2019icône 🔒 (ou "i") à côté de l\u2019adresse du site, autorise Position et/ou Caméra, puis recharge la page. Et si tu es dans l\u2019aperçu intégré à l\u2019app Claude, ouvre plutôt le lien publié dans Safari/Chrome.</p>' : '') +
        '</div>';
    }
    return results;
  }

  function renderCreate(){
    if(!state._draftTeams) state._draftTeams = [TEAM_COLORS[0]];
    if(!state._draftName) state._draftName = "";
    if(!state._draftCenter) state._draftCenter = null;
    if(!state._draftZones) state._draftZones = [];

    app.innerHTML =
      '<div class="topbar"><button class="back">‹ Retour</button><div class="eyebrow">Créer</div></div>' +
      '<div class="panel">' +
        '<div class="field"><label>Nom de l\'événement</label>' +
          '<input type="text" id="ev-name" placeholder="Ex. Op\u00e9ration Faucon" value="'+escapeHtml(state._draftName)+'" /></div>' +
        '<div class="field"><label>Position du terrain</label>' +
          '<div class="row">' +
            '<button class="btn btn-sm" id="btn-locate">Utiliser ma position</button>' +
          '</div>' +
          '<p id="center-status">'+(state._draftCenter ? ("Centre défini : "+state._draftCenter.lat.toFixed(5)+", "+state._draftCenter.lng.toFixed(5)) : "Aucune position définie pour l\u2019instant.")+'</p>' +
        '</div>' +
        '<div class="field"><label>Équipes</label>' +
          '<div class="teams" id="teams-list"></div>' +
          '<div class="row" style="margin-top:8px;">' +
            '<button class="btn btn-sm btn-ghost" id="btn-add-team">+ Ajouter une équipe</button>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label>Carte du terrain</label>' +
          '<p style="margin-top:0;">'+(state._draftZones.length ? (state._draftZones.length+" élément(s) défini(s) (limite, bâtiments, points)") : "Rien de défini pour l\u2019instant (optionnel).")+'</p>' +
          (state._draftCenter
            ? '<button class="btn btn-sm btn-ghost" id="btn-edit-buildings" style="margin-top:8px;">Délimiter / dessiner / charger une carte</button>'
            : '<p style="margin-top:8px;font-size:12px;">Définis d\u2019abord la position du terrain ci-dessus.</p>') +
        '</div>' +
      '</div>' +
      '<div class="stack" style="margin-top:16px;">' +
        '<button class="btn btn-primary" id="btn-generate">Générer le code et le QR</button>' +
      '</div>' +
      (state.lastEventErr ? '<div class="banner warn">'+escapeHtml(state.lastEventErr)+'</div>' : '');

    document.querySelector(".back").onclick = function(){ state.screen="home"; render(); };

    function drawTeams(){
      var wrap = document.getElementById("teams-list");
      wrap.innerHTML = state._draftTeams.map(function(t, i){
        return '<span class="team-chip" style="color:'+t.color+'"><span class="dot" style="background:'+t.color+'"></span>'+escapeHtml(t.name)+
          (state._draftTeams.length>1 ? '<button class="remove-chip" data-i="'+i+'">✕</button>' : '')+'</span>';
      }).join("");
      Array.prototype.forEach.call(wrap.querySelectorAll(".remove-chip"), function(btn){
        btn.onclick = function(){ state._draftTeams.splice(+btn.dataset.i,1); drawTeams(); };
      });
    }
    drawTeams();

    document.getElementById("btn-add-team").onclick = function(){
      var used = state._draftTeams.map(function(t){return t.name;});
      var next = TEAM_COLORS.find(function(t){ return used.indexOf(t.name) === -1; });
      if(!next){
        var idx = state._draftTeams.length+1;
        next = { name: "Équipe "+idx, color: "#9b59b6" };
      }
      state._draftTeams.push(next);
      drawTeams();
    };

    document.getElementById("ev-name").oninput = function(e){ state._draftName = e.target.value; };

    if(state._draftCenter){
      document.getElementById("btn-edit-buildings").onclick = function(){
        state.editorMode = "draft";
        state.editorZones = state._draftZones.slice();
        state.editorCenter = state._draftCenter;
        state.screen = "editor";
        render();
      };
    }

    document.getElementById("btn-locate").onclick = function(){
      var btn = document.getElementById("btn-locate");
      btn.disabled = true; btn.textContent = "Localisation…";
      if(!navigator.geolocation){
        state.lastEventErr = "La géolocalisation n'est pas disponible sur ce navigateur.";
        render(); return;
      }
      navigator.geolocation.getCurrentPosition(function(pos){
        state._draftCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        state.lastEventErr = "";
        render();
      }, function(err){
        state.lastEventErr = "Position indisponible (" + err.message + "). Autorise la géolocalisation ou réessaie plus près du terrain.";
        render();
      }, { enableHighAccuracy:true, timeout:10000 });
    };

    document.getElementById("btn-generate").onclick = async function(){
      if(!state._draftName.trim()){ state.lastEventErr = "Donne un nom à l'événement."; render(); return; }
      if(!state._draftCenter){ state.lastEventErr = "Définis la position du terrain."; render(); return; }
      if(state._draftTeams.length < 1){ state.lastEventErr = "Ajoute au moins une équipe."; render(); return; }
      var code = genCode();
      var cfg = {
        code: code,
        name: state._draftName.trim(),
        teams: state._draftTeams,
        center: state._draftCenter,
        zoom: 17,
        createdAt: Date.now()
      };
      var ok = await saveEventConfig(cfg);
      if(!ok){ state.lastEventErr = "Impossible de créer l'événement pour l'instant. Réessaie."; render(); return; }
      state.event = cfg;
      state.isOrganizer = true;
      state.lastEventErr = "";

  function startScan(){
    var zone = document.getElementById("scan-zone");
    zone.innerHTML = '<video id="scan-video" playsinline autoplay muted></video><canvas id="scan-canvas"></canvas><p>Vise le QR code de l\u2019organisateur.</p>';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream){
      state.scanStream = stream;
      var video = document.getElementById("scan-video");
      video.srcObject = stream;
      var canvas = document.getElementById("scan-canvas");
      var ctx = canvas.getContext("2d");
      function tick(){
        if(video.readyState === video.HAVE_ENOUGH_DATA){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var code = jsQR(img.data, img.width, img.height);
          if(code && code.data){
            state.joinCodeDraft = code.data.trim().toUpperCase();
            stopScan();
            render();
            return;
          }
        }
        state.scanRAF = requestAnimationFrame(tick);
      }
      state.scanRAF = requestAnimationFrame(tick);
    }).catch(function(err){
      zone.innerHTML = '<div class="banner warn">Caméra indisponible (' + err.message + '). Entre le code manuellement ci-dessus.</div>';
    });
  }
  function stopScan(){
    if(state.scanRAF) cancelAnimationFrame(state.scanRAF);
    if(state.scanStream) state.scanStream.getTracks().forEach(function(t){ t.stop(); });
    state.scanRAF = null; state.scanStream = null;
  }

  function startEditorGeoWatch(){
    if(!navigator.geolocation) return;
    if(state.editorWatchId !== null) return;

      state.lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      var el = document.getElementById("editor-geo-status");
      if(el) el.textContent = "Position GPS active — précision ~" + Math.round(pos.coords.accuracy) + " m";
      if(state.editorMap){
        if(state.editorMeMarker){
          state.editorMeMarker.setLatLng([state.lastCoords.lat, state.lastCoords.lng]);
        } else {
          state.editorMeMarker = L.circleMarker([state.lastCoords.lat, state.lastCoords.lng], {
            radius:7, color:"#c9a227", weight:2, fillColor:"#c9a227", fillOpacity:0.5
          }).addTo(state.editorMap).bindTooltip("Toi");
        }
      }
    }, function(err){
      var el = document.getElementById("editor-geo-status");
      if(el) el.textContent = "Position GPS indisponible (" + err.message + ") — tu peux quand même placer les points en touchant la carte.";
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }

  function stopEditorGeoWatch(){
    if(state.editorWatchId !== null && navigator.geolocation){
      navigator.geolocation.clearWatch(state.editorWatchId);
      state.editorWatchId = null;
    }
    state.editorMeMarker = null;
  }

  async function persistEditorZones(){
    if(state.editorMode === "live" && state.event){

  // Calcule l'apparence de la zone de guerre selon le temps restant avant fermeture.
  function warzoneStyle(z){
    var remaining = (z.deactivateAt||0) - Date.now();
    if(remaining > 0){
      var label = remaining >= 60000 ? ("Ferme dans " + Math.ceil(remaining/60000) + " min") : ("Ferme dans " + Math.max(1, Math.ceil(remaining/1000)) + " s");
      return { color:'#d9702e', weight:2, dashArray:'4,4', fillOpacity:0.10, active:false, label: label };
    }
    return { color:'#b3402f', weight:2, dashArray:null, fillOpacity:0.35, active:true, label: "ZONE INTERDITE" };
  }

  function addZoneLayer(map, z){
    var layer;
    if(z.kind === "point"){
      layer = L.marker(z.latlng, { icon: pointDivIcon(z) }).addTo(map).bindTooltip(escapeHtml(z.name));
    } else if(z.kind === "terrain"){
      layer = L.polygon(z.points, { color:'#c9a227', weight:2, dashArray:'6,6', fillOpacity:0.04 })
        .addTo(map).bindTooltip(escapeHtml(z.name || "Limite du terrain"));
    } else if(z.kind === "guerre"){
      var wz = warzoneStyle(z);
      layer = L.polygon(z.points, {
        color: wz.color, weight: wz.weight, fillColor: wz.color, fillOpacity: wz.fillOpacity,
        dashArray: wz.dashArray, className: wz.active ? 'zone-objectif' : ''
      }).addTo(map).bindTooltip(escapeHtml(z.name) + ' · ' + wz.label);
    } else {
      var info = zoneStatusInfo(z.status);
      layer = L.polygon(z.points, {
        color: info.color, weight:2, fillColor: info.color, fillOpacity:0.28,
        className: z.status === 'objectif' ? 'zone-objectif' : ''
      }).addTo(map).bindTooltip(escapeHtml(z.name) + ' · ' + info.label);
    }
    return layer;
  }

  function vertexHandleIcon(){
    return L.divIcon({
      html: '<div style="width:14px;height:14px;border-radius:50%;background:#e8e6d9;border:2px solid #14170f;box-shadow:0 1px 3px rgba(0,0,0,.6);"></div>',
      className: "", iconSize:[14,14], iconAnchor:[7,7]
    });
  }

  // Version éditable réservée à l'éditeur : sommets et points déplaçables au doigt,
  // pour corriger la taille/position d'un tracé après coup (jamais utilisée sur la carte en direct des joueurs).
  function addEditableZoneLayer(map, z){
    if(z.kind === "point"){
      var marker = L.marker(z.latlng, { icon: pointDivIcon(z), draggable: true }).addTo(map).bindTooltip(escapeHtml(z.name));
      marker.on('dragend', async function(e){
        var ll = e.target.getLatLng();
        z.latlng = [ll.lat, ll.lng];
        await persistEditorZones();
      });
      return [marker];
    }

    var isTerrain = z.kind === "terrain";
    var isWarzone = z.kind === "guerre";
    var style;
    if(isTerrain){ style = { color:'#c9a227', weight:2, dashArray:'6,6', fillOpacity:0.04 }; }
    else if(isWarzone){ var wz = warzoneStyle(z); style = { color: wz.color, weight: wz.weight, fillColor: wz.color, fillOpacity: wz.fillOpacity, dashArray: wz.dashArray }; }
    else{ var info = zoneStatusInfo(z.status); style = { color: info.color, weight:2, fillColor: info.color, fillOpacity:0.28 }; }
    var tooltipTxt = isTerrain ? (z.name || "Limite du terrain") : (isWarzone ? (z.name + ' · ' + warzoneStyle(z).label) : z.name);
    var poly = L.polygon(z.points, style).addTo(map).bindTooltip(escapeHtml(tooltipTxt));
    var layers = [poly];

    z.points.forEach(function(pt, idx){
      var handle = L.marker(pt, { icon: vertexHandleIcon(), draggable: true }).addTo(map);
      handle.on('drag', function(e){
        var ll = e.target.getLatLng();
        z.points[idx] = [ll.lat, ll.lng];
        poly.setLatLngs(z.points);
      });
      handle.on('dragend', async function(){ await persistEditorZones(); });
      layers.push(handle);
    });

    return layers;
  }

  function orderedZones(zones){
    // la limite de terrain d'abord (dessous), puis les zones de guerre, puis les bâtiments, puis les points (dessus)
    return zones.filter(function(z){ return z.kind === "terrain"; })
      .concat(zones.filter(function(z){ return z.kind === "guerre"; }))
      .concat(zones.filter(function(z){ return z.kind === "building" || !z.kind; }))
      .concat(zones.filter(function(z){ return z.kind === "point"; }));
  }

  function drawExistingZones(){
    if(!state.editorMap) return;
    Object.keys(state.editorLayers).forEach(function(id){
      var layers = state.editorLayers[id] || [];
      layers.forEach(function(l){ state.editorMap.removeLayer(l); });
    });
    state.editorLayers = {};
    orderedZones(state.editorZones).forEach(function(z){
      if(!isValidZone(z)) return;
      try{
        state.editorLayers[z.id] = addEditableZoneLayer(state.editorMap, z);
      }catch(e){ /* une zone corrompue ne doit pas empêcher l'affichage des autres */ }
    });
  }

  function updateDrawPreview(){
    if(!state.editorMap) return;
    if(state.drawLayer){ state.editorMap.removeLayer(state.drawLayer); state.drawLayer = null; }
    if(state.drawPoints.length){
      var color = state.drawKind === "terrain" ? "#c9a227" : "#3b82c4";
      state.drawLayer = L.polygon(state.drawPoints, { color:color, dashArray:'4,4', weight:2, fillOpacity:0.12 }).addTo(state.editorMap);
    }
  }

        '</div>' +
        '<div class="row" style="margin-top:6px;">' +

        '</div>';
      document.getElementById("btn-start-terrain").onclick = function(){ state.drawing = true; state.drawKind = "terrain"; state.drawPoints = []; drawToolbar(); };
      document.getElementById("btn-start-draw").onclick = function(){ state.drawing = true; state.drawKind = "building"; state.drawPoints = []; drawToolbar(); };
      document.getElementById("btn-start-point").onclick = function(){ state.placingPoint = true; drawToolbar(); };
      document.getElementById("btn-start-warzone").onclick = function(){ state.drawing = true; state.drawKind = "guerre"; state.drawPoints = []; drawToolbar(); };
      return;
    }

    var label = state.drawKind === "terrain" ? "coin de la limite du terrain" : (state.drawKind === "guerre" ? "coin de la zone de guerre" : "coin du bâtiment");
    el.innerHTML =
      '<span class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Points placés : '+state.drawPoints.length+' (min. 3)</span>' +
      '<div class="row" style="margin-top:6px;">' +
        '<button class="btn btn-sm btn-primary" id="btn-finish-draw"'+(state.drawPoints.length<3?' disabled':'')+'>Terminer</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-cancel-draw">Annuler</button>' +
      '</div>' +
      (state.lastCoords ? '<button class="btn btn-sm btn-ghost" id="btn-gps-vertex" style="margin-top:6px;">📍 Ajouter ma position GPS ici</button>' : '') +
      '<p style="margin-top:6px;">Touche la carte pour placer chaque '+label+', ou déplace-toi sur place et utilise ta position GPS.</p>';
    if(state.drawPoints.length>=3){
      document.getElementById("btn-finish-draw").onclick = finishDrawing;
    }
    var gpsVertexBtn = document.getElementById("btn-gps-vertex");
    if(gpsVertexBtn) gpsVertexBtn.onclick = function(){
      state.drawPoints.push([state.lastCoords.lat, state.lastCoords.lng]);
      if(state.editorMap) state.editorMap.panTo([state.lastCoords.lat, state.lastCoords.lng]);
      updateDrawPreview();
      drawToolbar();
    };
    document.getElementById("btn-cancel-draw").onclick = function(){
      state.drawing = false; state.drawPoints = []; state.drawKind = null;
      updateDrawPreview();
      drawToolbar();
    };
  }

  function finishDrawing(){
    if(state.drawPoints.length < 3) return;
    var isTerrain = state.drawKind === "terrain";
    var isWarzone = state.drawKind === "guerre";
    var el = document.getElementById("editor-toolbar");
    el.innerHTML =
      (isTerrain ? '' : '<div class="field" style="margin-top:0;"><label>Nom '+(isWarzone?'de la zone':'du bâtiment')+' (optionnel)</label><input type="text" id="zone-name" placeholder="'+(isWarzone?'Ex. Secteur Nord':'Ex. Hangar Nord')+'" /></div>') +
      (isWarzone ? '<div class="field"><label>Devient interdite dans (minutes)</label><input type="number" id="zone-minutes" value="5" min="1" style="text-align:left;" /></div>' : '') +
      '<div class="row" style="margin-top:8px;">' +
        '<button class="btn btn-sm btn-primary" id="btn-confirm-zone">'+(isTerrain ? 'Valider la limite' : 'Ajouter')+'</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-cancel-draw2">Annuler</button>' +
      '</div>';
    var nameInput = document.getElementById("zone-name");
    if(nameInput) nameInput.focus();
    document.getElementById("btn-cancel-draw2").onclick = function(){
      state.drawing = false; state.drawPoints = []; state.drawKind = null;
      updateDrawPreview();
      drawToolbar();
    };
    document.getElementById("btn-confirm-zone").onclick = async function(){
      if(isTerrain){
        state.editorZones = state.editorZones.filter(function(z){ return z.kind !== "terrain"; });
        state.editorZones.unshift({ id: genId("t"), kind: "terrain", name: "Limite du terrain", points: state.drawPoints.slice() });
      } else if(isWarzone){
        var name2 = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Zone de guerre";
        var minutesInput = document.getElementById("zone-minutes");
        var minutes = Math.max(1, parseInt(minutesInput && minutesInput.value, 10) || 5);
        state.editorZones.push({ id: genId("w"), kind: "guerre", name: name2, points: state.drawPoints.slice(), deactivateAt: Date.now() + minutes*60000 });
      } else {
        var name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : "Bâtiment";
        state.editorZones.push({ id: genId("z"), kind: "building", name: name, points: state.drawPoints.slice(), status: "intact" });
      }
      state.drawing = false; state.drawPoints = []; state.drawKind = null;
      updateDrawPreview();
      drawExistingZones();
      drawToolbar();
      drawZoneList();
      await persistEditorZones();
    };
  }

  function openPointForm(latlng, existing){
    state.placingPoint = false;
    var el = document.getElementById("editor-toolbar");
    var chosenIcon = existing ? existing.icon : "drapeau";
    var chosenColor = (existing && existing.color) ? existing.color : FLAG_COLORS[0];

    function paint(){
      el.innerHTML =
        '<div class="field" style="margin-top:0;"><label>Type de point</label>' +
          '<div class="row">' +
            POINT_ICONS.map(function(ic){
              return '<button class="btn btn-sm '+(ic.key===chosenIcon?'btn-primary':'btn-ghost')+'" data-icon="'+ic.key+'">'+ic.emoji+' '+ic.label+'</button>';
            }).join("") +
          '</div>' +
        '</div>' +
        (pointIconInfo(chosenIcon).colorable ?
          '<div class="field"><label>Couleur</label><div class="teams" id="flag-colors">' +
            FLAG_COLORS.map(function(c){ return '<button class="team-chip'+(c===chosenColor?' selected':'')+'" data-color="'+c+'" style="color:'+c+'"><span class="dot" style="background:'+c+'"></span></button>'; }).join("") +
          '</div></div>' : '') +
        '<div class="field"><label>Nom (optionnel)</label><input type="text" id="point-name" placeholder="Ex. Objectif Nord" value="'+escapeHtml(existing?existing.name:"")+'" /></div>' +
        '<div class="row" style="margin-top:8px;">' +
          '<button class="btn btn-sm btn-primary" id="btn-confirm-point">'+(existing?'Enregistrer':'Ajouter')+'</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-cancel-point2">Annuler</button>' +
        '</div>';

      Array.prototype.forEach.call(el.querySelectorAll("[data-icon]"), function(b){
        b.onclick = function(){ chosenIcon = b.dataset.icon; paint(); };
      });
      var colorWrap = document.getElementById("flag-colors");
      if(colorWrap){
        Array.prototype.forEach.call(colorWrap.querySelectorAll("[data-color]"), function(b){
          b.onclick = function(){ chosenColor = b.dataset.color; paint(); };
        });
      }
      document.getElementById("btn-cancel-point2").onclick = function(){ drawToolbar(); };
      document.getElementById("btn-confirm-point").onclick = async function(){
        var name = document.getElementById("point-name").value.trim() || (pointIconInfo(chosenIcon).label);
        var colorable = pointIconInfo(chosenIcon).colorable;
        if(existing){
          existing.name = name;
          existing.icon = chosenIcon;
          existing.color = colorable ? chosenColor : null;
        } else {
          var pt = { id: genId("pt"), kind: "point", name: name, latlng: latlng, icon: chosenIcon, color: colorable ? chosenColor : null };
          state.editorZones.push(pt);
        }
        drawExistingZones();
        drawZoneList();
        drawToolbar();
        await persistEditorZones();
      };
    }
    paint();
  }

  function drawZoneList(){
    var wrap = document.getElementById("zone-list");
    if(!wrap) return;
    if(!state.editorZones.length){
      wrap.innerHTML = '<p>Rien de défini pour l\u2019instant : limite du terrain, bâtiments ou points.</p>';
      return;
    }
    wrap.innerHTML = orderedZones(state.editorZones).map(function(z){
      if(z.kind === "point"){
        var ic = POINT_ICONS.find(function(i){ return i.key === z.icon; }) || POINT_ICONS[0];
        return '<div class="zone-row">' +
          '<span style="font-size:15px;">'+ic.emoji+'</span>' +
          '<span class="name">'+escapeHtml(z.name)+'</span>' +
          '<button class="btn btn-sm btn-ghost point-edit" data-id="'+z.id+'" style="padding:6px 10px;">Modifier</button>' +
          '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
        '</div>';
      }
      if(z.kind === "terrain"){
        return '<div class="zone-row">' +
          '<span class="dot" style="background:#c9a227"></span>' +
          '<span class="name">'+escapeHtml(z.name || "Limite du terrain")+'</span>' +
          '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
        '</div>';
      }
      if(z.kind === "guerre"){
        var wz = warzoneStyle(z);
        return '<div class="zone-row">' +
          '<span class="dot" style="background:'+wz.color+'"></span>' +
          '<span class="name">'+escapeHtml(z.name)+' <span class="mono" style="font-size:10px;color:var(--ink-dim);">· '+wz.label+'</span></span>' +
          (wz.active ? '' : '<button class="btn btn-sm btn-ghost warzone-now" data-id="'+z.id+'" style="padding:6px 10px;">Fermer maintenant</button>') +
          '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
        '</div>';
      }
      var info = zoneStatusInfo(z.status);
      return '<div class="zone-row">' +
        '<span class="dot" style="background:'+info.color+'"></span>' +
        '<span class="name">'+escapeHtml(z.name)+'</span>' +
        '<select class="zone-status" data-id="'+z.id+'">' +
          ZONE_STATUSES.map(function(s){ return '<option value="'+s.key+'"'+(s.key===z.status?' selected':'')+'>'+s.label+'</option>'; }).join("") +
        '</select>' +
        '<button class="remove-chip zone-del" data-id="'+z.id+'">✕</button>' +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(wrap.querySelectorAll(".point-edit"), function(btn){
      btn.onclick = function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z) openPointForm(z.latlng, z);
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".zone-status"), function(sel){
      sel.onchange = async function(){
        var z = state.editorZones.find(function(z){ return z.id === sel.dataset.id; });
        if(z){ z.status = sel.value; drawExistingZones(); drawZoneList(); await persistEditorZones(); }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".warzone-now"), function(btn){
      btn.onclick = async function(){
        var z = state.editorZones.find(function(z){ return z.id === btn.dataset.id; });
        if(z){ z.deactivateAt = Date.now(); drawExistingZones(); drawZoneList(); await persistEditorZones(); }
      };
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".zone-del"), function(btn){
      btn.onclick = async function(){
        state.editorZones = state.editorZones.filter(function(z){ return z.id !== btn.dataset.id; });
        drawExistingZones(); drawZoneList();
        await persistEditorZones();
      };
    });
  }

  function openMapPicker(){
    var el = document.getElementById("editor-banner");
    el.innerHTML = '<div class="banner info">Chargement des cartes…</div>';
    loadMapsIndex().then(function(list){
      if(!list.length){
        el.innerHTML = '<div class="banner">Aucune carte enregistrée pour l\u2019instant.</div>';
        return;
      }
      el.innerHTML = '<div class="panel" style="margin-top:10px;">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Cartes enregistrées</label>' +
        '<div class="zone-list">' +
        list.map(function(m){
          return '<div class="zone-row" data-mapid="'+m.id+'">' +
            '<span class="name" style="cursor:pointer;">'+escapeHtml(m.name)+'</span>' +
            '<span class="dist">'+m.zoneCount+' élém.</span>' +
            '<button class="remove-chip map-del" data-mapid="'+m.id+'" data-name="'+escapeHtml(m.name)+'">✕</button>' +
          '</div>';
        }).join("") +
        '</div></div>';
      Array.prototype.forEach.call(el.querySelectorAll(".zone-row[data-mapid]"), function(row){
        row.onclick = async function(){
          var tpl = await loadMapTemplate(row.dataset.mapid);
          if(!tpl){ el.innerHTML = '<div class="banner warn">Impossible de charger cette carte.</div>'; return; }
          state.editorZones = tpl.zones.map(function(z){
            if(z.kind === "point"){ return { id: genId("pt"), kind:"point", name:z.name, latlng:z.latlng, icon:z.icon, color:z.color }; }
            return { id: genId("z"), kind: z.kind || "building", name: z.name, points: z.points, status: "intact" };
          });
          drawExistingZones(); drawZoneList();
          el.innerHTML = '<div class="banner info">Carte « '+escapeHtml(tpl.name)+' » chargée.</div>';
          await persistEditorZones();
        };
      });
      Array.prototype.forEach.call(el.querySelectorAll(".map-del"), function(btn){
        btn.onclick = async function(e){
          e.stopPropagation();
          if(!confirm("Supprimer la carte « "+btn.dataset.name+" » ? Cette action est irréversible.")) return;
          await deleteMapTemplate(btn.dataset.mapid);
          openMapPicker();
        };
      });
    });
  }

  function saveCurrentAsTemplate(){
    var el = document.getElementById("editor-banner");
    if(!state.editorZones.length){
      el.innerHTML = '<div class="banner warn">Ajoute au moins un élément avant d\u2019enregistrer.</div>';
      return;
    }
    el.innerHTML =
      '<div class="panel" style="margin-top:10px;"><div class="field" style="margin-top:0;"><label>Nom de la carte</label>' +
      '<input type="text" id="map-name" placeholder="Ex. Terrain de la Ferme" /></div>' +
      '<div class="row" style="margin-top:8px;"><button class="btn btn-sm btn-primary" id="btn-confirm-save-map">Enregistrer</button></div></div>';
    var input = document.getElementById("map-name");
    input.focus();
    document.getElementById("btn-confirm-save-map").onclick = async function(){
      var name = input.value.trim();
      if(!name) return;
      var tpl = { id: genId("map"), name: name, zones: state.editorZones.filter(function(z){ return z.kind !== "guerre"; }).map(function(z){
        if(z.kind === "point"){ return { kind:"point", name:z.name, latlng:z.latlng, icon:z.icon, color:z.color }; }
        return { kind: z.kind || "building", name: z.name, points: z.points };
      }) };
      var ok = await saveMapTemplate(tpl);
      el.innerHTML = ok
        ? '<div class="banner info">Carte « '+escapeHtml(name)+' » enregistrée — réutilisable pour tes prochains événements.</div>'
        : '<div class="banner warn">Échec de l\u2019enregistrement. Réessaie.</div>';
    };
  }

  function teardownEditorMap(){
    state.drawing = false; state.drawPoints = []; state.drawLayer = null; state.drawKind = null; state.placingPoint = false;
    stopEditorGeoWatch();
    if(state.editorMap){ state.editorMap.remove(); state.editorMap = null; }
    state.editorLayers = {};
  }

  // ---------- Écran Rôles & visibilité (organisateur) ----------
  function renderRoles(){
    var cfg = state.event;
    app.innerHTML =
      '<div class="topbar"><button class="back">‹ Retour</button><div class="eyebrow">Rôles & visibilité</div></div>' +
      '<div class="panel">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Équipes — vision totale débloquée</label>' +
        '<p style="margin-top:4px;">Active pour qu\u2019une équipe voie temporairement toutes les autres (ex. récompense en jeu).</p>' +
        '<div id="teams-visibility" class="stack" style="margin-top:8px;"></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:14px;">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Staff — voit toujours toutes les équipes</label>' +
        '<div id="staff-list" style="margin-top:8px;"></div>' +
        '<div class="row" style="margin-top:10px;">' +
          '<button class="btn btn-sm btn-ghost" id="btn-refresh-roles">Rafraîchir la liste</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-merge-dupes">Fusionner les doublons (même nom)</button>' +
        '</div>' +
        '<div id="roles-banner"></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:14px;">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Administrateur</label>' +
        '<p style="margin-top:4px;">Transfère tous tes droits (édition de carte, rôles) à un membre du staff. Tu deviendras toi-même staff.</p>' +
        '<div id="admin-transfer" style="margin-top:8px;"></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:14px;">' +
        '<label class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">🧟 Mode zombie</label>' +
        '<p style="margin-top:4px;">Désigne un ou plusieurs joueurs comme zombies — leur point affiche 🧟 au lieu de leurs initiales.</p>' +
        '<div id="zombie-list" style="margin-top:8px;"></div>' +
      '</div>';

    document.querySelector(".back").onclick = function(){ state.screen = "map"; render(); };
    document.getElementById("btn-refresh-roles").onclick = loadRolesData;
    document.getElementById("btn-merge-dupes").onclick = async function(){
      if(!confirm("Fusionner les joueurs ayant le même nom ? Ne garde que l\u2019entrée la plus récente de chacun, supprime les autres.")) return;
      var n = await mergeDuplicatePlayers(cfg.code);
      document.getElementById("roles-banner").innerHTML =
        '<div class="banner info">'+(n ? (n+" doublon(s) supprimé(s).") : "Aucun doublon trouvé.")+'</div>';
      loadRolesData();
    };
    loadRolesData();

    async function loadRolesData(){
      var teamsEl = document.getElementById("teams-visibility");
      var staffEl = document.getElementById("staff-list");
      var transferEl = document.getElementById("admin-transfer");
      var zombieEl = document.getElementById("zombie-list");
      teamsEl.innerHTML = '<p class="mono" style="font-size:11px;color:var(--ink-dim);">Chargement…</p>';
      staffEl.innerHTML = "";
      transferEl.innerHTML = "";
      zombieEl.innerHTML = "";

      var players = await loadPlayers(cfg.code);
      var vis = await loadVisibility(cfg.code);

      teamsEl.innerHTML = cfg.teams.map(function(t){
        var on = vis.revealedTeams.indexOf(t.name) !== -1;
        return '<div class="test-toggle"><span style="color:'+t.color+'">● '+escapeHtml(t.name)+'</span>' +
          '<input type="checkbox" class="team-vis-toggle" data-team="'+escapeHtml(t.name)+'" '+(on?'checked':'')+' /></div>';
      }).join("");
      Array.prototype.forEach.call(teamsEl.querySelectorAll(".team-vis-toggle"), function(cb){
        cb.onchange = async function(){
          var team = cb.dataset.team;
          var idx = vis.revealedTeams.indexOf(team);
          if(cb.checked && idx === -1) vis.revealedTeams.push(team);
          if(!cb.checked && idx !== -1) vis.revealedTeams.splice(idx, 1);
          await saveVisibility(cfg.code, vis);
        };
      });

      var pids = Object.keys(players);
      if(!pids.length){
        staffEl.innerHTML = '<p>Aucun joueur n\u2019a encore rejoint.</p>';
        transferEl.innerHTML = '<p>Aucun joueur n\u2019a encore rejoint.</p>';
        return;
      }
      staffEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        var isStaff = p.role === "staff";
        return '<div class="test-toggle"><span>'+escapeHtml(p.name||"?")+
          '<span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<span class="row" style="gap:8px;">' +
            '<input type="checkbox" class="staff-toggle" data-pid="'+pid+'" '+(isStaff?'checked':'')+' />' +
            '<button class="remove-chip player-del" data-pid="'+pid+'" data-name="'+escapeHtml(p.name||"?")+'">✕</button>' +
          '</span></div>';
      }).join("");
      Array.prototype.forEach.call(staffEl.querySelectorAll(".staff-toggle"), function(cb){
        cb.onchange = async function(){
          await setPlayerRole(cfg.code, cb.dataset.pid, cb.checked ? "staff" : "");
        };
      });
      Array.prototype.forEach.call(staffEl.querySelectorAll(".player-del"), function(btn){
        btn.onclick = async function(){
          if(!confirm("Retirer "+btn.dataset.name+" de la partie ? (Si son téléphone est encore actif, il peut réapparaître.)")) return;
          await deletePlayer(cfg.code, btn.dataset.pid);
          loadRolesData();
        };
      });

      var staffPids = pids.filter(function(pid){ return players[pid].role === "staff" && pid !== state.playerId; });
      if(!staffPids.length){
        transferEl.innerHTML = '<p>Désigne d\u2019abord un membre du staff ci-dessus pour pouvoir lui transférer l\u2019administration.</p>';
      } else {
        transferEl.innerHTML = staffPids.map(function(pid){
          return '<div class="zone-row"><span class="name">'+escapeHtml(players[pid].name||"?")+'</span>' +
            '<button class="btn btn-sm btn-ghost transfer-admin" data-pid="'+pid+'">Nommer admin</button></div>';
        }).join("");
        Array.prototype.forEach.call(transferEl.querySelectorAll(".transfer-admin"), function(btn){
          btn.onclick = async function(){
            if(!confirm("Transférer l\u2019administration à "+(players[btn.dataset.pid].name||"ce joueur")+" ? Tu deviendras staff à la place.")) return;
            vis.adminId = btn.dataset.pid;
            await saveVisibility(cfg.code, vis);
            await setPlayerRole(cfg.code, state.playerId, "staff");
            state.isOrganizer = false;
            state.screen = "map";
            render();
          };
        });
      }

      zombieEl.innerHTML = pids.map(function(pid){
        var p = players[pid];
        return '<div class="test-toggle"><span>'+escapeHtml(p.name||"?")+
          '<span class="mono" style="font-size:10px;color:var(--ink-dim);"> · '+escapeHtml(p.team||"—")+'</span></span>' +
          '<input type="checkbox" class="zombie-toggle" data-pid="'+pid+'" '+(p.infected?'checked':'')+' /></div>';
      }).join("");
      Array.prototype.forEach.call(zombieEl.querySelectorAll(".zombie-toggle"), function(cb){
        cb.onchange = async function(){
          await setPlayerInfected(cfg.code, cb.dataset.pid, cb.checked);
        };
      });
    }
  }

      btn.textContent = state.player.sos ? "🆘 Annuler la demande d\u2019aide" : "🆘 Demander de l\u2019aide";
      if(state.event && state.player.name){
        await upsertPlayer(state.event.code, state.playerId, { sos: state.player.sos });
      }
    };

    if(!LIBS_OK.leaflet){
      document.getElementById("map").outerHTML = '<div class="banner warn">La carte n\'a pas pu se charger (librairie indisponible). Vérifie ta connexion.</div>';
      return;
    }

    var map = L.map('map', { zoomControl: true }).setView([cfg.center.lat, cfg.center.lng], cfg.zoom || 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    state.map = map;
    map.on('zoomend', applyLabelZoomVisibility);
    applyLabelZoomVisibility();

    map.on('click', function(e){
      if(!state.testMode) return;
      state.lastCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      setStatus(true, "Position définie (mode test)");
      writePositionNow();
    });

    applyGeoMode();

    // Écrit la position toutes les 4s (throttle), et rafraîchit joueurs + bâtiments toutes les 4s
    state.writeTimer = setInterval(writePositionNow, 4000);
    state.pollTimer = setInterval(function(){ refreshPlayers(); refreshZones(); }, 4000);
    refreshPlayers();
    refreshZones();
  }

  // ---------- Rotation manuelle de la carte (cadran à glisser, façon Google Maps) ----------
  // Le capteur boussole des téléphones s'est révélé trop peu fiable (saccades, valeurs
  // erratiques) — on laisse maintenant le joueur orienter la carte lui-même au doigt,
  // ce qui est stable partout, sans dépendre du matériel.
  function applyCompassRotation(){
    var mapEl = document.getElementById("map");
    if(mapEl) mapEl.style.transform = "rotate(" + (-state.compassAngle) + "deg)";
    document.documentElement.style.setProperty("--compass-angle", state.compassAngle + "deg");
  }

  function setupCompassDial(){
    var dial = document.getElementById("compass-dial");
    if(!dial) return;
    var dragging = false;

    function angleFromPoint(clientX, clientY){
      var rect = dial.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      var dx = clientX - cx, dy = clientY - cy;
      var deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      return (deg + 360) % 360;
    }

    dial.addEventListener("pointerdown", function(e){
      dragging = true;
      try{ dial.setPointerCapture(e.pointerId); }catch(err){}
      state.compassAngle = angleFromPoint(e.clientX, e.clientY);
      applyCompassRotation();
    });
    dial.addEventListener("pointermove", function(e){
      if(!dragging) return;
      state.compassAngle = angleFromPoint(e.clientX, e.clientY);
      applyCompassRotation();
    });
    dial.addEventListener("pointerup", function(){ dragging = false; });
    dial.addEventListener("pointercancel", function(){ dragging = false; });
  }

  // Bascule proprement entre géolocalisation réelle et mode test : l'une des
  // deux tourne à la fois, jamais les deux en même temps (c'est ce qui causait
  // le faux message "position indisponible" même quand on cliquait sur la carte).
  function applyGeoMode(){
    if(state.watchId !== null && navigator.geolocation){
      navigator.geolocation.clearWatch(state.watchId);
      state.watchId = null;
    }
    var banner = document.getElementById("geo-banner");
    if(banner) banner.innerHTML = "";

    if(state.testMode){
      setStatus(!!state.lastCoords, state.lastCoords ? "Position définie (mode test)" : "Mode test — touche la carte pour définir ta position");
      return;
    }

    if(!navigator.geolocation){
      setStatus(false, "Géolocalisation non supportée");
      return;
    }
    setStatus(false, "Recherche de la position…");
    state.watchId = navigator.geolocation.watchPosition(function(pos){
      state.lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      setStatus(true, "Position active");
    }, function(err){
      setStatus(false, "Position indisponible");
      if(banner){
        banner.innerHTML = '<div class="banner warn">Géolocalisation refusée ou indisponible (' + escapeHtml(err.message) + ').</div>' +
          '<button class="btn btn-sm btn-ghost" id="btn-retry-geo" style="margin-top:8px;">Activer localisation &amp; caméra</button>';
        document.getElementById("btn-retry-geo").onclick = async function(){
          await requestAllPermissions("geo-banner");
          applyGeoMode();
        };
      }
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }

  function setStatus(ok, text){
    var dot = document.getElementById("status-dot"), t = document.getElementById("status-text");
    if(!dot) return;
    dot.className = "status-dot" + (ok ? "" : " off");
    t.textContent = text;
  }

  async function writePositionNow(){
    if(!state.lastCoords || !state.event) return;
    if(!state.player.name) return; // organisateur en mode "spectateur" sans équipe: on peut quand même afficher sa position s'il a un nom
    await upsertPlayer(state.event.code, state.playerId, {
      name: state.player.name,
      team: state.player.team,
      squad: state.player.squad || "",
      sos: !!state.player.sos,
      staffHidden: !!state.player.staffHidden,
      lat: state.lastCoords.lat,
      lng: state.lastCoords.lng
    });
  }

  function updateAdminUI(){
    var el = document.getElementById("admin-actions");
    if(!el) return;
    if(!state.isOrganizer){ el.innerHTML = ""; el.dataset.bound = ""; return; }
    if(el.dataset.bound === "1") return;
    el.dataset.bound = "1";
    el.innerHTML =
      '<button class="btn btn-ghost btn-sm" id="btn-edit-buildings-live">Éditer la carte</button>' +
      '<button class="btn btn-ghost btn-sm" id="btn-roles-live">Rôles & visibilité</button>';
    document.getElementById("btn-edit-buildings-live").onclick = async function(){
      var code = state.event.code;
      state.editorMode = "live";
      state.editorZones = await loadZones(code);
      state.editorCenter = state.event.center;
      teardownMap();
      state.screen = "editor";
      render();
    };
    document.getElementById("btn-roles-live").onclick = function(){
      teardownMap();
      state.screen = "roles";
      render();
    };
  }

  function updateStaffUI(amStaff){
    var el = document.getElementById("staff-actions");
    if(!el) return;
    if(!amStaff){ el.innerHTML = ""; el.dataset.bound = ""; return; }
    if(el.dataset.bound === "1") return;
    el.dataset.bound = "1";
    el.innerHTML = '<div class="test-toggle"><span class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Visible des autres joueurs (staff)</span>' +
      '<input type="checkbox" id="staff-visible-toggle" '+(state.player.staffHidden?'':'checked')+' /></div>';
    document.getElementById("staff-visible-toggle").onchange = async function(e){
      state.player.staffHidden = !e.target.checked;
      if(state.event) await upsertPlayer(state.event.code, state.playerId, { staffHidden: state.player.staffHidden });
    };
  }

  // Filet de sécurité : si l'administrateur enregistré n'a plus donné signe de vie depuis
  // longtemps (ou n'existe plus), n'importe quel joueur peut reprendre la main plutôt que
  // de rester bloqué sans organisateur ni staff.
  function updateClaimAdminUI(show, vis){
    var el = document.getElementById("claim-admin");
    if(!el) return;
    if(!show){ el.innerHTML = ""; el.dataset.bound = ""; return; }
    if(el.dataset.bound === "1") return;
    el.dataset.bound = "1";
    el.innerHTML = '<div class="banner warn">L\u2019organisateur semble injoignable.</div>' +
      '<button class="btn btn-sm btn-ghost" id="btn-claim-admin" style="margin-top:6px;">Devenir administrateur</button>';
    document.getElementById("btn-claim-admin").onclick = async function(){
      if(!confirm("Devenir administrateur de cette partie ?")) return;
      vis.adminId = state.playerId;
      await saveVisibility(state.event.code, vis);
    };
  }

  async function refreshPlayers(){
    if(!state.event) return;
    var players = await loadPlayers(state.event.code);
    var vis = await loadVisibility(state.event.code);
    if(vis.adminId && players[vis.adminId]) players[vis.adminId].isAdmin = true;

    // Statut admin/staff recalculé à chaque cycle (transfert possible en cours de partie)
    state.isOrganizer = (vis.adminId === state.playerId);
    var me = players[state.playerId];
    var myRole = me && me.role;
    var myTeam = me && me.team;
    var mySquad = me && me.squad;
    var mySos = me && me.sos;
    var amStaff = myRole === "staff";
    if(amStaff && me && typeof me.staffHidden === "boolean" && !document.getElementById("staff-actions").dataset.bound){
      state.player.staffHidden = me.staffHidden;
    }

    updateAdminUI();
    updateStaffUI(amStaff);

    var adminEntry = vis.adminId ? players[vis.adminId] : null;
    var adminGone = !state.isOrganizer && (!vis.adminId || !adminEntry || (Date.now() - (adminEntry.ts||0)) > 600000);
    updateClaimAdminUI(adminGone, vis);

    var amPrivileged = state.isOrganizer || amStaff;
    var teamRevealed = myTeam && vis.revealedTeams.indexOf(myTeam) !== -1;
    var restricted = !amPrivileged && !teamRevealed;

    var visible = {};
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      if(pid === state.playerId){ visible[pid] = p; return; }
      if(amPrivileged){ visible[pid] = p; return; }
      if(p.role === "staff"){
        if(!p.staffHidden || mySos) visible[pid] = p;
        return;
      }
      if(restricted && p.team !== myTeam) return;
      visible[pid] = p;
    });

    if(state.squadOnly && mySquad){
      Object.keys(visible).forEach(function(pid){
        var p = visible[pid];
        if(pid !== state.playerId && p.role !== "staff" && p.team === myTeam && (p.squad||"") !== mySquad){
          delete visible[pid];
        }
      });
    }

    var note = document.getElementById("vis-note");
    if(note) note.textContent = restricted ? "Vision limitée à ton équipe (sauf déblocage par le staff)." : "";

    updateMarkers(visible);
    updateRoster(visible);
  }

  async function refreshZones(){
    if(!state.event) return;
    var zones = await loadZones(state.event.code);
    updateZonePolygons(zones);
  }

  function isValidZone(z){
    if(!z || !z.id) return false;
    if(z.kind === "point") return Array.isArray(z.latlng) && z.latlng.length === 2;
    return Array.isArray(z.points) && z.points.length >= 3;
  }

  function updateZonePolygons(zones){
    if(!state.map) return;
    var seen = {};
    orderedZones(zones).forEach(function(z){
      if(!isValidZone(z)) return;
      seen[z.id] = true;
      try{
        if(state.zonesLayers[z.id]){
          if(z.kind === "building" || !z.kind){
            var info = zoneStatusInfo(z.status);
            state.zonesLayers[z.id].setStyle({ color: info.color, fillColor: info.color });
          } else if(z.kind === "guerre"){
            var wz = warzoneStyle(z);
            var layer = state.zonesLayers[z.id];
            layer.setStyle({ color: wz.color, fillColor: wz.color, fillOpacity: wz.fillOpacity, dashArray: wz.dashArray });
            if(layer._path) layer._path.classList.toggle('zone-objectif', !!wz.active);
            layer.setTooltipContent(escapeHtml(z.name) + ' · ' + wz.label);
          }
          return;
        }
        state.zonesLayers[z.id] = addZoneLayer(state.map, z);
      }catch(e){ /* une zone corrompue ne doit pas empêcher l'affichage des autres */ }
    });
    Object.keys(state.zonesLayers).forEach(function(id){
      if(!seen[id]){ state.map.removeLayer(state.zonesLayers[id]); delete state.zonesLayers[id]; }
    });
  }

  function updateMarkers(players){
    if(!state.map) return;
    var seen = {};
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      var isMe = pid === state.playerId;
      seen[pid] = true;
      var color = teamColor(state.event, p.team) || "#9b9b9b";
      var initials = (p.name||"?").trim().slice(0,2).toUpperCase();
      var badgeGlyph = initials, badgeSize = "11px";
      if(p.infected){ badgeGlyph = "🧟"; badgeSize = "13px"; color = "#3e6b2f"; }
      else if(p.isAdmin){ badgeGlyph = "👑"; badgeSize = "13px"; }
      else if(p.role === "staff"){ badgeGlyph = "🛡"; badgeSize = "13px"; }
      var html = '<div class="marker-badge'+(isMe?' me':'')+(p.sos?' sos':'')+'" style="background:'+color+';font-size:'+badgeSize+';">'+escapeHtml(badgeGlyph)+'</div>';
      if(state.markers[pid]){
        state.markers[pid].setLatLng([p.lat, p.lng]);
        if(state.markers[pid]._lastName !== p.name){
          state.markers[pid].setTooltipContent('<span class="player-label-inner">'+escapeHtml(p.name||"?")+'</span>');
          state.markers[pid]._lastName = p.name;
        }
        if(state.markers[pid]._lastBadge !== badgeGlyph){
          state.markers[pid].setIcon(L.divIcon({ html: html, className: '', iconSize:[26,26], iconAnchor:[13,13] }));
          state.markers[pid]._lastBadge = badgeGlyph;
        }
      } else {
        var icon = L.divIcon({ html: html, className: '', iconSize:[26,26], iconAnchor:[13,13] });
        var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(state.map)
          .bindTooltip('<span class="player-label-inner">'+escapeHtml(p.name||"?")+'</span>', { permanent: true, direction: 'top', offset: [0,-15], className: 'player-label' });
        marker._lastName = p.name;
        marker._lastBadge = badgeGlyph;
        state.markers[pid] = marker;
      }
    });
    Object.keys(state.markers).forEach(function(pid){
      if(!seen[pid]){ state.map.removeLayer(state.markers[pid]); delete state.markers[pid]; }
    });
    applyLabelZoomVisibility();
  }

  function applyLabelZoomVisibility(){
    if(!state.map) return;
    var container = state.map.getContainer();
    if(state.map.getZoom() >= 17){ container.classList.remove('labels-hidden'); }
    else{ container.classList.add('labels-hidden'); }
  }

  function updateRoster(players){
    var me = state.lastCoords;
    var search = (state.rosterSearch||"").trim().toLowerCase();
    var rows = Object.keys(players).map(function(pid){
      var p = players[pid];
      var stale = (Date.now() - (p.ts||0)) > 30000;
      var color = teamColor(state.event, p.team) || "#9b9b9b";
      var dist = (pid === state.playerId) ? null : haversine(me, { lat: p.lat, lng: p.lng });
      return { pid: pid, p: p, stale: stale, color: color, dist: dist };
    }).filter(function(r){
      return !search || (r.p.name||"").toLowerCase().indexOf(search) !== -1;
    }).sort(function(a,b){
      if(!!b.p.sos - !!a.p.sos !== 0) return !!b.p.sos - !!a.p.sos;
      if(a.pid === state.playerId) return -1;
      if(b.pid === state.playerId) return 1;
      return (a.dist||0) - (b.dist||0);
    });

    document.getElementById("roster").innerHTML = rows.map(function(r){
      return '<div class="roster-row'+(r.stale?' stale':'')+'" data-pid="'+r.pid+'">' +
        '<span class="dot" style="background:'+r.color+'"></span>' +
        '<span class="name">'+escapeHtml(r.p.name||"?")+(r.pid===state.playerId?'<span class="you">TOI</span>':'')+(r.p.role==="staff"?'<span class="you" style="color:var(--amber);">STAFF</span>':'')+(r.p.sos?'<span class="you" style="color:var(--danger);">🆘 AIDE</span>':'')+'</span>' +
        '<span class="dist">'+(r.pid===state.playerId ? "" : fmtDist(r.dist))+'</span>' +
      '</div>';
    }).join("") || '<p>'+(search ? "Aucun joueur ne correspond." : "Aucun coéquipier détecté pour l\u2019instant.")+'</p>';

    Array.prototype.forEach.call(document.querySelectorAll("#roster .roster-row"), function(row){
      row.style.cursor = "pointer";
      row.onclick = function(){
        var p = players[row.dataset.pid];
        if(p && state.map && typeof p.lat === "number") state.map.setView([p.lat, p.lng], Math.max(state.map.getZoom(), 18));
      };
    });
  }

  function teardownMap(){
    if(state.watchId !== null && navigator.geolocation){ navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
    if(state.writeTimer){ clearInterval(state.writeTimer); state.writeTimer = null; }
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    state.compassAngle = 0;
    if(state.map){ state.map.remove(); state.map = null; }
    state.markers = {};
    state.zonesLayers = {};
  }

  // Quand l'appli est vraiment fermée (onglet fermé, appli quittée) : on arrête le GPS et les
  // envois de position pour ne pas gaspiller batterie/données. On NE supprime PAS le joueur de
  // la partie pour les autres — sinon une pause déjeuner d'1h ferait à nouveau disparaître tout
  // le monde de la carte, ce qu'on a justement corrigé.
  window.addEventListener("pagehide", function(){
    if(state.watchId !== null && navigator.geolocation){ navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
    if(state.writeTimer){ clearInterval(state.writeTimer); state.writeTimer = null; }
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    stopEditorGeoWatch();
  });

  render();
})();
</script>
</body>
</html>
