<style>
  :root{
    --bg: #14170f;
    --panel: #1c2116;
    --panel-2: #232a1c;
    --line: #3a4430;
    --ink: #e8e6d9;
    --ink-dim: #8b9184;
    --amber: #c9a227;
    --amber-dim: #7a651c;
    --danger:#b3402f;
    --red:#e03c31;
    --green:#3ca55c;
    --blue:#3b82c4;
    --yellow:#d9a62e;
    --radius: 3px;
    --compass-angle: 0deg;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, rgba(140,150,110,0.06) 0, rgba(140,150,110,0.06) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(140,150,110,0.06) 0, rgba(140,150,110,0.06) 1px, transparent 1px, transparent 34px);
    color:var(--ink);
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--amber);
    text-transform:uppercase;
  }
  .eyebrow::before{ content:"// "; color:var(--amber-dim); }

  #app{ flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; padding:18px 16px 28px; }

  h1,h2,h3{ margin:0; font-weight:700; letter-spacing:.02em; }
  p{ margin:6px 0 0; color:var(--ink-dim); font-size:14px; line-height:1.5; }

  /* ---- Home / hero ---- */
  .hero{ position:relative; padding:38px 0 26px; text-align:center; overflow:hidden; }
  .reticle{
    position:absolute; top:50%; left:50%; width:230px; height:230px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(201,162,39,0.25); border-radius:50%;
    pointer-events:none;
  }
  .reticle::before,.reticle::after{
    content:""; position:absolute; background:rgba(201,162,39,0.25);
  }
  .reticle::before{ top:50%; left:-14px; right:-14px; height:1px; }
  .reticle::after{ left:50%; top:-14px; bottom:-14px; width:1px; }
  .sweep{
    position:absolute; top:50%; left:50%; width:230px; height:230px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: conic-gradient(from 0deg, rgba(201,162,39,0.35), transparent 28%);
    animation: spin 5s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .sweep{ animation:none; opacity:.4; } }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .hero-title{ position:relative; font-size:27px; letter-spacing:.05em; text-transform:uppercase; }
  .hero-sub{ position:relative; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; margin-top:6px; }
  .hero-patch{ position:relative; width:190px; height:auto; margin:0 auto 10px; display:block; filter:drop-shadow(0 0 14px rgba(201,162,39,0.25)); }
  .hero-credit{ position:relative; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--amber-dim); text-transform:uppercase; margin-top:10px; }

  .stack{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }

  /* ---- Buttons ---- */
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px 18px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-size:15px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--amber); border-color:var(--amber); color:#191a10; }
  .btn-primary:hover{ background:#dab233; }
  .btn-ghost{ background:transparent; }
  .btn-ghost:hover{ border-color:var(--ink-dim); }
  .btn-danger{ border-color:var(--danger); color:#f2a89a; background:transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-sm{ padding:10px 14px; font-size:12px; width:auto; }
  .link-btn{ background:none; border:none; color:var(--amber); text-decoration:underline; font-size:13px; padding:4px; }

  /* ---- Panels / forms ---- */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .field{ margin-top:14px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:6px; }
  input[type=text], input[type=number]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:16px; padding:12px; letter-spacing:.03em;
  }
  input[type=text]:focus, input[type=number]:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .code-input{ text-align:center; text-transform:uppercase; font-size:22px; letter-spacing:.3em; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .back{ background:none; border:none; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase; padding:6px 0; }
  .back:hover{ color:var(--ink); }

  /* ---- Teams ---- */
  .teams{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .team-chip{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:20px;
    border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.03em; text-transform:uppercase;
  }
  .team-chip.selected{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }
  .dot{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(0,0,0,.35); }
  .remove-chip{ background:none;border:none;color:var(--ink-dim); font-size:14px; line-height:1; padding:0 0 0 2px; }

  /* ---- QR / code reveal ---- */
  .code-reveal{ text-align:center; padding:22px 16px; }
  #qrcode{ display:inline-block; padding:12px; background:var(--ink); border-radius:var(--radius); margin:14px 0; }
  .big-code{ font-family:'JetBrains Mono',monospace; font-size:34px; letter-spacing:.35em; color:var(--amber); }

  /* ---- Map screen ---- */
  .map-rotate-wrapper{ width:100%; height:52vh; min-height:300px; overflow:hidden; position:relative; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); }
  .map-rotate-wrapper.fullscreen{
    position:fixed; top:0; left:0; right:0; bottom:0;
    width:100vw; height:100vh; height:100dvh;
    z-index:500; border-radius:0; border:none;
  }
  #map{
    position:absolute; top:50%; left:50%;
    width:210%; height:210%;
    transform: translate(-50%,-50%) rotate(0deg);
    transition: transform 0.25s linear;
    transform-origin:50% 50%;
    z-index:1;
  }
  .map-fullscreen-btn{
    position:absolute; top:8px; right:8px; z-index:410;
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(28,33,22,0.88); border:1px solid var(--line); color:var(--ink); font-size:17px; padding:0;
  }
  .map-rotate-wrapper.fullscreen .map-fullscreen-btn{ top:calc(env(safe-area-inset-top, 0px) + 10px); }
  .warzone-banner-overlay{
    position:absolute; top:8px; left:8px; right:54px; z-index:405;
    display:flex; flex-direction:column; gap:3px; pointer-events:auto;
    max-height:30%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  }
  .map-rotate-wrapper.fullscreen .warzone-banner-overlay{ top:calc(env(safe-area-inset-top, 0px) + 10px); right:calc(env(safe-area-inset-right, 0px) + 54px); left:calc(env(safe-area-inset-left, 0px) + 8px); max-height:45%; }
  .mini-banner{ padding:3px 8px; border-radius:var(--radius); background:rgba(20,23,15,0.82); border:1px solid var(--line); pointer-events:auto; width:fit-content; font-size:10px; flex-shrink:0; }
  .status-bar{ display:flex; align-items:center; gap:8px; margin:10px 0; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); letter-spacing:.05em; text-transform:uppercase; }
  .compass-row{ display:flex; align-items:center; gap:14px; margin-top:12px; }
  .compass-dial{
    width:60px; height:60px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line);
    position:relative; flex:none; touch-action:none; cursor:grab;
  }
  .compass-dial-face{ position:absolute; inset:0; transform: rotate(var(--compass-angle)); }
  .compass-dial-n{ position:absolute; top:3px; left:50%; transform:translateX(-50%); color:var(--amber); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; }
  .compass-dial::after{ content:""; position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--ink-dim); }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; }
  .status-dot.off{ background:var(--danger); }
  .roster{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .roster-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .roster-row .name{ flex:1; font-size:14px; }
  .roster-row .name .you{ color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:10px; margin-left:6px; }
  .roster-row .dist{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  .roster-row.stale{ opacity:.4; }
  .leaflet-div-icon{ background:transparent; border:none; }
  .marker-badge{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 1px 4px rgba(0,0,0,.5);
    transform: rotate(var(--compass-angle)); transition: transform 0.25s linear;
  }
  .marker-badge.me{ box-shadow:0 0 0 4px rgba(201,162,39,0.35); }
  .marker-badge.sos{ animation: sospulse 1s ease-in-out infinite; }
  @keyframes sospulse{ 0%,100%{ box-shadow:0 0 0 4px rgba(179,64,47,0.55); } 50%{ box-shadow:0 0 0 9px rgba(179,64,47,0.12); } }
  .leaflet-tooltip.player-label{
    background: rgba(28,33,22,0.92); border:1px solid var(--line); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:10px; padding:1px 6px; border-radius:2px;
    box-shadow:none;
  }
  .leaflet-tooltip.player-label::before{ display:none; }
  .labels-hidden .player-label{ display:none; }
  .player-label-inner{ display:inline-block; transform: rotate(var(--compass-angle)); transition: transform 0.25s linear; }

  /* ---- Éditeur de bâtiments / zones ---- */
  #editor-map{ width:100%; height:42vh; min-height:260px; border-radius:var(--radius); border:1px solid var(--line); }
  .editor-toolbar{ margin-top:10px; }
  .zone-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .zone-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .zone-group{ margin-bottom:8px; }
  .zone-group-header{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-family:'Oswald', sans-serif; font-size:13px; letter-spacing:.03em; text-transform:uppercase;
    padding:9px 12px; border-radius:var(--radius); cursor:pointer; margin-bottom:6px;
  }
  .zone-group .zone-row{ margin-bottom:6px; }
  .zone-row .name{ flex:1; font-size:13px; }
  .zone-row .dist{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); }
  select.zone-status{
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:6px; text-transform:uppercase;
  }
  .zone-legend{ display:flex; flex-wrap:wrap; gap:10px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:8px; align-items:center; }
  .warzone-alert{ padding:3px 8px; border-radius:var(--radius); border:1px solid; backdrop-filter: blur(2px); pointer-events:auto; flex-shrink:0; }
  .warzone-alert.pending{ border-color:var(--amber-dim); background:rgba(20,23,15,0.85); color:var(--amber); }
  .warzone-alert.active{ border-color:var(--danger); background:rgba(35,15,12,0.88); color:#f2a89a; animation: warzoneflash 1.6s ease-in-out infinite; }
  .warzone-alert .wz-name{ font-family:'JetBrains Mono',monospace; font-size:8.5px; text-transform:uppercase; letter-spacing:.03em; opacity:.85; }
  .warzone-alert .wz-time{ font-size:11px; font-weight:700; margin-top:0; }
  .flag-progress-track{ width:100%; height:3px; border-radius:2px; background:rgba(231,221,201,.18); margin-top:3px; overflow:hidden; }
  .flag-progress-fill{ height:100%; background:var(--amber); border-radius:3px; transition:width .4s ease-out; }
  @keyframes warzoneflash{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  .zone-legend .dot{ width:8px; height:8px; }
  .leaflet-interactive.zone-objectif{ animation: zonepulse 1.6s ease-in-out infinite; }
  @keyframes zonepulse{ 0%,100%{ fill-opacity:0.22; } 50%{ fill-opacity:0.55; } }

  .banner{ font-size:13px; padding:10px 12px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel-2); color:var(--ink-dim); margin-top:12px; }
  .banner.warn{ border-color:var(--danger); color:#f2a89a; }
  .banner.info{ border-color:var(--amber-dim); color:var(--amber); }

  .test-toggle{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .ping-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .ping-grid .btn{ font-size:12px; padding:9px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ping-marker{ font-size:20px; line-height:1; filter:drop-shadow(0 1px 3px rgba(0,0,0,.7)); animation:pingPulse 1.4s ease-in-out infinite; }
  @keyframes pingPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }
  .cluster-badge{ display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%;
    background:var(--amber-red, #a2231f); color:#fff; font-weight:700; font-size:13px; border:2px solid rgba(231,221,201,.85);
    box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .seg-label{ font-size:10.5px; font-family:'JetBrains Mono', monospace; color:#191a10; background:rgba(231,221,201,.92);
    padding:1px 5px; border-radius:2px; white-space:nowrap; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  video#scan-video{ width:100%; border-radius:var(--radius); border:1px solid var(--line); background:#000; }
  canvas#scan-canvas{ display:none; }

  footer{ text-align:center; padding-top:20px; }
  footer p{ font-size:11px; letter-spacing:.05em; }

  /* ---------- Écran d'introduction cinématique (Bad Brothers) ---------- */

  :root{ --cream:#e7ddc9; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  .intro-screen{
    margin:0; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:30px 18px; overflow:hidden;
    background: radial-gradient(ellipse 80% 60% at 50% 32%, #1b1112 0%, #0c0909 55%, #050506 100%);
    font-family:'Oswald', sans-serif;
    position:relative;
  }
  .atmosphere{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .cloud{ position:absolute; border-radius:50%; filter:blur(38px);
    background:radial-gradient(circle, rgba(120,60,50,.20) 0%, rgba(60,30,28,.10) 45%, transparent 72%); opacity:.55; }
  .cloud.c1{ width:46vw; height:46vw; left:-10vw; top:8vh; animation:drift1 22s ease-in-out infinite; }
  .cloud.c2{ width:52vw; height:52vw; right:-14vw; top:30vh; animation:drift2 26s ease-in-out infinite; }
  .cloud.c3{ width:36vw; height:36vw; left:22vw; bottom:-14vh; animation:drift3 19s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(4vw,-3vh) scale(1.12);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-5vw,4vh) scale(1.08);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(3vw,-2vh) scale(1.15);} }
  .ember{ position:absolute; bottom:-4%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,170,90,1) 0%, rgba(210,80,30,.85) 45%, rgba(210,80,30,0) 75%);
    box-shadow:0 0 6px 1px rgba(255,140,60,.6); opacity:0;
    animation-name:emberRise; animation-timing-function:ease-in; animation-iteration-count:infinite; }
  @keyframes emberRise{ 0%{opacity:0; transform:translate(0,0) scale(1);} 8%{opacity:.9;} 70%{opacity:.55;}
    100%{opacity:0; transform:translate(var(--dx,10px), -78vh) scale(.4);} }
  
  .stage-wrap{ position:relative; z-index:1; width:min(78vw, 360px); }
  .viewport{ position:relative; width:100%; aspect-ratio: 543 / 638; filter:drop-shadow(0 20px 44px rgba(0,0,0,.6)); }
  .ambient-glow{ position:absolute; inset:-6%; border-radius:50%;
    background:radial-gradient(ellipse at 50% 45%, rgba(170,40,30,.35) 0%, transparent 68%);
    opacity:0; filter:blur(10px); pointer-events:none; }
  .camera{ position:absolute; inset:0; overflow:hidden; transform-origin:50% 34%; transform:scale(1.16); }
  .frame-img{ position:absolute; object-fit:fill; object-position:center; opacity:0; will-change:opacity; left:0; top:0; width:100%; height:100%; }
  .eye-glow{ position:absolute; width:7%; height:5.5%; border-radius:50%; filter:blur(4px);
    background:radial-gradient(circle, rgba(255,140,70,.85) 0%, rgba(220,70,30,.4) 55%, transparent 75%);
    opacity:0; mix-blend-mode:screen; pointer-events:none; }
  .eye-glow.l{ left:41.9%; top:34.5%; }
  .eye-glow.r{ left:53.0%; top:34.5%; }
  .puff{ position:absolute; left:47.5%; top:52%; width:11%; height:11%; border-radius:50%;
    background:radial-gradient(circle, rgba(220,212,202,.6) 0%, rgba(220,212,202,.28) 42%, rgba(220,212,202,0) 72%);
    filter:blur(2px); opacity:0; mix-blend-mode:screen; pointer-events:none; }
  .impact-flash{ position:absolute; inset:-20%; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, rgba(255,235,210,1) 0%, rgba(255,140,60,.9) 30%, rgba(180,40,20,0) 70%);
    opacity:0; }
  
  /* ---- Étape 1 : crâne, bouche fermée -> ouverte -> fermée (inchangé) ---- */
  .viewport.play .camera{ animation:camZoom 3.4s cubic-bezier(.19,.75,.34,1) forwards; }
  @keyframes camZoom{ 0%{transform:scale(1.16);} 100%{transform:scale(1);} }
  .viewport.play .ambient-glow{ animation:glowIn 3.4s ease-out .3s forwards; }
  @keyframes glowIn{ 0%{opacity:0;} 100%{opacity:1;} }
  
  .viewport.play .f-a{ animation:seqA 3.4s linear forwards; }
  .viewport.play .f-b{ animation:seqB 3.4s linear forwards; }
  @keyframes seqA{ 0%{opacity:0;} 5%{opacity:1;} 13%{opacity:1;} 18%{opacity:0;} 26%{opacity:0;} 31%{opacity:1;} 36%{opacity:1;} 41%{opacity:0;} 100%{opacity:0;} }
  @keyframes seqB{ 0%{opacity:0;} 13%{opacity:0;} 18%{opacity:1;} 26%{opacity:1;} 31%{opacity:0;} 100%{opacity:0;} }
  
  /* ---- Étape 2 : poings + roses + bouclier + épée, tout d'un coup (impact) ---- */
  .viewport.play .f-e{ animation:revealE 0.18s ease-out 1.408s forwards; }
  @keyframes revealE{ 0%{opacity:0;} 100%{opacity:1;} }
  .viewport.play .impact-flash{ animation:flashPunch 0.5s ease-out 1.408s forwards; }
  @keyframes flashPunch{ 0%{opacity:0;} 8%{opacity:.95;} 40%{opacity:.15;} 100%{opacity:0;} }
  .viewport{ animation:none; }
  .viewport.play{ animation-name: idleGlow, viewportPunch; animation-duration: 6s, 0.35s; animation-timing-function: ease-in-out, ease-out; animation-delay: 3.3s, 1.408s; animation-iteration-count: infinite, 1; }
  @keyframes idleGlow{ 0%,100%{ filter:drop-shadow(0 0 0px rgba(180,40,30,0)); } 50%{ filter:drop-shadow(0 0 18px rgba(180,40,30,.38)); } }
  @keyframes viewportPunch{ 0%{transform:scale(1);} 30%{transform:scale(1.09);} 60%{transform:scale(0.98);} 100%{transform:scale(1);} }
  
  /* ---- Étape 3 : bandeau "BAD BROTHERS", fondu/révélation gauche -> droite ---- */
  .viewport.play .f-f{ opacity:1; clip-path: inset(0 100% 0 0); animation:bannerWipe 0.7s ease-in-out 2.3s forwards; }
  @keyframes bannerWipe{ 0%{ clip-path: inset(0 100% 0 0); } 100%{ clip-path: inset(0 0% 0 0); } }
  
  .viewport.play .eye-glow{ animation:eyePulse 1.1s ease-in-out .2s; }
  @keyframes eyePulse{ 0%,100%{opacity:0;} 30%{opacity:.7;} 55%{opacity:.2;} 78%{opacity:.65;} }
  .viewport.play .puff.p1{ animation:puff1 0.5s ease-out .55s; }
  @keyframes puff1{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.3);} 18%{opacity:.55;} 100%{opacity:0; transform:translate(-64%,-50%) translateY(-72%) scale(1.9) rotate(8deg);} }
  
  @media (prefers-reduced-motion: reduce){
    .viewport.play, .viewport.play *{ animation:none !important; }
    .camera{ transform:scale(1) !important; }
    .frame-img{ opacity:0 !important; }
    .frame-img.f-f{ opacity:1 !important; clip-path:none !important; }
    .puff, .eye-glow, .impact-flash, .ambient-glow{ display:none !important; }
    .cloud, .ember{ display:none !important; }
  }


  .intro-controls{ position:relative; z-index:1; min-height:52px; }
  .intro-enter-btn{
    opacity:0; animation: introBtnIn 0.7s ease-out forwards;
    padding:14px 46px; font-size:15px; letter-spacing:.18em;
  }
  @keyframes introBtnIn{ 0%{opacity:0; transform:translateY(8px);} 100%{opacity:1; transform:translateY(0);} }

</style>

<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>

<script>
(function(){
  "use strict";

  // ---------- Vérification du chargement des librairies externes ----------
  var LIBS_OK = { leaflet: typeof L !== "undefined", qrcode: typeof QRCode !== "undefined", jsqr: typeof jsQR !== "undefined" };

  // Identifiant de joueur stable : sans ça, fermer/rouvrir l'appli (ou juste recharger
  // la page) générait un nouvel identifiant à chaque fois, et rejoindre une partie déjà
  // en cours créait un second point au lieu de mettre à jour le sien. On le garde donc
  // en mémoire locale sur l'appareil (ça ne fonctionne que sur un vrai site comme celui-ci,
  // pas dans l'aperçu intégré à l'app Claude).
  function getOrCreatePlayerId(){
    try{
      var existing = localStorage.getItem("badRecon_playerId");
      if(existing) return existing;
      var fresh = "p-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("badRecon_playerId", fresh);
      return fresh;
    }catch(e){
      return "p-" + Math.random().toString(36).slice(2, 10);
    }
  }

  // ---------- Etat de l'application ----------
  var state = {
    screen: "intro",
    playerId: getOrCreatePlayerId(),
    event: null,        // { code, name, teams:[{name,color}], center:{lat,lng}, zoom }
    joinCodeDraft: "",
    player: { name: "", team: null, squad: "" },
    testMode: false,
    squadOnly: false,
    compassAngle: 0,
    mapFullscreen: false,
    rosterSearch: "",
    isOrganizer: false,
    lastCoords: null,   // {lat,lng}
    map: null,
    markers: {},         // playerId -> L.marker
    zonesLayers: {},      // zoneId -> L.polygon (carte en direct)
    pollTimer: null,
    writeTimer: null,
    watchId: null,
    scanStream: null,
    scanRAF: null,
    lastEventErr: "",
    zonesSaveWarning: "",
    revealFromMap: false,
    // Éditeur de bâtiments
    editorMode: null,     // 'draft' (avant création d'événement) | 'live' (pendant la partie)
    editorZones: [],
    editorCenter: null,
    editorMap: null,
    editorLayers: {},
    drawing: false,
    drawKind: null,       // 'terrain' | 'building'
    placingPoint: false,
    drawPoints: [],
    drawLayer: null,
    editorWatchId: null,
    editingZoneId: null,   // zone en cours de modification (poignées visibles) dans l'éditeur
    editorMeMarker: null,
    refImageDataUrl: null,
    refImageBounds: null,
    refImageHandles: [],
    refImageRotation: 0,
    refImageOpacity: 0.6,

  // ---------- Backend de stockage partagé (Firebase Realtime Database, via REST) ----------
  // window.storage n'existe que dans l'environnement Claude — sur Netlify (ou tout autre
  // hébergement), il faut une vraie base. On utilise l'API REST de Firebase Realtime Database :
  // pas besoin de charger le SDK Firebase, un simple fetch() suffit.
  // ⚠️ À REMPLACER : colle ici l'URL de ta Realtime Database Firebase (voir instructions).
  var FIREBASE_DB_URL = "https://bad-recon-default-rtdb.europe-west1.firebasedatabase.app";

  // ---------- Tuiles de carte mises en cache (Cache API) ----------
  // Les tuiles vues en ligne sont gardées en cache local ; si la connexion coupe en
  // pleine partie, les zones déjà consultées restent visibles au lieu d'un fond gris.
  // Best effort : sans "Cache API" (vieux navigateur), on retombe simplement sur le
  // chargement réseau classique de Leaflet, sans rien casser.
  var TILE_CACHE_NAME = "badrecon-tiles-v1";
  function createCachedTileLayer(){
    var url = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    var opts = { maxZoom: 19, attribution: '&copy; OpenStreetMap', subdomains: 'abc' };
    if(!('caches' in window)) return L.tileLayer(url, opts);

    var CachedLayer = L.TileLayer.extend({
      createTile: function(coords, done){
        var img = document.createElement('img');
        img.setAttribute('role', 'presentation');
        var tileUrl = this.getTileUrl(coords);
        caches.open(TILE_CACHE_NAME).then(function(cache){
          cache.match(tileUrl).then(function(cached){
            if(cached){
              cached.blob().then(function(blob){ img.src = URL.createObjectURL(blob); });
            }
            fetch(tileUrl).then(function(resp){
              if(resp && resp.ok){
                cache.put(tileUrl, resp.clone());
                if(!cached) resp.blob().then(function(blob){ img.src = URL.createObjectURL(blob); });
              } else if(!cached){
                done('tuile indisponible', img);
              }
            }).catch(function(){
              // Hors ligne : on garde la version en cache si on en avait une ; sinon,
              // la tuile restera simplement vide à cet endroit.
              if(!cached) done(null, img);
            });
          });
        });
        img.onload = function(){ done(null, img); };
        img.onerror = function(){ done(null, img); };
        return img;
      }
    });
    return new CachedLayer(url, opts);
  }

  async function storageGet(key){
    if(!dbConfigured()) return null;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json");
      state.networkOk = true;
      if(!res.ok) return null;
      var data = await res.json();
      return data; // déjà la chaîne JSON qu'on avait stockée (ou null si absente)
    }catch(e){ state.networkOk = false; return null; }
  }
  async function storageSet(key, value){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ return false; }
  }
  async function storageDelete(key){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", { method: "DELETE" });
      return res.ok;
    }catch(e){ return false; }
  }

  // ---------- Stockage "brut" (un seul encodage JSON, pas de double encodage) ----------
  // storageGet/storageSet ci-dessus encodent la valeur en texte AVANT de l'envoyer (l'appelant
  // fait déjà JSON.stringify, puis storageSet le refait) : Firebase stocke donc chaque clé comme
  // un simple bloc de texte, jamais comme une vraie arborescence — impossible d'adresser un
  // enfant précis (ex. un seul joueur) sans retélécharger et réécrire tout le bloc. Ces fonctions
  // envoient l'objet tel quel : Firebase le stocke alors comme une vraie arborescence, où chaque
  // joueur devient un nœud à part entière qu'on peut lire/écrire individuellement.
  async function rawStorageGet(key){
    if(!dbConfigured()) return null;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json");
      state.networkOk = true;
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ state.networkOk = false; return null; }
  }
  async function rawStorageSet(key, value){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ return false; }
  }
  async function rawStorageDelete(key){
    if(!dbConfigured()) return false;
    try{
      var res = await fetch(FIREBASE_DB_URL + "/" + key + ".json", { method: "DELETE" });
      return res.ok;
    }catch(e){ return false; }
  }

  async function loadPlayers(code){
    // Une seule lecture pour TOUS les joueurs reste nécessaire ici (la carte a besoin de
    // connaître tout le monde) — ce qui change, c'est l'ÉCRITURE : elle ne touche plus que
    // le joueur concerné (voir upsertPlayer), au lieu de retélécharger puis réécrire ce
    // même bloc complet à chaque battement de position de chaque joueur.
    var data = await rawStorageGet(eventPlayersKey(code));

  async function upsertPlayer(code, playerId, data){
    var existing = await rawStorageGet(eventPlayerKey(code, playerId));
    var merged = Object.assign({}, existing || {}, data, { ts: Date.now() });
    await rawStorageSet(eventPlayerKey(code, playerId), merged);
  }
  async function deletePlayer(code, playerId){
    return rawStorageDelete(eventPlayerKey(code, playerId));
  }
  async function mergeDuplicatePlayers(code){
    var players = await loadPlayers(code);
    var byName = {};
    Object.keys(players).forEach(function(pid){
      var p = players[pid];
      var key = (p.name||"").trim().toLowerCase();
      if(!key) return;
      if(!byName[key]) byName[key] = [];
      byName[key].push({ pid: pid, ts: p.ts||0 });
    });
    var removed = 0;
    var deletions = [];
    Object.keys(byName).forEach(function(key){
      var group = byName[key];
      if(group.length < 2) return;
      group.sort(function(a,b){ return b.ts - a.ts; });
      for(var i=1;i<group.length;i++){ deletions.push(group[i].pid); removed++; }
    });
    // Chaque doublon est supprimé individuellement (son propre nœud), sans toucher aux
    // joueurs qui n'ont rien à voir avec la fusion.
    for(var j=0;j<deletions.length;j++){ await deletePlayer(code, deletions[j]); }
    return removed;
  }

  // ---------- Utilitaires ----------
  function genCode(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans 0/O/1/I pour éviter les confusions
    var out = "";
    for(var i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function haversine(a,b){
    if(!a||!b) return null;
    var R=6371000, toRad=Math.PI/180;
    var dLat=(b.lat-a.lat)*toRad, dLng=(b.lng-a.lng)*toRad;
    var la1=a.lat*toRad, la2=b.lat*toRad;
    var h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
    return Math.round(2*R*Math.asin(Math.sqrt(h)));
  }
  function fmtDist(m){
    if(m===null || m===undefined) return "—";
    return m < 1000 ? (m + " m") : ((m/1000).toFixed(1) + " km");
  }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- Rendu ----------
  var _lastPushedScreen = null;
  function render(){
    stopMapIfNeeded();
    stopChatIfNeeded();
    stopVoiceIfNeeded();
    // Synchronise l'écran courant avec l'historique du navigateur : sans ça, le bouton
    // "retour" du téléphone ne voit qu'une seule page du début à la fin de l'appli, et
    // saute direct au tout début (ou ferme l'appli) au lieu de revenir écran par écran.
    if(state.screen !== _lastPushedScreen){
      if(state._skipHistoryPush){
        state._skipHistoryPush = false;
      } else {
        history.pushState({ screen: state.screen }, "", "");
      }
      _lastPushedScreen = state.screen;
    }
    if(state.screen === "home") return renderHome();
    if(state.screen === "create") return renderCreate();
    if(state.screen === "join") return renderJoin();
    if(state.screen === "team") return renderTeamPick();
    if(state.screen === "map") return renderMap();
    if(state.screen === "editor") return renderMapEditor();
    if(state.screen === "roles") return renderRoles();
    if(state.screen === "reveal") return renderReveal();
    if(state.screen === "library") return renderLibrary();
    if(state.screen === "moderation") return renderModeration();
    if(state.screen === "intro") return renderIntro();
    if(state.screen === "log") return renderLog();
    if(state.screen === "chat") return renderChat();
    if(state.screen === "gamemode") return renderGameMode();
  }

  // Bouton/geste "retour" du téléphone : on revient à l'écran précédemment visité dans
  // l'appli, sans repousser une nouvelle entrée (on vient justement d'en dépiler une).
  window.addEventListener("popstate", function(e){
    if(e.state && e.state.screen){
      state.screen = e.state.screen;
      _lastPushedScreen = state.screen;
      state._skipHistoryPush = true;
      render();
    }
  });

  function stopMapIfNeeded(){
    if(state.screen !== "map" && state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
  }
  function stopChatIfNeeded(){
    if(state.screen !== "chat" && state.chatPollTimer){ clearInterval(state.chatPollTimer); state.chatPollTimer = null; }
  }
  // Coupe le micro si on quitte le chat par un autre chemin que le bouton "Retour" (ex. le
  // bouton retour physique du téléphone) — sinon l'enregistrement continuerait en silence.
  function stopVoiceIfNeeded(){
    if(state.screen !== "chat" && state.voiceRecorder){
      if(state.voiceRecordTimer){ clearInterval(state.voiceRecordTimer); state.voiceRecordTimer = null; }
      state.voiceChunks = [];
      if(state.voiceRecorder.state !== "inactive"){ state.voiceRecorder.stop(); }
      state.voiceRecorder = null;
      if(state.voiceStream){ state.voiceStream.getTracks().forEach(function(t){ t.stop(); }); state.voiceStream = null; }
      state.voicePreviewDataUrl = null;

  // Demande position + caméra en un seul geste (un seul bouton, un seul aller-retour
  // avec le système). Si un accès a déjà été refusé une fois, le navigateur ne
  // réaffichera pas la popup — il faut alors l'autoriser à la main dans ses réglages
  // (on l'explique clairement dans le message d'erreur ci-dessous).
  async function requestAllPermissions(elId){
    var el = document.getElementById(elId);
    if(el) el.innerHTML = '<div class="banner info">Demande des autorisations…</div>';
    var results = { geo: false, cam: false };

    try{
      await new Promise(function(resolve, reject){
        if(!navigator.geolocation){ reject(new Error("non supportée")); return; }
        navigator.geolocation.getCurrentPosition(function(pos){
          state.lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          resolve();
        }, reject, { enableHighAccuracy:true, timeout:10000 });
      });
      results.geo = true;
    }catch(e){ results.geo = false; }

    try{
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      stream.getTracks().forEach(function(t){ t.stop(); });
      results.cam = true;
    }catch(e){ results.cam = false; }

    if(el){
      var needsHelp = !results.geo || !results.cam;
      el.innerHTML =
        '<div class="banner '+(needsHelp?'warn':'info')+'">' +
          '<div>'+(results.geo?'✅':'❌')+' Position '+(results.geo?'autorisée':'refusée ou indisponible')+'</div>' +
          '<div style="margin-top:4px;">'+(results.cam?'✅':'❌')+' Caméra '+(results.cam?'autorisée':'refusée ou indisponible')+'</div>' +
          (needsHelp ? '<p style="margin-top:8px;">Si un accès reste refusé, l\u2019appli ne peut pas le redemander toute seule : touche l\u2019icône 🔒 (ou "i") à côté de l\u2019adresse du site, autorise Position et/ou Caméra, puis recharge la page. Et si tu es dans l\u2019aperçu intégré à l\u2019app Claude, ouvre plutôt le lien publié dans Safari/Chrome.</p>' : '') +
        '</div>';
    }
    return results;
  }

  function renderCreate(){
    if(!state._draftTeams) state._draftTeams = [STAFF_TEAM];
    if(!state._draftName) state._draftName = "";
    if(!state._draftCenter) state._draftCenter = null;
    if(!state._draftZones) state._draftZones = [];

    app.innerHTML =
      '<div class="topbar"><button class="back">‹ Retour</button><div class="eyebrow">Créer</div></div>' +
      '<div class="panel">' +
        '<div class="field"><label>Nom de l\'événement</label>' +
          '<input type="text" id="ev-name" placeholder="Ex. Op\u00e9ration Faucon" value="'+escapeHtml(state._draftName)+'" /></div>' +

          '</div>' +
          '<p id="center-status">'+(state._draftCenter ? ("Centre défini : "+state._draftCenter.lat.toFixed(5)+", "+state._draftCenter.lng.toFixed(5)) : "Aucune position définie pour l\u2019instant.")+'</p>' +
        '</div>' +
        '<div class="field"><label>Équipes</label>' +
          '<div class="teams" id="teams-list"></div>' +
          '<div class="row" style="margin-top:8px;">' +

          '</div>' +
        '</div>' +
        '<div class="field"><label>Carte du terrain</label>' +
          '<p style="margin-top:0;">'+(state._draftZones.length ? (state._draftZones.length+" élément(s) défini(s) (limite, bâtiments, points)") : "Rien de défini pour l\u2019instant (optionnel).")+'</p>' +
          (state._draftCenter
            ? '<button class="btn btn-sm btn-ghost" id="btn-edit-buildings" style="margin-top:8px;">Délimiter / dessiner / charger une carte</button>'
            : '<p style="margin-top:8px;font-size:12px;">Définis d\u2019abord la position du terrain ci-dessus.</p>') +
        '</div>' +
        '<div class="field"><label>Code d\u2019accès organisateur (optionnel)</label>' +
          '<input type="text" id="ev-access-code" placeholder="Laisse vide pour ne pas verrouiller" value="'+escapeHtml(state._draftAccessCode||"")+'" />' +

        '</div>' +
      '</div>' +

      (state.lastEventErr ? '<div class="banner warn">'+escapeHtml(state.lastEventErr)+'</div>' : '');

    document.querySelector(".back").onclick = function(){ state.screen="home"; render(); };

    function drawTeams(){
      var wrap = document.getElementById("teams-list");
      wrap.innerHTML = state._draftTeams.map(function(t, i){
        var icon = t.name === "Staff" ? '<span style="font-size:12px;">👑</span>' : '<span class="dot" style="background:'+t.color+'"></span>';
        return '<span class="team-chip" style="color:'+t.color+'">'+icon+escapeHtml(t.name)+
          (state._draftTeams.length>1 ? '<button class="remove-chip" data-i="'+i+'">✕</button>' : '')+'</span>';
      }).join("");
      Array.prototype.forEach.call(wrap.querySelectorAll(".remove-chip"), function(btn){
        btn.onclick = function(){ state._draftTeams.splice(+btn.dataset.i,1); drawTeams(); };
      });
    }
    drawTeams();

    document.getElementById("btn-add-team").onclick = function(){
      var used = state._draftTeams.map(function(t){return t.name;});
      var candidates = [STAFF_TEAM].concat(TEAM_COLORS);
      var next = candidates.find(function(t){ return used.indexOf(t.name) === -1; });
      if(!next){
        var idx = state._draftTeams.length+1;
        next = { name: "Équipe "+idx, color: "#9b59b6" };
      }
      state._draftTeams.push(next);
      drawTeams();
    };

    document.getElementById("ev-name").oninput = function(e){ state._draftName = e.target.value; };
    document.getElementById("ev-access-code").oninput = function(e){ state._draftAccessCode = e.target.value; };

    document.getElementById("btn-generate").onclick = async function(){

        code: code,
        name: state._draftName.trim(),

        zoom: 17,
        createdAt: Date.now(),

        scoreIntervalSeconds: 30,
        accessCode: (state._draftAccessCode||"").trim() || null
      };
      var ok = await saveEventConfig(cfg);
      if(!ok){ state.lastEventErr = "Impossible de créer l'événement pour l'instant. Réessaie."; render(); return; }
      state.event = cfg;
      state.isOrganizer = true;
      state.orgAccessUnlocked = true; // il vient de choisir ce code lui-même, pas besoin de le retaper
      state.lastEventErr = "";
      state.zonesSaveWarning = "";
      await saveVisibility(code, { revealedTeams: [], adminId: state.playerId });
      if(state._draftZones.length){
        var zonesOk = await saveZones(code, state._draftZones);
        if(!zonesOk){
          state.zonesSaveWarning = "La carte (limite/bâtiments/points) n\u2019a pas pu être enregistrée. Utilise \u00ab Éditer la carte \u00bb sur l\u2019écran carte pour la refaire.";

  function startScan(){
    var zone = document.getElementById("scan-zone");
    zone.innerHTML = '<video id="scan-video" playsinline autoplay muted></video><canvas id="scan-canvas"></canvas><p>Vise le QR code de l\u2019organisateur.</p>';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream){
      state.scanStream = stream;
      var video = document.getElementById("scan-video");
      video.srcObject = stream;
      var canvas = document.getElementById("scan-canvas");
      var ctx = canvas.getContext("2d");
      function tick(){
        if(video.readyState === video.HAVE_ENOUGH_DATA){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var code = jsQR(img.data, img.width, img.height);
          if(code && code.data){
            state.joinCodeDraft = code.data.trim().toUpperCase();
            stopScan();
            render();
            return;
          }
        }
        state.scanRAF = requestAnimationFrame(tick);
      }
      state.scanRAF = requestAnimationFrame(tick);
    }).catch(function(err){
      zone.innerHTML = '<div class="banner warn">Caméra indisponible (' + err.message + '). Entre le code manuellement ci-dessus.</div>';
    });
  }
  function stopScan(){
    if(state.scanRAF) cancelAnimationFrame(state.scanRAF);
    if(state.scanStream) state.scanStream.getTracks().forEach(function(t){ t.stop(); });
    state.scanRAF = null; state.scanStream = null;
  }

  function startEditorGeoWatch(){

      var el = document.getElementById("editor-geo-status");
      if(el) el.textContent = "Position GPS active — précision ~" + Math.round(pos.coords.accuracy) + " m";
      if(state.editorMap){
        if(state.editorMeMarker){
          state.editorMeMarker.setLatLng([state.lastCoords.lat, state.lastCoords.lng]);
        } else {
          state.editorMeMarker = L.circleMarker([state.lastCoords.lat, state.lastCoords.lng], {
            radius:7, color:"#c9a227", weight:2, fillColor:"#c9a227", fillOpacity:0.5
          }).addTo(state.editorMap).bindTooltip("Toi");
        }
      }
    }, function(err){
      var el = document.getElementById("editor-geo-status");
      if(el) el.textContent = "Position GPS indisponible (" + err.message + ") — tu peux quand même placer les points en touchant la carte.";
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }

  function stopEditorGeoWatch(){
    if(state.editorWatchId !== null && navigator.geolocation){
      navigator.geolocation.clearWatch(state.editorWatchId);

    }

  // ---------- Image de référence superposée (aide au tracé, locale au téléphone) ----------
  // Ne quitte jamais l'appareil : ni enregistrée sur Firebase, ni envoyée aux autres joueurs.
  // Sert uniquement à caler visuellement les tracés (bâtiments, murs, drapeaux…) sur un plan
  // existant (PDF exporté en image, photo drone, plan à main levée…) pendant l'édition.
  // L'image est définie par ses limites nord/sud/est/ouest (comme un rectangle), plutôt que
  // deux points saisis au tap — bien plus précis à ajuster avec 4 vraies poignées qu'à
  // positionner du premier coup en tapant sur un petit écran.
  function updateRefImageOverlayPosition(){
    if(!state.editorMap || !state.refImageBounds || !state.refImageOverlayEl) return;
    var map = state.editorMap;
    var b = state.refImageBounds;
    // latLngToLayerPoint (et non containerPoint) : notre image vit dans un vrai panneau
    // Leaflet, qui suit déjà automatiquement les déplacements de la carte.
    var p1 = map.latLngToLayerPoint([b.north, b.west]);
    var p2 = map.latLngToLayerPoint([b.south, b.east]);
    var left = Math.min(p1.x, p2.x), top = Math.min(p1.y, p2.y);
    var width = Math.abs(p2.x - p1.x), height = Math.abs(p2.y - p1.y);
    var el = state.refImageOverlayEl;
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.style.width = width + "px";
    el.style.height = height + "px";
    el.style.transform = "rotate(" + (state.refImageRotation||0) + "deg)";
  }

  function createRefImageOverlay(){
    if(!state.editorMap || !state.refImageDataUrl) return;
    if(state.refImageOverlayEl && state.refImageOverlayEl.parentNode){ state.refImageOverlayEl.parentNode.removeChild(state.refImageOverlayEl); }
    var map = state.editorMap;
    // Un vrai panneau Leaflet (au lieu d'ajouter l'image directement dans le conteneur) :
    // garantit qu'elle reste correctement superposée et synchronisée avec la carte lors
    // des déplacements/zooms, en s'appuyant sur le système de positionnement de Leaflet
    // plutôt que sur un calcul manuel approximatif.
    if(!map.getPane("refImagePane")){
      var pane = map.createPane("refImagePane");
      pane.style.zIndex = 350; // au-dessus des tuiles (≈200), en dessous des zones/marqueurs (≈400+)
      pane.style.pointerEvents = "none";
    }
    var el = document.createElement("img");
    el.src = state.refImageDataUrl;
    el.style.position = "absolute";
    el.style.opacity = state.refImageOpacity;
    el.style.transformOrigin = "center center";
    map.getPane("refImagePane").appendChild(el);
    state.refImageOverlayEl = el;
    updateRefImageOverlayPosition();
  }

  // Place l'image d'entrée de jeu au centre de la vue actuelle, sur environ 70% de l'écran
  // visible — le joueur n'a alors plus qu'à ajuster les 4 coins, sans avoir à taper deux
  // points précis du premier coup.
  function placeDefaultRefImageBounds(){
    if(!state.editorMap) return;
    var b = state.editorMap.getBounds();
    var latPad = (b.getNorth() - b.getSouth()) * 0.15;
    var lngPad = (b.getEast() - b.getWest()) * 0.15;
    state.refImageBounds = {
      north: b.getNorth() - latPad, south: b.getSouth() + latPad,
      east: b.getEast() - lngPad, west: b.getWest() + lngPad
    };
  }

  function clearRefImageCornerHandles(){
    (state.refImageHandles||[]).forEach(function(h){ if(state.editorMap) state.editorMap.removeLayer(h); });
    state.refImageHandles = [];
  }

  // Quatre poignées, une par coin — comme pour les bâtiments. Chaque poignée ne contrôle que
  // SES deux bords propres (ex. la poignée haut-gauche déplace le nord et l'ouest), le coin
  // opposé reste fixe pendant qu'on ajuste : un comportement de redimensionnement classique.
  function renderRefImageCornerHandles(){
    if(!state.editorMap || !state.refImageBounds) return;
    clearRefImageCornerHandles();
    var b = state.refImageBounds;
    var corners = [
      { lat: b.north, lng: b.west, setLat:"north", setLng:"west" },
      { lat: b.north, lng: b.east, setLat:"north", setLng:"east" },
      { lat: b.south, lng: b.east, setLat:"south", setLng:"east" },
      { lat: b.south, lng: b.west, setLat:"south", setLng:"west" }
    ];
    corners.forEach(function(c){
      var handle = L.marker([c.lat, c.lng], { icon: vertexHandleIcon(), draggable: true }).addTo(state.editorMap);
      handle.on('drag', function(e){
        var ll = e.target.getLatLng();
        state.refImageBounds[c.setLat] = ll.lat;
        state.refImageBounds[c.setLng] = ll.lng;
        updateRefImageOverlayPosition();
      });
      state.refImageHandles.push(handle);
    });
  }

  function renderRefImageControls(){
    var el = document.getElementById("ref-image-controls");
    if(!el) return;

    if(!state.refImageDataUrl){
      clearRefImageCornerHandles();
      el.innerHTML =
        '<input type="file" accept="image/*" id="ref-image-file" style="display:none;" />' +
        '<button class="btn btn-sm btn-ghost" id="btn-ref-image-pick">Choisir une image</button>';
      document.getElementById("btn-ref-image-pick").onclick = function(){
        document.getElementById("ref-image-file").click();
      };
      document.getElementById("ref-image-file").onchange = function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          state.refImageDataUrl = ev.target.result;
          placeDefaultRefImageBounds();
          createRefImageOverlay();
          renderRefImageCornerHandles();
          renderRefImageControls();
        };
        reader.readAsDataURL(file);
      };
      return;
    }

    el.innerHTML =
      '<p class="mono" style="font-size:11px;color:var(--ink-dim);">Fais glisser un des 4 coins sur la carte pour ajuster la taille et la position.</p>' +
      '<div class="field"><label id="ref-image-rot-label">Rotation ('+Math.round(state.refImageRotation)+'\u00b0)</label>' +
        '<input type="range" id="ref-image-rotation" min="0" max="359" value="'+Math.round(state.refImageRotation)+'" /></div>' +
      '<div class="field"><label id="ref-image-op-label">Opacit\u00e9 ('+Math.round(state.refImageOpacity*100)+'%)</label>' +
        '<input type="range" id="ref-image-opacity" min="10" max="100" value="'+Math.round(state.refImageOpacity*100)+'" /></div>' +
      '<div class="row" style="margin-top:8px;">' +
        '<button class="btn btn-sm btn-ghost" id="btn-ref-image-reposition">Recentrer</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-ref-image-remove">Retirer l\u2019image</button>' +
      '</div>';
    document.getElementById("ref-image-rotation").oninput = function(e){
      state.refImageRotation = parseInt(e.target.value, 10) || 0;
      updateRefImageOverlayPosition();
      var lbl = document.getElementById("ref-image-rot-label");
      if(lbl) lbl.textContent = "Rotation (" + state.refImageRotation + "\u00b0)";
    };
    document.getElementById("ref-image-opacity").oninput = function(e){
      state.refImageOpacity = (parseInt(e.target.value, 10) || 10) / 100;
      if(state.refImageOverlayEl) state.refImageOverlayEl.style.opacity = state.refImageOpacity;
      var lbl = document.getElementById("ref-image-op-label");
      if(lbl) lbl.textContent = "Opacit\u00e9 (" + Math.round(state.refImageOpacity*100) + "%)";
    };
    document.getElementById("btn-ref-image-reposition").onclick = function(){
      placeDefaultRefImageBounds();
      updateRefImageOverlayPosition();
      renderRefImageCornerHandles();
    };
    document.getElementById("btn-ref-image-remove").onclick = function(){
      clearRefImageCornerHandles();
      if(state.refImageOverlayEl && state.refImageOverlayEl.parentNode){ state.refImageOverlayEl.parentNode.removeChild(state.refImageOverlayEl); }
      state.refImageOverlayEl = null;
      state.refImageDataUrl = null;
      state.refImageBounds = null;
      state.refImageRotation = 0;
      renderRefImageControls();
    };
  }

  async function persistEditorZones(){
    if(state.editorMode === "live" && state.event){
      await saveZones(state.event.code, state.editorZones);
    }
  }

  // Calcule l'apparence de la zone de guerre selon le temps restant avant fermeture.
  function warzoneStyle(z){
    var remaining = (z.deactivateAt||0) - Date.now();
    if(remaining > 0){
      var totalSec = Math.ceil(remaining/1000);
      var mm = Math.floor(totalSec/60), ss = totalSec % 60;
      var label = "Ferme dans " + mm + ":" + (ss<10?"0":"") + ss;
      return { color:'#d9702e', weight:2, dashArray:'4,4', fillOpacity:0.10, active:false, label: label };
    }
    return { color:'#b3402f', weight:2, dashArray:null, fillOpacity:0.35, active:true, label: "ZONE INTERDITE" };
  }

  // ---------- Gaz évolutif (zone sûre qui rétrécit par paliers, façon Battle Royale) ----------
  // Purement calculé à partir du temps écoulé depuis "startAt" — jamais besoin d'écrire quoi
  // que ce soit pendant le rétrécissement, chaque téléphone calcule le même résultat seul.
  // Le cercle représente maintenant le DANGER (le gaz) qui s'étend depuis son centre —
  // une explosion, pas une implosion. Dedans = danger, dehors = sûr (inverse de l'ancienne
  // version). z.growAmount remplace z.shrinkAmount ; z.maxRadius (optionnel) plafonne
  // l'expansion au lieu de z.minRadius qui la plafonnait par en bas.
  function gasCurrentState(z){
    var now = Date.now();
    var phaseMs = Math.max(1, z.phaseMinutes||5) * 60000;
    var elapsed = Math.max(0, now - (z.startAt||now));
    var cap = (typeof z.maxRadius === "number" && z.maxRadius > 0) ? z.maxRadius : Infinity;
    if(z.frozenRadius !== null && z.frozenRadius !== undefined){
      return { radius: z.frozenRadius, nextGrowMs: null, phase: Math.floor(elapsed/phaseMs) };
    }
    var phasesElapsed = Math.floor(elapsed / phaseMs);
    var radius = Math.min(cap, (z.initialRadius||10) + phasesElapsed * (z.growAmount||10));
    var msIntoPhase = elapsed % phaseMs;
    var nextGrowMs = (radius < cap) ? (phaseMs - msIntoPhase) : null;
    return { radius: radius, nextGrowMs: nextGrowMs, phase: phasesElapsed };
  }

  function addZoneLayer(map, z){
    var layer;
    if(z.kind === "point"){
      layer = L.marker(z.latlng, { icon: pointDivIcon(z) }).addTo(map).bindTooltip(escapeHtml(z.name));
      layer.on('click', function(){
        var label = distanceLabel(z.latlng[0], z.latlng[1]);
        if(label) layer.bindPopup(escapeHtml(z.name) + ' — ' + label).openPopup();
      });
    } else if(z.kind === "terrain"){
      layer = L.polygon(z.points, { color:'#c9a227', weight:2, dashArray:'6,6', fillOpacity:0.04 })
        .addTo(map).bindTooltip(escapeHtml(z.name || "Limite du terrain"));
    } else if(z.kind === "guerre"){
      var wz = warzoneStyle(z);
      layer = L.polygon(z.points, {
        color: wz.color, weight: wz.weight, fillColor: wz.color, fillOpacity: wz.fillOpacity,
        dashArray: wz.dashArray, className: wz.active ? 'zone-objectif' : ''
      }).addTo(map).bindTooltip(escapeHtml(z.name) + ' · ' + wz.label);
    } else if(z.kind === "mur" || z.kind === "demimur"){
      var isHalf = z.kind === "demimur";
      layer = L.polyline(z.points, { color:'#8b9184', weight: isHalf ? 3 : 5, dashArray: isHalf ? '5,5' : null })
        .addTo(map).bindTooltip(escapeHtml(z.name || (isHalf ? "Demi-mur" : "Mur")));
    } else if(z.kind === "drapeau"){
      var ownerColor = z.captureOwner ? teamColor(state.event || {}, z.captureOwner) : '#8f8b7a';
      var flagLabel = z.captureOwner ? (escapeHtml(z.name) + ' · tenue par ' + escapeHtml(z.captureOwner)) :
        (z.captureTarget ? (escapeHtml(z.name) + ' · capture par ' + escapeHtml(z.captureTarget) + ' (' + Math.round(z.captureProgress||0) + '%)') : (escapeHtml(z.name) + ' · neutre'));
      layer = L.polygon(z.points, {
        color: ownerColor, weight:2.5, fillColor: ownerColor, fillOpacity: z.captureOwner ? 0.3 : 0.12
      }).addTo(map).bindTooltip(flagLabel);
    } else if(z.kind === "gaz"){
      var gs = gasCurrentState(z);
      var pts = circlePolygonPoints(z.center.lat, z.center.lng, gs.radius, 40);
      var gasLabel = escapeHtml(z.name) + ' · gaz ' + Math.round(gs.radius) + ' m';
      layer = L.polygon(pts, { color:'#b3402f', weight:2.5, fillColor:'#b3402f', fillOpacity:0.18 })
        .addTo(map).bindTooltip(gasLabel);
    } else {
      var info = zoneStatusInfo(z.status);
      layer = L.polygon(z.points, {
        color: info.color, weight:2, fillColor: info.color, fillOpacity:0.28,
        className: z.status === 'objectif' ? 'zone-objectif' : ''
      }).addTo(map).bindTooltip(escapeHtml(z.name) + ' · ' + info.label);
    }
    return layer;
  }

  function vertexHandleIcon(){
    return L.divIcon({
      html: '<div style="width:14px;height:14px;border-radius:50%;background:#e8e6d9;border:2px solid #14170f;box-shadow:0 1px 3px rgba(0,0,0,.6);"></div>',
      className: "", iconSize:[14,14], iconAnchor:[7,7]
    });
  }

  // Version éditable réservée à l'éditeur : sommets et points déplaçables au doigt,
  // pour corriger la taille/position d'un tracé après coup (jamais utilisée sur la carte en direct des joueurs).
  function addEditableZoneLayer(map, z){
    var isEditingThis = state.editingZoneId === z.id;

    if(z.kind === "point"){
      var marker = L.marker(z.latlng, { icon: pointDivIcon(z), draggable: isEditingThis }).addTo(map).bindTooltip(escapeHtml(z.name));
      marker.on('click', function(){
        state.editingZoneId = isEditingThis ? null : z.id;
        drawExistingZones();
      });
      marker.on('dragend', async function(e){
        var ll = e.target.getLatLng();
        z.latlng = [ll.lat, ll.lng];
        await persistEditorZones();
      });
      return [marker];
    }

    if(z.kind === "gaz"){
      var gs = gasCurrentState(z);
      var pts = circlePolygonPoints(z.center.lat, z.center.lng, gs.radius, 40);
      var poly2 = L.polygon(pts, { color:'#b3402f', weight:2.5, fillColor:'#b3402f', fillOpacity:0.18 })
        .addTo(map).bindTooltip(escapeHtml(z.name) + ' · gaz ' + Math.round(gs.radius) + ' m (calculé automatiquement, pas de sommets à déplacer)');
      poly2.on('click', function(){
        state.editingZoneId = isEditingThis ? null : z.id;
        drawExistingZones();
      });
      var centerMarker = L.marker([z.center.lat, z.center.lng], { icon: vertexHandleIcon(), draggable: isEditingThis }).addTo(map);
      centerMarker.on('dragend', async function(e){
        var ll = e.target.getLatLng();
        z.center = { lat: ll.lat, lng: ll.lng };
        await persistEditorZones();
        drawExistingZones();
      });
      return [poly2, centerMarker];
    }

    var isTerrain = z.kind === "terrain";
    var isWarzone = z.kind === "guerre";
    var isWall = z.kind === "mur" || z.kind === "demimur";
    var isFlag = z.kind === "drapeau";
    var style, useLine = false;
    if(isTerrain){ style = { color:'#c9a227', weight:2, dashArray:'6,6', fillOpacity:0.04 }; }
    else if(isWarzone){ var wz = warzoneStyle(z); style = { color: wz.color, weight: wz.weight, fillColor: wz.color, fillOpacity: wz.fillOpacity, dashArray: wz.dashArray }; }
    else if(isWall){ useLine = true; var isHalf = z.kind === "demimur"; style = { color:'#8b9184', weight: isHalf?3:5, dashArray: isHalf?'5,5':null }; }
    else if(isFlag){ var flagColor = z.captureOwner ? teamColor(state.event || {}, z.captureOwner) : '#8f8b7a'; style = { color: flagColor, weight:2.5, fillColor: flagColor, fillOpacity: z.captureOwner ? 0.3 : 0.12 }; }
    else{ var info = zoneStatusInfo(z.status); style = { color: info.color, weight:2, fillColor: info.color, fillOpacity:0.28 }; }
    var tooltipTxt = isTerrain ? (z.name || "Limite du terrain") : (isWarzone ? (z.name + ' · ' + warzoneStyle(z).label) : (isWall ? (z.name || (z.kind==="demimur"?"Demi-mur":"Mur")) : (isFlag ? (z.name + (z.captureOwner ? ' · '+z.captureOwner : ' · neutre')) : z.name)));
    var poly = (useLine ? L.polyline(z.points, style) : L.polygon(z.points, style)).addTo(map).bindTooltip(escapeHtml(tooltipTxt));
    poly.on('click', function(){
      state.editingZoneId = isEditingThis ? null : z.id;
      drawExistingZones();
    });
    var layers = [poly];

    if(isEditingThis){
      renderSegmentLabels(map, z.points, !useLine);
      z.points.forEach(function(pt, idx){
        var handle = L.marker(pt, { icon: vertexHandleIcon(), draggable: true }).addTo(map);
        handle.on('drag', function(e){
          var ll = e.target.getLatLng();
          z.points[idx] = [ll.lat, ll.lng];
          poly.setLatLngs(z.points);
          renderSegmentLabels(map, z.points, !useLine);
        });
        handle.on('dragend', async function(){ await persistEditorZones(); });
        layers.push(handle);
      });
    }

    return layers;
  }

  function orderedZones(zones){
    // la limite de terrain d'abord (dessous), puis les zones de guerre et le gaz, puis les
    // bâtiments et drapeaux, puis les murs, puis les points (dessus)
    return zones.filter(function(z){ return z.kind === "terrain"; })
      .concat(zones.filter(function(z){ return z.kind === "guerre" || z.kind === "gaz"; }))
      .concat(zones.filter(function(z){ return z.kind === "building" || z.kind === "drapeau" || !z.kind; }))
      .concat(zones.filter(function(z){ return z.kind === "mur" || z.kind === "demimur"; }))
      .concat(zones.filter(function(z){ return z.kind === "point"; }));
  }

  function drawExistingZones(){
    if(!state.editorMap) return;
    Object.keys(state.editorLayers).forEach(function(id){
      var layers = state.editorLayers[id] || [];
      layers.forEach(function(l){ state.editorMap.removeLayer(l); });
    });
    state.editorLayers = {};
    clearSegmentLabels();
    orderedZones(state.editorZones).forEach(function(z){
      if(!isValidZone(z)) return;
      try{
        state.editorLayers[z.id] = addEditableZoneLayer(state.editorMap, z);
      }catch(e){ /* une zone corrompue ne doit pas empêcher l'affichage des autres */ }
    });
  }

  // ---------- Étiquettes de distance (mètres) sur les segments en cours de tracé/édition ----------
  function clearSegmentLabels(){
    if(state.segmentLabelLayers){
      state.segmentLabelLayers.forEach(function(l){ if(l._map) l._map.removeLayer(l); });
    }
    state.segmentLabelLayers = [];
  }
  function renderSegmentLabels(map, points, closeLoop){
    clearSegmentLabels();
    if(!map || !points || points.length < 2) return;
    var count = closeLoop ? points.length : points.length - 1;
    for(var i=0; i<count; i++){
      var a = points[i];
      var b = points[(i+1) % points.length];
      var mid = [ (a[0]+b[0])/2, (a[1]+b[1])/2 ];
      var d = distanceMeters(a[0], a[1], b[0], b[1]);
      var label = d < 10 ? (d.toFixed(1)+" m") : (Math.round(d)+" m");
      var icon = L.divIcon({ html:'<div class="seg-label">'+label+'</div>', className:'', iconSize:[54,18], iconAnchor:[27,9] });
      var marker = L.marker(mid, { icon: icon, interactive:false }).addTo(map);
      state.segmentLabelLayers.push(marker);
    }
  }

  function updateDrawPreview(){
    if(!state.editorMap) return;
    if(state.drawLayer){ state.editorMap.removeLayer(state.drawLayer); state.drawLayer = null; }
    if(state.drawPoints.length){
      var isWallKind = state.drawKind === "mur" || state.drawKind === "demimur";
      var color = state.drawKind === "terrain" ? "#c9a227" : (isWallKind ? "#8b9184" : "#3b82c4");
      state.drawLayer = isWallKind
        ? L.polyline(state.drawPoints, { color:color, dashArray:'4,4', weight:3 }).addTo(state.editorMap)
        : L.polygon(state.drawPoints, { color:color, dashArray:'4,4', weight:2, fillOpacity:0.12 }).addTo(state.editorMap);
    }
    // Pas encore refermée pendant le tracé (même pour un bâtiment/terrain) : on ne mesure
    // que les segments déjà posés, pas un segment de clôture qui n'existe pas encore.
    renderSegmentLabels(state.editorMap, state.drawPoints, false);
  }

  function drawToolbar(){
    var el = document.getElementById("editor-toolbar");
    if(!el) return;

    if(state.placingPoint){
      el.innerHTML =
        '<p class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Touche la carte pour placer le point</p>' +
        (state.lastCoords ? '<button class="btn btn-sm btn-ghost" id="btn-gps-point" style="margin-top:6px;">📍 Utiliser ma position GPS</button>' : '') +
        '<button class="btn btn-sm btn-ghost" id="btn-cancel-point" style="margin-top:6px;">Annuler</button>';
      document.getElementById("btn-cancel-point").onclick = function(){ state.placingPoint = false; drawToolbar(); };
      var gpsPointBtn = document.getElementById("btn-gps-point");
      if(gpsPointBtn) gpsPointBtn.onclick = function(){ openPointForm([state.lastCoords.lat, state.lastCoords.lng]); };
      return;
    }

    if(!state.drawing){
      var hasTerrain = state.editorZones.some(function(z){ return z.kind === "terrain"; });
      el.innerHTML =
        '<div class="row">' +
          '<button class="btn btn-sm '+(hasTerrain ? 'btn-ghost' : 'btn-primary')+'" id="btn-start-terrain">'+(hasTerrain ? 'Redéfinir la limite' : '+ Limite du terrain')+'</button>' +
        '</div>' +
        '<div class="row" style="margin-top:6px;">' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-draw">+ Bâtiment</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-point">+ Point</button>' +
        '</div>' +
        '<div class="row" style="margin-top:6px;">' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-wall">🧱 Mur</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-halfwall">⬜ Demi-mur</button>' +
        '</div>' +
        '<div class="row" style="margin-top:6px;">' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-warzone">☢️ Warzone</button>' +
          '<button class="btn btn-sm btn-ghost" id="btn-start-flag">🚩 Drapeau</button>' +
        '</div>';
      document.getElementById("btn-start-terrain").onclick = function(){ state.editingZoneId = null; state.drawing = true; state.drawKind = "terrain"; state.drawPoints = []; state.drawPointsRedo = []; drawExistingZones(); drawToolbar(); };
      document.getElementById("btn-start-draw").onclick = function(){ state.editingZoneId = null; state.drawing = true; state.drawKind = "building"; state.drawPoints = []; state.drawPointsRedo = []; drawExistingZones(); drawToolbar(); };
      document.getElementById("btn-start-point").onclick = function(){ state.editingZoneId = null; state.placingPoint = true; drawExistingZones(); drawToolbar(); };
      document.getElementById("btn-start-wall").onclick = function(){ state.editingZoneId = null; state.drawing = true; state.drawKind = "mur"; state.drawPoints = []; state.drawPointsRedo = []; drawExistingZones(); drawToolbar(); };
      document.getElementById("btn-start-halfwall").onclick = function(){ state.editingZoneId = null; state.drawing = true; state.drawKind = "demimur"; state.drawPoints = []; state.drawPointsRedo = []; drawExistingZones(); drawToolbar(); };
      document.getElementById("btn-start-warzone").onclick = function(){ state.editingZoneId = null; showWarzoneCreationChoice(); };
      document.getElementById("btn-start-flag").onclick = function(){ state.editingZoneId = null; showFlagCreationChoice(); };
      return;
    }

    var isWallKind = state.drawKind === "mur" || state.drawKind === "demimur";
    var minPts = isWallKind ? 2 : 3;
    var label = state.drawKind === "terrain" ? "coin de la limite du terrain" : (state.drawKind === "guerre" ? "coin de la Warzone" : (state.drawKind === "drapeau" ? "coin de la zone drapeau" : (isWallKind ? "point du tracé" : "coin du bâtiment")));
    el.innerHTML =
      '<span class="mono" style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;">Points placés : '+state.drawPoints.length+' (min. '+minPts+')</span>' +
      '<div class="row" style="margin-top:6px;">' +
        '<button class="btn btn-sm btn-ghost" id="btn-undo-point"'+(state.drawPoints.length?'':' disabled')+'>↩️ Dernier point</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-redo-point"'+(state.drawPointsRedo.length?'':' disabled')+'>↪️ Rétablir</button>' +
      '</div>' +
      '<div class="row" style="margin-top:6px;">' +
        '<button class="btn btn-sm btn-primary" id="btn-finish-draw"'+(state.drawPoints.length<minPts?' disabled':'')+'>Terminer</button>' +
        '<button class="btn btn-sm btn-ghost" id="btn-cancel-draw">Annuler</button>' +
      '</div>' +
      (state.lastCoords ? '<button class="btn btn-sm btn-ghost" id="btn-gps-vertex" style="margin-top:6px;">📍 Ajouter ma position GPS ici</button>' : '') +
      '<p style="margin-top:6px;">'+(isWallKind ? 'Touche la carte pour tracer le mur point par point (pas besoin de refermer la forme), ou déplace-toi sur place et utilise ta position GPS.' : ('Touche la carte pour placer chaque '+label+', ou déplace-toi sur place et utilise ta position GPS.'))+'</p>';
    if(state.drawPoints.length>=minPts){
      document.getElementById("btn-finish-draw").onclick = finishDrawing;
    }
    document.getElementById("btn-undo-point").onclick = function(){
      if(!state.drawPoints.length) return;
      state.drawPointsRedo.push(state.drawPoints.pop());
      updateDrawPreview();
      drawToolbar();
    };
    document.getElementById("btn-redo-point").onclick = function(){
      if(!state.drawPointsRedo.length) return;
      state.drawPoints.push(state.drawPointsRedo.pop());
      updateDrawPreview();
      drawToolbar();
    };
    var gpsVertexBtn = document.getElementById("btn-gps-vertex");
    if(gpsVertexBtn) gpsVertexBtn.onclick = function(){
      state.drawPoints.push([state.lastCoords.lat, state.lastCoords.lng]);
      state.drawPointsRedo = [];
      if(state.editorMap) state.editorMap.panTo([state.lastCoords.lat, state.lastCoords.lng]);
      updateDrawPreview();
      drawToolbar();
    };
    document.getElementById("btn-cancel-draw").onclick = function(){
      state.drawing = false; state.drawPoints = []; state.drawKind = null; state.drawPointsRedo = [];
      updateDrawPreview();
      drawToolbar();
    };
  }

  // ---------- Réglages de capture/score (visibles en direct, l'organisateur décide) ----------
  function renderCaptureSettingsPanel(){
    var el = document.getElementById("capture-settings-panel");
    if(!el) return;
    if(state.editorMode !== "live" || !state.event){ el.innerHTML = ""; return; }
    var cfg = state.event;
    el.innerHTML =

    });
